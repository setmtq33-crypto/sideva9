<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Survey Harga - SI-DEVA 9</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

</head>
<body>

<h1>Survey Harga</h1>

<hr>

<a href="javascript:history.back()">
    Kembali
</a>

|

<button onclick="logout()">
    Logout
</button>

<hr>


<div id="surveyInfo">
Loading...
</div>

<hr>

<h3>Tambah Survey Harga</h3>

<input
    id="vendorName"
    placeholder="Nama Penyedia">

<br><br>

<input
    id="surveyPrice"
    type="number"
    placeholder="Harga Survey">

<br><br>

<input
    id="negotiatedPrice"
    type="number"
    placeholder="Harga Negosiasi">

<br><br>

<textarea
    id="notes"
    placeholder="Catatan"></textarea>

<br><br>

<button onclick="saveSurvey()">
    Simpan Survey
</button>

<hr>

<h3>Daftar Survey</h3>

<div id="surveyList">
Loading...
</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const packageItemId =
    params.get("package_item_id");

async function loadSurveys() {

    const { data, error } =
        await window.supabaseClient
            .from("price_surveys")
            .select("*")
            .eq(
                "package_item_id",
                packageItemId
            )
            .order(
                "negotiated_price",
                {
                    ascending:true
                }
            );

    if(error){

        console.error(error);

        document
            .getElementById(
                "surveyList"
            )
            .innerHTML =
            error.message;

        return;
    }

    document
        .getElementById(
            "surveyList"
        )
        .innerHTML =
        data.map(item => `
            <div style="
                border:1px solid #ccc;
                padding:10px;
                margin-bottom:10px;
            ">

                <b>${item.vendor_name}</b>

                <br>

                Harga Survey:
                ${item.survey_price}

                <br>

                Harga Negosiasi:
                ${item.negotiated_price ?? "-"}

                <br>

                Kandidat:
                ${item.is_candidate ? "YA" : "TIDAK"}

                <br>

                Pemenang:
                ${item.is_winner ? "YA" : "TIDAK"}

                <br>

                Catatan:
                ${item.notes ?? "-"}

            </div>
        `).join("")
        || "Belum ada survey";
}

async function saveSurvey() {

    const { data: profile } =
        await window.supabaseClient
            .from("profiles")
            .select("*")
            .limit(1)
            .single();

    const { error } =
        await window.supabaseClient
            .from("price_surveys")
            .insert([{

                tenant_id:
                    profile.tenant_id,

                opd_id:
                    profile.opd_id,

                package_item_id:
                    packageItemId,

                vendor_name:
                    document
                        .getElementById(
                            "vendorName"
                        )
                        .value,

                survey_price:
                    parseFloat(
                        document
                            .getElementById(
                                "surveyPrice"
                            )
                            .value || 0
                    ),

                negotiated_price:
                    parseFloat(
                        document
                            .getElementById(
                                "negotiatedPrice"
                            )
                            .value || 0
                    ),

                notes:
                    document
                        .getElementById(
                            "notes"
                        )
                        .value,

                survey_date:
                    new Date()
                        .toISOString()
                        .substring(0,10)

            }]);

    if(error){

        alert(error.message);

        console.error(error);

        return;
    }

    alert(
        "Survey berhasil disimpan"
    );

    async function logout() {

    await window.supabaseClient
        .auth
        .signOut();

    window.location.href =
        "login.html";
}


    

    loadSurveys();
}

loadSurveys();

</script>

</body>
</html>
