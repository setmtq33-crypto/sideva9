<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Master PPK / KPA - SIDEVA9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-light">

<div id="sidebar-container"></div>

<div class="main-content" style="margin-left: 256px; min-height: 100vh;">
    <div id="topbar-container"></div>

    <div class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold text-dark mb-1"><i class="bi bi-person-badge text-primary me-2"></i>Master PPK / KPA</h4>
                <p class="text-muted small mb-0">Manajemen data Pejabat Pembuat Komitmen dan Kuasa Pengguna Anggaran</p>
            </div>
            <button onclick="logout()" class="btn btn-sm btn-outline-danger shadow-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Keluar
            </button>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="card-title fw-bold text-secondary mb-3"><i class="bi bi-plus-circle me-1"></i> Tambah PPK / KPA Baru</h5>
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Nama Lengkap</label>
                        <input id="fullName" class="form-control" placeholder="Nama Pejabat">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold">NIP</label>
                        <input id="nip" class="form-control" placeholder="NIP">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Jabatan</label>
                        <input id="position" class="form-control" placeholder="Jabatan">
                    </div>
                    <div class="col-md-2" id="opdContainer" style="display:none;">
                        <label class="form-label small fw-semibold text-info">Penempatan OPD</label>
                        <select id="opdSelect" class="form-select border-info"></select>
                    </div>
                    <div class="col-md-2">
                        <button onclick="savePPKOM()" class="btn btn-primary w-100 shadow-sm">Simpan Data</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="p-3 bg-light border-bottom">
                    <h6 class="mb-0 fw-bold text-secondary"><i class="bi bi-list-task me-1"></i> Daftar PPK / KPA Terdaftar</h6>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-uppercase fs-7 tracking-wider">
                            <tr>
                                <th class="ps-4">Nama PPK / KPA</th>
                                <th>NIP</th>
                                <th>Jabatan</th>
                                <th class="text-end pe-4" style="width: 150px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="ppkomList">
                            <tr><td colspan="4" class="text-center py-5 text-muted">Memuat data pejabat...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Edit -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Data PPK / KPA</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="editFullName" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">NIP</label>
                    <input type="text" id="editNip" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Jabatan</label>
                    <input type="text" id="editPosition" class="form-control">
                </div>
                <div class="mb-3" id="editOpdContainer" style="display:none;">
                    <label class="form-label">Penempatan OPD</label>
                    <select id="editOpdSelect" class="form-select"></select>
                </div>
            </div>
            <div class="modal-header gap-2 justify-content-end border-top-0 pt-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="button" onclick="updatePPKOM()" class="btn btn-success">Simpan Perubahan</button>
            </div>
        </div>
    </div>
</div>

<script>
let profile = null;
let editModalBs = null;

async function init() {
    await loadLayout();
    profile = await getProfile();
    if (!profile) return;

    editModalBs = new bootstrap.Modal(document.getElementById('editModal'));
    
    if (profile.role === 'SUPER_ADMIN') {
        document.getElementById('opdContainer').style.display = 'block';
        document.getElementById('editOpdContainer').style.display = 'block';
        
        const { data } = await window.supabaseClient.from('opds').select('id, name').order('name');
        if (data) {
            const select = document.getElementById('opdSelect');
            const editSelect = document.getElementById('editOpdSelect');
            data.forEach(o => {
                select.innerHTML += `<option value="${o.id}">${o.name}</option>`;
                editSelect.innerHTML += `<option value="${o.id}">${o.name}</option>`;
            });
        }
    }
    await loadPPKOMs();
}

async function savePPKOM() {
    const full_name = document.getElementById("fullName").value.trim();
    const nip = document.getElementById("nip").value.trim();
    const position = document.getElementById("position").value.trim();
    const opd_id = profile.role === 'SUPER_ADMIN' ? document.getElementById("opdSelect").value : profile.opd_id;

    if (!full_name || !nip || !position) return alert("Semua kolom wajib diisi!");

    const { error } = await window.supabaseClient.from("ppkoms").insert([{
        tenant_id: profile.tenant_id,
        opd_id, full_name, nip, position
    }]);

    if (error) return alert("Gagal menyimpan data: " + error.message);
    alert("Data Pejabat PPK/KPA berhasil disimpan.");
    document.querySelectorAll('.card-body input').forEach(i => i.value = '');
    await loadPPKOMs();
}

async function loadPPKOMs() {
    let query = window.supabaseClient.from("ppkoms").select("*").order("full_name");
    if (profile.role !== "SUPER_ADMIN") query = query.eq("opd_id", profile.opd_id);

    const { data, error } = await query;
    const container = document.getElementById("ppkomList");

    if (error) {
        container.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Gagal memuat data.</td></tr>`;
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Belum ada data PPK / KPA.</td></tr>`;
        return;
    }

    container.innerHTML = data.map(item => `
        <tr>
            <td class="ps-4 fw-bold text-dark">${item.full_name}</td>
            <td class="text-secondary">${item.nip}</td>
            <td><span class="badge bg-light text-dark border px-2 py-1">${item.position}</span></td>
            <td class="text-end pe-4">
                <button class="btn btn-sm btn-warning" onclick="openEditModal('${item.id}', '${item.full_name}', '${item.nip}', '${item.position}', '${item.opd_id}')"><i class="bi bi-pencil-square"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deletePPKOM('${item.id}')"><i class="bi bi-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

function openEditModal(id, name, nip, position, opd_id) {
    document.getElementById('editId').value = id;
    document.getElementById('editFullName').value = name;
    document.getElementById('editNip').value = nip;
    document.getElementById('editPosition').value = position;
    if (profile.role === 'SUPER_ADMIN') {
        document.getElementById('editOpdSelect').value = opd_id;
    }
    editModalBs.show();
}

async function updatePPKOM() {
    const id = document.getElementById('editId').value;
    const full_name = document.getElementById('editFullName').value.trim();
    const nip = document.getElementById('editNip').value.trim();
    const position = document.getElementById('editPosition').value.trim();
    const opd_id = profile.role === 'SUPER_ADMIN' ? document.getElementById("editOpdSelect").value : profile.opd_id;

    if (!full_name || !nip || !position) return alert("Semua kolom wajib diisi!");

    const { error } = await window.supabaseClient.from("ppkoms")
        .update({ full_name, nip, position, opd_id })
        .eq('id', id);

    if (error) return alert("Gagal mengupdate: " + error.message);
    alert("Data berhasil diubah!");
    editModalBs.hide();
    loadPPKOMs();
}

async function deletePPKOM(id) {
    if (!confirm("Apakah Anda yakin ingin menghapus data PPK/KPA ini?")) return;
    const { error } = await window.supabaseClient.from("ppkoms").delete().eq('id', id);
    if (error) return alert("Gagal menghapus: " + error.message);
    alert("Data berhasil dihapus!");
    loadPPKOMs();
}

init();
</script>
</body>
</html>
