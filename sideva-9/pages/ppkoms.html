<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Master PPK / KPA - SIDEVA9</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-light">

<!-- Komponen Sidebar Masuk Sini Otomatis via layout.js -->
<div id="sidebar-container"></div>

<!-- Area Utama Aplikasi (Menyesuaikan dengan lebar sidebar) -->
<div class="main-content" style="margin-left: 256px; min-height: 100vh;">
    <!-- Komponen Topbar Masuk Sini -->
    <div id="topbar-container"></div>

    <div class="container-fluid px-4 py-4">
        <!-- Header Halaman -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold text-dark mb-1"><i class="bi bi-person-badge text-primary me-2"></i>Master PPK / KPA</h4>
                <p class="text-muted small mb-0">Manajemen data Pejabat Pembuat Komitmen dan Kuasa Pengguna Anggaran</p>
            </div>
            <button onclick="logout()" class="btn btn-sm btn-outline-danger shadow-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Keluar
            </button>
        </div>

        <!-- Formulir Tambah Data -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="card-title fw-bold text-secondary mb-3">
                    <i class="bi bi-plus-circle me-1"></i> Tambah PPK / KPA Baru
                </h5>
                
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Nama Lengkap</label>
                        <input id="fullName" class="form-control" placeholder="Contoh: Nama Pejabat, S.T.">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold">NIP</label>
                        <input id="nip" class="form-control" placeholder="199XXXXXXXXXXXXXXX">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Jabatan</label>
                        <input id="position" class="form-control" placeholder="Contoh: PPK Fisik / KPA Bidang">
                    </div>
                    
                    <!-- Hanya tampil untuk peran SUPER_ADMIN -->
                    <div class="col-md-2" id="opdContainer" style="display:none;">
                        <label class="form-label small fw-semibold text-info">Penempatan OPD</label>
                        <select id="opdSelect" class="form-select border-info"></select>
                    </div>
                    
                    <div class="col-md-2">
                        <button onclick="savePPKOM()" class="btn btn-primary w-100 shadow-sm">
                            <i class="bi bi-floppy me-1"></i> Simpan Data
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabel Daftar Data -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="p-3 bg-light border-bottom">
                    <h6 class="mb-0 fw-bold text-secondary"><i class="bi bi-list-task me-1"></i> Daftar PPK / KPA Terdaftar</h6>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-uppercase fs-7 tracking-wider">
                            <tr>
                                <th class="ps-4">Nama PPK / KPA</th>
                                <th>NIP</th>
                                <th>Jabatan</th>
                            </tr>
                        </thead>
                        <tbody id="ppkomList">
                            <tr>
                                <td colspan="3" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                    Memuat data pejabat...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script>
let profile = null;

async function init() {
    // Memuat struktur layout global (sidebar & topbar)
    await loadLayout();
    
    // Mengambil profil pengguna terotentikasi
    profile = await getProfile();
    if (!profile) return;
    
    // Penanganan Khusus untuk peran SUPER_ADMIN
    if (profile.role === 'SUPER_ADMIN') {
        document.getElementById('opdContainer').style.display = 'block';
        
        // Mengambil daftar OPD untuk pilihan penyimpanan
        const { data, error } = await window.supabaseClient
            .from('opds')
            .select('id, name')
            .order('name');
            
        if (!error && data) {
            const select = document.getElementById('opdSelect');
            select.innerHTML = data.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
        }
    }
    
    // Tampilkan daftar data pejabat
    await loadPPKOMs();
}

async function savePPKOM() {
    const full_name = document.getElementById("fullName").value.trim();
    const nip = document.getElementById("nip").value.trim();
    const position = document.getElementById("position").value.trim();
    
    // Jika Super Admin, ambil nilai dari dropdown. Jika tidak, ambil dari profil OPD asalnya
    const opd_id = profile.role === 'SUPER_ADMIN' 
        ? document.getElementById("opdSelect").value 
        : profile.opd_id;

    if (!full_name || !nip || !position) {
        alert("Nama, NIP, dan Jabatan wajib diisi secara lengkap.");
        return;
    }
    
    if (!opd_id) {
        alert("ID OPD tujuan tidak valid atau belum dipilih.");
        return;
    }

    const { error } = await window.supabaseClient
        .from("ppkoms")
        .insert([{
            tenant_id: profile.tenant_id,
            opd_id: opd_id,
            full_name: full_name,
            nip: nip,
            position: position
        }]);

    if (error) {
        alert("Gagal menyimpan data: " + error.message);
        console.error(error);
        return;
    }

    alert("Data Pejabat PPK/KPA berhasil disimpan.");
    
    // Reset isian teks formulir
    document.getElementById("fullName").value = "";
    document.getElementById("nip").value = "";
    document.getElementById("position").value = "";
    
    // Muat ulang tabel data
    await loadPPKOMs();
}

async function loadPPKOMs() {
    let query = window.supabaseClient
        .from("ppkoms")
        .select("*")
        .order("full_name");

    // Filter data berdasarkan OPD jika bukan SUPER_ADMIN
    if (profile.role !== "SUPER_ADMIN") {
        query = query.eq("opd_id", profile.opd_id);
    }

    const { data, error } = await query;
    const container = document.getElementById("ppkomList");

    if (error) {
        container.innerHTML = `<tr><td colspan="3" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-1"></i>Gagal memuat data: ${error.message}</td></tr>`;
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-4"><i class="bi bi-folder-x me-1"></i>Belum ada data PPK / KPA yang terekam.</td></tr>`;
        return;
    }

    container.innerHTML = data.map(item => `
        <tr>
            <td class="ps-4 fw-bold text-dark">${item.full_name}</td>
            <td class="text-secondary">${item.nip}</td>
            <td><span class="badge bg-light text-dark border px-2.5 py-1.5 font-medium">${item.position}</span></td>
        </tr>
    `).join('');
}

// Menjalankan fungsi inisialisasi halaman saat dokumen siap
init();
</script>

</body>
</html>
