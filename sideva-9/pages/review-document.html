<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
Review Persiapan Pengadaan
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>

<style>

body{
    background:#f4f6f9;
}

.document-card{

    background:white;

    max-width:900px;

    margin:auto;

    padding:50px;

    box-shadow:
    0 2px 12px rgba(
        0,0,0,.08
    );
}

.section-title{

    font-weight:bold;

    margin-top:25px;

    margin-bottom:15px;
}

@media print{

    .no-print{
        display:none;
    }

    .document-card{

        box-shadow:none;

        max-width:100%;

        padding:0;
    }
}

</style>

</head>

<body>

<div
class="container-fluid p-4 no-print">

<div
class="d-flex justify-content-between">

<div>

<h3>

Review Persiapan Pengadaan

</h3>

</div>

<div>

<a
href="packages.html"
class="btn btn-secondary">

Kembali

</a>

<button
id="printBtn"
class="btn btn-primary">

Cetak PDF

</button>

</div>

</div>

</div>

<div
class="document-card">

<div id="reviewContent">

Loading...

</div>

</div>

<script>

const reviewDocDb =
    window.supabaseClient;

let packageId = null;

document
.getElementById(
    'printBtn'
)
.onclick = () => {

    window.print();

};

async function init(){

    packageId =
        new URLSearchParams(
            location.search
        ).get('id');

    if(!packageId){

        alert(
            'Package ID tidak ditemukan'
        );

        return;
    }

    const profile =
        await getProfile();

    const {
        data: pkg
    } =
    await reviewDocDb
    .from('packages')
    .select('*')
    .eq(
        'id',
        packageId
    )
    .single();

    const {
        data: review
    } =
    await reviewDocDb
    .from('package_reviews')
    .select('*')
    .eq(
        'package_id',
        packageId
    )
    .maybeSingle();

    const {
        data: tenant
    } =
    await reviewDocDb
    .from('tenants')
    .select('*')
    .eq(
        'id',
        pkg.tenant_id
    )
    .single();

    const {
        data: opd
    } =
    await reviewDocDb
    .from('opds')
    .select('*')
    .eq(
        'id',
        pkg.opd_id
    )
    .single();

    document
    .getElementById(
        'reviewContent'
    )
    .innerHTML = `

    <div
    class="text-center mb-5">

        <h4>

            ${tenant?.name || ''}

        </h4>

        <h5>

            ${opd?.name || ''}

        </h5>

        <h3>

            BERITA ACARA
            REVIEW
            PERSIAPAN PENGADAAN

        </h3>

    </div>

    <p>

        Pada hari ini telah dilakukan
        review terhadap dokumen
        persiapan pengadaan untuk:

    </p>

    <table
    class="table">

        <tr>

            <td width="220">

                Nama Paket

            </td>

            <td>

                :

            </td>

            <td>

                ${pkg.package_name}

            </td>

        </tr>

        <tr>

            <td>

                Nomor RUP

            </td>

            <td>

                :

            </td>

            <td>

                ${pkg.rup_number || '-'}

            </td>

        </tr>

        <tr>

            <td>

                Pagu

            </td>

            <td>

                :

            </td>

            <td>

                Rp ${Number(
                    pkg.budget_ceiling || 0
                ).toLocaleString(
                    'id-ID'
                )}

            </td>

        </tr>

    </table>

    <div
    class="section-title">

        HASIL REVIEW

    </div>

    <p>

        ${review?.review_notes || '-'}

    </p>

    <div
    class="section-title">

        REKOMENDASI

    </div>

    <p>

        <strong>

        ${review?.recommendation || '-'}

        </strong>

    </p>

    <br><br>

    <div
    style="
    width:300px;
    margin-left:auto;
    ">

        <p>

            Reviewer

        </p>

        <br><br><br>

        <strong>

            ${profile.full_name}

        </strong>

        <br>

        ${profile.role}

    </div>

    `;
    
    await writeAuditLog(
        'REVIEW',
        'GENERATE',
        packageId,
        'Generate Dokumen Review'
    );
}

init();

</script>

</body>
</html>
