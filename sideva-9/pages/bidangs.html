<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Master Bidang - SI-DEVA 9</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>

</head>
<body>

<h1>Master Bidang</h1>

<hr>

<a href="dashboard.html">
Kembali Dashboard
</a>

|

<button onclick="logout()">
Logout
</button>

<hr>

<h3>Tambah Bidang</h3>

<input
    id="bidangName"
    placeholder="Nama Bidang"
>

<button onclick="saveBidang()">
Simpan Bidang
</button>

<hr>

<h3>Daftar Bidang</h3>

<div id="bidangList">

Loading...

</div>

<script>

let profile = null;

async function loadProfile() {

    const {
        data: { user }
    } =
    await window.supabaseClient.auth.getUser();

    if(!user){

        window.location.href =
            "login.html";

        return;
    }

    const {
        data,
        error
    } =
    await window.supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "auth_user_id",
            user.id
        )
        .single();

    if(error){

        alert(error.message);

        return;
    }

    profile = data;
}

async function saveBidang() {

    const bidang_name =
        document
            .getElementById(
                "bidangName"
            )
            .value;

    if(!bidang_name){

        alert(
            "Nama bidang wajib diisi"
        );

        return;
    }

    const { error } =
        await window.supabaseClient
            .from("bidangs")
            .insert([{

                tenant_id:
                    profile.tenant_id,

                opd_id:
                    profile.opd_id,

                bidang_name:
                    bidang_name

            }]);

    if(error){

        alert(error.message);

        console.error(error);

        return;
    }

    alert(
        "Bidang berhasil disimpan"
    );

    document
        .getElementById(
            "bidangName"
        )
        .value = "";

    loadBidangs();
}

async function loadBidangs() {

    let query =
        window.supabaseClient
            .from("bidangs")
            .select("*")
            .order(
                "bidang_name"
            );

    if(
        profile.role ===
        "ADMIN_OPD"
    ){

        query =
            query.eq(
                "opd_id",
                profile.opd_id
            );
    }

    const {
        data,
        error
    } =
    await query;

    const container =
        document.getElementById(
            "bidangList"
        );

    if(error){

        container.innerHTML =
            error.message;

        return;
    }

    if(
        !data ||
        data.length === 0
    ){

        container.innerHTML =
            "Belum ada bidang";

        return;
    }

    container.innerHTML =
        data.map(item => `

            <div style="
                border:1px solid #ccc;
                padding:10px;
                margin-bottom:10px;
            ">

                ${item.bidang_name}

            </div>

        `).join('');
}

async function logout() {

    await window.supabaseClient
        .auth
        .signOut();

    window.location.href =
        "login.html";
}

async function init() {

    await loadProfile();

    await loadBidangs();
}

init();

</script>

</body>
</html>
