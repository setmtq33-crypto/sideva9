<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Bidang - SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

<link rel="stylesheet" href="../css/app.css">

<style>
body { background: #f5f6fa; }
.card { border: none; border-radius: 12px; }
.table th { font-weight: 600; background-color: #f8f9fa !important; color: #495057; }
</style>
</head>
<body>

<div class="container-fluid p-4">

    <div class="card p-4 mb-4 shadow-sm bg-white">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <span class="badge bg-info text-dark mb-1 fw-bold">Modul Struktur OPD v9</span>
                <h3 class="fw-bold m-0 text-dark">Manajemen Data Bidang</h3>
                <p class="text-muted small m-0">Kelola daftar bidang beserta informasi pejabat kepala seksi terkait.</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="dashboard.html" class="btn btn-outline-secondary px-3 py-2 rounded-pill shadow-sm fw-bold">
                    <i class="bi bi-house-door-fill me-1"></i> Kembali ke Dashboard
                </a>
                <button class="btn btn-primary px-4 py-2 rounded-pill shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#modalBidang">
                    <i class="bi bi-plus-circle-fill me-2"></i> Tambah Bidang Baru
                </button>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm bg-white border-start border-info border-4">
                <small class="text-muted fw-bold d-block mb-1">TOTAL BIDANG TERDAFTAR</small>
                <h3 class="fw-bold m-0 id-total-bidang text-info">0</h3>
            </div>
        </div>
    </div>

    <div class="card shadow-sm bg-white">
        <div class="card-body p-4">
            
            <div class="row g-3 mb-3 justify-content-between align-items-center">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchBidang" class="form-control border-start-0 ps-0" placeholder="Cari nama bidang atau kepala..." onkeyup="filterBidangsTable()">
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle border-top">
                    <thead>
                        <tr>
                            <th width="60" class="text-center">No</th>
                            <th>Nama Bidang / Sub Bagian</th>
                            <th>Kepala Bidang</th>
                            <th>NIP Jabatan</th>
                            <th width="120" class="text-center">Status</th>
                            <th width="140" class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bidangsTable">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <div class="spinner-border text-info spinner-border-sm mb-2" role="status"></div>
                                <p class="m-0 small">Menghubungkan ke basis data Supabase...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="modalBidang" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold" id="modalBidangTitle"><i class="bi bi-folder-plus text-info me-2"></i>Form Data Bidang</h5>
                <button type="button" class="btn-close" data-bs-shadow="none" data-bs-dismiss="modal" aria-label="Close" onclick="resetForm()"></button>
            </div>
            <form id="bidangForm" onsubmit="saveBidangForm(event)">
                <input type="hidden" id="bidangId">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">NAMA BIDANG / SEKSI</label>
                        <input type="text" id="bidangName" class="form-control" placeholder="Contoh: Perencanaan / Cipta Karya" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">NAMA KEPALA BIDANG / PEJABAT</label>
                        <input type="text" id="headName" class="form-control" placeholder="Contoh: Ahmad Subarjo, S.T.">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">NIP KEPALA BIDANG</label>
                        <input type="text" id="headNip" class="form-control" placeholder="Contoh: 19820311XXXXXXXXXX">
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-bold text-secondary small">NAMA JABATAN / NOMENKLATUR</label>
                        <input type="text" id="positionName" class="form-control" placeholder="Contoh: Kepala Bidang Perencanaan">
                    </div>
                </div>
                <div class="modal-footer bg-light border-top-0 px-4">
                    <button type="button" class="btn btn-outline-secondary px-3 rounded-pill btn-sm" data-bs-dismiss="modal" onclick="resetForm()">Batal</button>
                    <button type="submit" class="btn btn-info px-4 rounded-pill btn-sm fw-bold text-dark">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    const client = window.supabaseClient || window.supabase;

    let profile = null;
    let rawBidangsData = [];

    async function init() {
        if (typeof getProfile === 'function') {
            try {
                profile = await getProfile();
            } catch(e) {
                console.log("Profile check skipped");
            }
        }
        await loadBidangs();
    }

    async function loadBidangs() {
        const { data, error } = await client
            .from('bidangs')
            .select('*')
            .order('bidang_name', { ascending: true });

        if (error) {
            console.error("Gagal memuat bidang:", error.message);
            document.getElementById('bidangsTable').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4 small"><i class="bi bi-exclamation-octagon"></i> Gagal sinkronisasi data: ${error.message}</td></tr>`;
            return;
        }

        rawBidangsData = data || [];
        renderBidangsTable(rawBidangsData);
    }

    function renderBidangsTable(dataset) {
        const tbody = document.getElementById('bidangsTable');
        let html = '';

        if (dataset.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted small">Belum ada daftar bidang yang direkam.</td></tr>';
            document.querySelector('.id-total-bidang').innerText = '0';
            return;
        }

        dataset.forEach((row, index) => {
            const statusBadge = row.is_active 
                ? '<span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 rounded-pill small">Aktif</span>' 
                : '<span class="badge bg-secondary-subtle text-secondary px-2 py-1 rounded-pill small">Non-Aktif</span>';

            html += `
            <tr>
                <td class="text-center text-muted small">${index + 1}</td>
                <td><div class="fw-bold text-dark">${row.bidang_name || '-'}</div><small class="text-muted">${row.position_name || ''}</small></td>
                <td><div class="fw-semibold text-secondary">${row.head_name || '-'}</div></td>
                <td><code class="text-dark small">${row.head_nip || '-'}</code></td>
                <td class="text-center">${statusBadge}</td>
                <td class="text-center">
                    <button class="btn btn-outline-primary btn-sm py-1 px-2 me-1 border-0" onclick="openEditBidangModal('${row.id}')">
                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-outline-danger btn-sm py-1 px-2 border-0" onclick="deleteBidangRecord('${row.id}')">
                        <i class="bi bi-trash-fill"></i>
                    </button>
                </td>
            </tr>`;
        });

        tbody.innerHTML = html;
        document.querySelector('.id-total-bidang').innerText = dataset.length;
    }

    window.filterBidangsTable = function() {
        const query = document.getElementById('searchBidang').value.toLowerCase().trim();
        if (!query) {
            renderBidangsTable(rawBidangsData);
            return;
        }
        const filtered = rawBidangsData.filter(item => 
            (item.bidang_name && item.bidang_name.toLowerCase().includes(query)) ||
            (item.head_name && item.head_name.toLowerCase().includes(query))
        );
        renderBidangsTable(filtered);
    };

    window.openEditBidangModal = function(id) {
        const record = rawBidangsData.find(item => item.id === id);
        if (!record) return;

        document.getElementById('modalBidangTitle').innerHTML = '<i class="bi bi-pencil-square text-info me-2"></i>Ubah Data Bidang';
        document.getElementById('bidangId').value = record.id;
        document.getElementById('bidangName').value = record.bidang_name;
        document.getElementById('headName').value = record.head_name || '';
        document.getElementById('headNip').value = record.head_nip || '';
        document.getElementById('positionName').value = record.position_name || '';

        const myModal = new bootstrap.Modal(document.getElementById('modalBidang'));
        myModal.show();
    };

    window.resetForm = function() {
        document.getElementById('modalBidangTitle').innerHTML = '<i class="bi bi-plus-circle-fill text-info me-2"></i>Tambah Bidang Baru';
        document.getElementById('bidangId').value = '';
        document.getElementById('bidangForm').reset();
    };

    window.saveBidangForm = async function(event) {
        event.preventDefault();
        
        const id = document.getElementById('bidangId').value;
        
        // PERBAIKAN FORMAT UUID: Sudah diselaraskan 100% dengan teks asli di gambar database Anda
        const finalTenantId = (profile && profile.tenant_id) ? profile.tenant_id : "9940ceb7-cab2-49f0-aa86-dc13ee3d2f21";
        const finalOpdId = (profile && profile.opd_id) ? profile.opd_id : "69614a60-de05-412e-b68c-25dd57c7b716";

        const payload = {
            bidang_name: document.getElementById('bidangName').value.trim(),
            head_name: document.getElementById('headName').value.trim() || null,
            head_nip: document.getElementById('headNip').value.trim() || null,
            position_name: document.getElementById('positionName').value.trim() || null,
            tenant_id: finalTenantId,
            opd_id: finalOpdId,
            is_active: true
        };

        Swal.showLoading();

        let response;
        if (id) {
            delete payload.is_active;
            response = await client
                .from('bidangs')
                .update(payload)
                .eq('id', id);
        } else {
            response = await client
                .from('bidangs')
                .insert([payload]);
        }

        if (response.error) {
            Swal.fire('Gagal Menyimpan', response.error.message, 'error');
            return;
        }

        Swal.fire({ icon: 'success', title: 'Data berhasil disimpan', showConfirmButton: false, timer: 1500 });
        
        const modalEl = document.getElementById('modalBidang');
        const modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modalInstance.hide();
        
        resetForm();
        await loadBidangs();
    };

    window.deleteBidangRecord = async function(id) {
        const confirm = await Swal.fire({
            title: 'Hapus data bidang?',
            text: "Pastikan tidak ada user atau paket yang sedang terikat dengan nama bidang ini!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Ya, Hapus',
            cancelButtonText: 'Batal'
        });

        if (!confirm.isConfirmed) return;

        Swal.showLoading();
        const { error } = await client
            .from('bidangs')
            .delete()
            .eq('id', id);

        if (error) {
            Swal.fire('Gagal Menghapus', error.message, 'error');
            return;
        }

        Swal.fire({ icon: 'success', title: 'Data berhasil dihapus', showConfirmButton: false, timer: 1200 });
        await loadBidangs();
    };

    document.addEventListener('DOMContentLoaded', init);
})();
</script>

</body>
</html>
