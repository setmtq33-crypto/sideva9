<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
Review Persiapan Pengadaan
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
}

textarea{
    min-height:180px;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div
class="d-flex justify-content-between align-items-center mb-4">

<div>

<h3>

Review Persiapan Pengadaan

</h3>

<div id="packageName">

Loading...

</div>

</div>

<div>

<a
href="packages.html"
class="btn btn-secondary">

Kembali

</a>

<button
id="saveBtn"
class="btn btn-success">

Simpan Review

</button>

</div>

</div>

<div class="card">

<div class="card-body">

<div class="mb-3">

<label class="form-label">

Catatan Review

</label>

<textarea
id="reviewNotes"
class="form-control"></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Rekomendasi

</label>

<select
id="recommendation"
class="form-select">

<option value="">

Pilih

</option>

<option
value="LAYAK DILANJUTKAN">

LAYAK DILANJUTKAN

</option>

<option
value="PERLU PERBAIKAN">

PERLU PERBAIKAN

</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Tanggal Review

</label>

<input
type="date"
id="reviewDate"
class="form-control">

</div>

</div>

</div>

</div>

<script>

const reviewDb =
    window.supabaseClient;

let packageId = null;

let profile = null;

async function init(){

    profile =
        await getProfile();

    packageId =
        new URLSearchParams(
            location.search
        ).get('id');

    if(!packageId){

        alert(
            'Package ID tidak ditemukan'
        );

        location.href =
            'packages.html';

        return;
    }

    await loadPackage();

    await loadReview();

    document
    .getElementById(
        'saveBtn'
    )
    .onclick =
        saveReview;
}

async function loadPackage(){

    const {
        data
    } =
    await reviewDb
    .from('packages')
    .select('*')
    .eq(
        'id',
        packageId
    )
    .single();

    if(data){

        document
        .getElementById(
            'packageName'
        )
        .innerText =
            data.package_name;
    }
}

async function loadReview(){

    const {
        data
    } =
    await reviewDb
    .from('package_reviews')
    .select('*')
    .eq(
        'package_id',
        packageId
    )
    .maybeSingle();

    if(!data)
        return;

    reviewNotes.value =
        data.review_notes || '';

    recommendation.value =
        data.recommendation || '';

    if(data.reviewed_at){

        reviewDate.value =
            data.reviewed_at
            .substring(0,10);
    }
}

async function saveReview(){

    const payload = {

        tenant_id:
            profile.tenant_id,

        opd_id:
            profile.opd_id,

        package_id:
            packageId,

        review_notes:
            reviewNotes.value,

        recommendation:
            recommendation.value,

        reviewed_by:
            profile.id,

        reviewed_at:
            reviewDate.value
    };

    const {
        error
    } =
    await reviewDb
    .from('package_reviews')
    .upsert(
        payload,
        {
            onConflict:
            'package_id'
        }
    );

    if(error){

        alert(
            error.message
        );

        return;
    }

    await reviewDb
    .from('packages')
    .update({

        package_status:
            'REVIEW_COMPLETE'

    })
    .eq(
        'id',
        packageId
    );

    await writeAuditLog(

        'REVIEW',

        'SAVE',

        packageId,

        'Simpan Review Persiapan Pengadaan'

    );

    alert(
        'Review berhasil disimpan'
    );
}

init();

</script>

</body>
</html>
