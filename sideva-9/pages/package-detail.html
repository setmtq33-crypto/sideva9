<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Paket - SI-DEVA 9</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>

</head>
<body>

<h1>Detail Paket</h1>

<hr>

<a href="packages.html">
    Kembali ke Paket
</a>

|

<button onclick="logout()">
    Logout
</button>

<hr>

<div id="packageInfo">
Loading...
</div>

<hr>

<h3>Tambah Rincian Belanja</h3>

<input
    id="itemName"
    placeholder="Nama Barang/Jasa">

<br><br>

<textarea
    id="specification"
    placeholder="Spesifikasi"></textarea>

<br><br>

<input
    id="quantity"
    type="number"
    value="1">

<br><br>

<input
    id="unit"
    placeholder="Satuan">

<br><br>

<input
    id="estimatedPrice"
    type="number"
    placeholder="Perkiraan Harga">

<br><br>

<button onclick="saveItem()">
    Simpan Item
</button>

<hr>

<h3>Daftar Rincian Belanja</h3>

<div id="itemList">
Loading...
</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const packageId =
    params.get("id");

async function loadPackage() {

    const { data, error } =
        await window.supabaseClient
            .from("packages")
            .select("*")
            .eq("id", packageId)
            .single();

    if(error){

        console.error(error);

        return;
    }

    document.getElementById(
        "packageInfo"
    ).innerHTML = `
        <b>${data.package_name}</b>
        <br>
        No RUP:
        ${data.rup_number ?? "-"}
        <br>
        Tahun:
        ${data.fiscal_year}
        <br>
        Metode:
        ${data.procurement_method}
        <br>
        Pagu:
        ${data.budget_ceiling}
    `;
}

async function loadItems() {

    const { data, error } =
        await window.supabaseClient
            .from("package_items")
            .select("*")
            .eq(
                "package_id",
                packageId
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );

    if(error){

        console.error(error);

        return;
    }

    document.getElementById(
        "itemList"
    ).innerHTML =
        data.map(item => `
            <div style="
                border:1px solid #ccc;
                padding:10px;
                margin-bottom:10px;
            ">

                <b>${item.item_name}</b>

                <br>

                ${item.specification ?? ""}

                <br>

                Volume:
                ${item.quantity}
                ${item.unit}

                <br>

                Perkiraan Harga:
                ${item.estimated_price}

                <br><br>

                <a href="surveys.html?package_item_id=${item.id}">
                    Survey Harga
                </a>

            </div>
        `).join("")
        || "Belum ada rincian belanja";
}

async function saveItem() {

    const { error } =
        await window.supabaseClient
            .from("package_items")
            .insert([{

                package_id:
                    packageId,

                item_name:
                    document
                        .getElementById(
                            "itemName"
                        )
                        .value,

                specification:
                    document
                        .getElementById(
                            "specification"
                        )
                        .value,

                quantity:
                    parseFloat(
                        document
                            .getElementById(
                                "quantity"
                            )
                            .value
                    ),

                unit:
                    document
                        .getElementById(
                            "unit"
                        )
                        .value,

                estimated_price:
                    parseFloat(
                        document
                            .getElementById(
                                "estimatedPrice"
                            )
                            .value || 0
                    )

            }]);

    if(error){

        alert(error.message);

        console.error(error);

        return;
    }

    alert(
        "Rincian belanja berhasil disimpan"
    );

    loadItems();
}

async function init(){

    await loadPackage();

    await loadItems();
}

async function logout() {

    await window.supabaseClient
        .auth
        .signOut();

    window.location.href =
        "login.html";
}


init();

</script>

</body>
</html>
