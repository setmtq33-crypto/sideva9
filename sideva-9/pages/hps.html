<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPS Engine - SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/workflow.js"></script>


<style>
body{background:#f5f6fa}
.card{border:none}
.money{text-align:right}
</style>
</head>
<body>

<div class="container-fluid p-4">

<div class="d-flex justify-content-between align-items-center mb-3">
<div>
<h3>HPS Engine</h3>
<div id="packageName">Loading...</div>
</div>

<div>

<a href="packages.html"
   class="btn btn-secondary">

   Kembali

</a>

<button
   class="btn btn-success"
   onclick="saveHPS()">

   Simpan HPS

</button>

</div>
</div>

<div class="row mb-3">

<div class="col-md-3">
<div class="card"><div class="card-body">
<small>Pagu Paket</small>
<h5 id="budgetCeiling">Rp 0</h5>
</div></div>
</div>

<div class="col-md-3">
<div class="card"><div class="card-body">
<small>Total HPS</small>
<h5 id="totalHps">Rp 0</h5>
</div></div>
</div>

<div class="col-md-3">
<div class="card"><div class="card-body">
<small>Efisiensi</small>
<h5 id="efficiency">Rp 0</h5>
</div></div>
</div>

<div class="col-md-3">
<div class="card"><div class="card-body">
<small>Persentase</small>
<h5 id="efficiencyPercent">0%</h5>
</div></div>
</div>

</div>

<div class="card">
<div class="card-body">

<table class="table table-bordered">

<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Estimasi</th>
<th>HPS Unit</th>
<th>Total HPS</th>
</tr>
</thead>

<tbody id="hpsTable"></tbody>

</table>

</div>
</div>

</div>

<button

 class="btn btn-success"

 onclick="saveHPS()">

 Simpan HPS

</button>
 
<script>

const db = window.supabaseClient;

let packageId=null;
let packageData=null;

function rupiah(v){
 return new Intl.NumberFormat('id-ID',{
   style:'currency',
   currency:'IDR',
   maximumFractionDigits:0
 }).format(v||0);
}

async function init(){

 packageId =
   new URLSearchParams(location.search)
   .get('id');

 if(!packageId){

   alert('Package ID tidak ditemukan');

   location.href =
     'packages.html';

   return;
 }

 await loadPackage();
 await calculateHPS();
}

async function loadPackage(){

 const {data} = await db
 .from('packages')
 .select('*')
 .eq('id',packageId)
 .single();

 packageData=data;

 if(data){
   document.getElementById('packageName').innerText=data.package_name;
   document.getElementById('budgetCeiling').innerText=rupiah(data.budget_ceiling);
 }
}

async function saveHPS(){

    const profile = await getProfile();

    const totalHps =
        Number(
            document
            .getElementById('totalHps')
            .innerText
            .replace(/[^\d]/g,'')
        ) || 0;

    const pagu =
        Number(packageData.budget_ceiling || 0);

    const efficiency =
        pagu - totalHps;

    const efficiencyPercent =
        pagu > 0
        ? (efficiency / pagu) * 100
        : 0;

    const payload = {

        tenant_id:
            profile.tenant_id,

        opd_id:
            profile.opd_id,

        package_id:
            packageId,

        total_hps:
            totalHps,

        efficiency:
            efficiency,

        efficiency_percent:
            efficiencyPercent
    };

    const { error } =
        await db
        .from('package_hps')
        .upsert(
            payload,
            {
                onConflict:'package_id'
            }
        );

    if(error){

        alert(error.message);
        return;
    }

    await db
       .from('packages')
       .update({
           package_status:
           'HPS_COMPLETE'
       })
       .eq('id', packageId);

    alert('HPS berhasil disimpan');
   await updatePackageStatus(packageId);
}
 

async function calculateHPS(){

 const {data:items} = await db
 .from('package_items')
 .select('*')
 .eq('package_id',packageId);

 let html='';
 let totalHps=0;

 for(const item of (items||[])){

   const {data:surveys} = await db
   .from('price_surveys')
   .select('*')
   .eq('package_item_id',item.id);

   let hpsUnit=0;

   if(surveys && surveys.length){

      let total=0;

      surveys.forEach(s=>{

         const price =
           Number(s.negotiated_price || 0) > 0
           ? Number(s.negotiated_price)
           : Number(s.survey_price || 0);

         total += price;
      });

      hpsUnit = total / surveys.length;

   }else{

      hpsUnit = Number(item.estimated_price || 0);
   }

   const itemTotal =
     Number(item.quantity || 0) * hpsUnit;

   totalHps += itemTotal;

   html += `
   <tr>
      <td>${item.item_name}</td>
      <td>${item.quantity}</td>
      <td>${rupiah(item.estimated_price)}</td>
      <td>${rupiah(hpsUnit)}</td>
      <td>${rupiah(itemTotal)}</td>
   </tr>`;
 }

 document.getElementById('hpsTable').innerHTML=html;

 document.getElementById('totalHps').innerText=rupiah(totalHps);

 const pagu = Number(packageData?.budget_ceiling || 0);

 const efficiency = pagu - totalHps;

 document.getElementById('efficiency').innerText=rupiah(efficiency);

 const percent =
    pagu > 0
    ? ((efficiency/pagu)*100)
    : 0;

 document.getElementById('efficiencyPercent').innerText =
    percent.toFixed(2) + '%';
}

init();

</script>

</body>
</html>
