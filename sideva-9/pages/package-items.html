<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Items - SIDEVA v9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/telegram.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/workflow.js"></script>

<link rel="stylesheet" href="../css/app.css">
    
<style>
body{background:#f5f6fa}
.card{border:none}
.money{text-align:right}

@media (max-width:768px){

.container,
.container-fluid{
    padding-left:10px !important;
    padding-right:10px !important;
}

.card,
.card-body{
    padding:12px !important;
}

.form-control,
.form-select{
    font-size:16px !important;
}

.btn{
    width:100%;
    margin-bottom:6px;
}

.btn-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.table{
    font-size:.85rem;
}

h1,h2,h3,h4,h5{
    word-break:break-word;
}

}


</style>
</head>
<body>

<div class="container-fluid p-4">

<div class="d-flex justify-content-between mb-3">
    <div>
        <h3>Rincian Belanja Paket</h3>
        <div id="packageName">Loading...</div>
    </div>
    <div>
        <a href="packages.html" class="btn btn-secondary">Kembali</a>
        <button class="btn btn-primary" onclick="openAddModal()">Tambah Item</button>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-4"><div class="card"><div class="card-body"><small>Pagu</small><h5 id="budgetCeiling">Rp 0</h5></div></div></div>
    <div class="col-md-4"><div class="card"><div class="card-body"><small>Total Item</small><h5 id="totalValue">Rp 0</h5></div></div></div>
    <div class="col-md-4"><div class="card"><div class="card-body"><small>Jumlah Item</small><h5 id="itemCount">0</h5></div></div></div>
</div>

<div class="card">
<div class="card-body">
<input id="searchInput" class="form-control mb-3" placeholder="Cari item...">
<div class="table-responsive">
<table class="table table-bordered">
<thead>
<tr>
<th>Nama</th>
<th>Spesifikasi</th>
<th>Qty</th>
<th>Satuan</th>
<th>Harga</th>
<th>Total</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
</div>

</div>

<div class="modal fade" id="itemModal">
<div class="modal-dialog modal-lg">
<div class="modal-content">
<div class="modal-header"><h5>Item</h5></div>
<div class="modal-body">
<input type="hidden" id="itemId">
<div class="mb-2"><label>Nama Item</label><input id="itemName" class="form-control"></div>
<div class="mb-2">
<label>Spesifikasi</label>
<textarea
id="specification"
class="form-control"
rows="3"></textarea>
</div>

<div class="row">
<div class="col-md-4"><input id="quantity" type="number" class="form-control" placeholder="Qty"></div>
<div class="col-md-4"><input id="unit" class="form-control" placeholder="Satuan"></div>
<div class="col-md-4"><input id="estimatedPrice" type="number" class="form-control" placeholder="Harga"></div>
</div>
</div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
<button class="btn btn-primary" onclick="saveItem()">Simpan</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const itemDb = window.supabaseClient;
const modal = new bootstrap.Modal(document.getElementById('itemModal'));

let profile=null;
let packageId=null;
let packageData=null;
let items=[];

function rupiah(v){
 return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v||0);
}

async function init(){
 profile = await getProfile();
 packageId = new URLSearchParams(location.search).get('id');
 await loadPackage();
 await loadItems();
}

async function loadPackage(){
 const activeOpdId = getCurrentOpdId(profile);

    const {data,error}=await itemDb
    .from('packages')
    .select('*')
    .eq('id',packageId)
   
    .single();
 if(error) return console.error(error);
 packageData=data;
 document.getElementById('packageName').innerText=data.package_name;
 document.getElementById('budgetCeiling').innerText=rupiah(data.budget_ceiling);
}

async function loadItems(){
 const {data,error}=await itemDb.from('package_items').select('*').eq('package_id',packageId);
 if(error) return console.error(error);
 items=data||[];
 render(items);
}

function render(rows){
 let html='', total=0;
 rows.forEach(r=>{
  const rowTotal=(Number(r.quantity)||0)*(Number(r.estimated_price)||0);
  total+=rowTotal;
  html+=`<tr>
   <td>${r.item_name||''}</td>
   <td>${r.specification||''}</td>
   <td>${r.quantity||0}</td>
   <td>${r.unit||''}</td>
   <td>${rupiah(r.estimated_price)}</td>
   <td>${rupiah(rowTotal)}</td>
   <td>
   <button class="btn btn-warning btn-sm" onclick="editItem('${r.id}')">Edit</button>
   <button
        class="btn btn-danger btn-sm"
        onclick="deleteItem(
            '${r.id}',
            '${r.item_name}'
        )">
        Hapus
    </button>
   </td>
  </tr>`;
 });
 document.getElementById('tbody').innerHTML=html;
 document.getElementById('itemCount').innerText=rows.length;
 document.getElementById('totalValue').innerText=rupiah(total);
}

function openAddModal(){
    document.getElementById(
        "itemId"
    ).value = "";
    
    document.getElementById(
        "itemName"
    ).value = "";
    
    document.getElementById(
        "specification"
    ).value = "";
    
    document.getElementById(
        "quantity"
    ).value = "";
    
    document.getElementById(
        "unit"
    ).value = "";
    
    document.getElementById(
        "estimatedPrice"
    ).value = "";
    
    modal.show();
}

function editItem(id){
     const r =
        items.find(
            x => x.id === id
        );
    
    if(!r) return;
    
    document.getElementById(
        "itemId"
    ).value =
        r.id;
    
    document.getElementById(
        "itemName"
    ).value =
        r.item_name || "";
    
    document.getElementById(
        "specification"
    ).value =
        r.specification || "";
    
    document.getElementById(
        "quantity"
    ).value =
        r.quantity || 0;
    
    document.getElementById(
        "unit"
    ).value =
        r.unit || "";
    
    document.getElementById(
        "estimatedPrice"
    ).value =
        r.estimated_price || 0;
    
    modal.show();
}

async function saveItem(){
     const itemId =
        document.getElementById(
            "itemId"
        ).value;
    
    const payload = {
    
        package_id:
            packageId,
    
        item_name:
            document.getElementById(
                "itemName"
            ).value,
    
        specification:
            document.getElementById(
                "specification"
            ).value,
    
        quantity:
            Number(
                document.getElementById(
                    "quantity"
                ).value || 0
            ),
    
        unit:
            document.getElementById(
                "unit"
            ).value,
    
        estimated_price:
            Number(
                document.getElementById(
                    "estimatedPrice"
                ).value || 0
            )
    
    };
    
    let result;
    
    if(itemId){
    
            result =
                await itemDb
                    .from("package_items")
                    .update(payload)
                    .eq("id", itemId);
        
        } else {
        
            result =
                await itemDb
                    .from("package_items")
                    .insert(payload);
        
        }
        
        if(result.error){
        
            console.error(result.error);
        
            alert(result.error.message);
        
            return;
        }
        
        modal.hide();
        
        if(itemId){
    
        await sendNotification(
            'ITEM_UPDATED',
            'Rincian Diperbarui',
            payload.item_name
        );
    
    }else{
    
        await sendNotification(
            'ITEM_CREATED',
            'Rincian Baru',
            payload.item_name
        );
    
    }
    
    modal.hide();
    
    await loadItems();
    
    alert(
        itemId
        ? "Item berhasil diperbarui"
        : "Item berhasil disimpan"
    );
}

async function deleteItem(
    id,
    itemName
){

 const ok = await Swal.fire({
     title:'Hapus?',
     text:itemName,
     showCancelButton:true
 });

 if(!ok.isConfirmed) return;

 const { error } =
 await itemDb
     .from('package_items')
     .delete()
     .eq('id', id);

 if(error)
     return Swal.fire(
         'Error',
         error.message,
         'error'
     );

 await sendNotification(
     'ITEM_DELETED',
     'Rincian Dihapus',
     itemName
 );

 await loadItems();

 Swal.fire(
     'Berhasil',
     'Rincian berhasil dihapus',
     'success'
 );
}

document.getElementById('searchInput').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 render(items.filter(x=>(x.item_name||'').toLowerCase().includes(q) || (x.specification||'').toLowerCase().includes(q)));
});



init();
</script>
</body>
</html>
