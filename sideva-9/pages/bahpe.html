<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BAHPE - SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/bahpe.js"></script>

<style>
body{background:#f5f6fa}
.card{border:none}
</style>

</head>
<body>

<div class="container-fluid p-4">

<div class="d-flex justify-content-between align-items-center mb-3">

<div>
<h3>BAHPE</h3>
<div id="packageName">Loading...</div>
</div>

<div>

<a href="packages.html"
class="btn btn-secondary">

Kembali

</a>

</div>

</div>

<div class="row mb-3">

<div class="col-md-4">
<div class="card">
<div class="card-body">
<small>Status Paket</small>
<h5 id="packageStatus">-</h5>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card">
<div class="card-body">
<small>Nilai HPS</small>
<h5 id="hpsAmount">Rp 0</h5>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card">
<div class="card-body">
<small>Tanggal BAHPE</small>
<h5 id="bahpeDate">-</h5>
</div>
</div>
</div>

</div>

<div class="card">

<div class="card-body">

<table class="table">

<tr>
<td>Nama Paket</td>
<td id="pkgName"></td>
</tr>

<tr>
<td>Metode</td>
<td id="procurementMethod"></td>
</tr>

<tr>
<td>Nilai HPS</td>
<td id="tableHps"></td>
</tr>

</table>

<div class="d-flex gap-2">

<button
id="generateBtn"
class="btn btn-primary">

Generate BAHPE

</button>

<button
id="approveBtn"
class="btn btn-success">

Approve

</button>

<button
id="submitBtn"
class="btn btn-warning">

Serahkan ke PBJ

</button>

</div>

</div>

</div>

</div>

<script>



let packageId=null;
let packageData=null;
let bahpeData=null;

function rupiah(v){
 return new Intl.NumberFormat(
 'id-ID',
 {
  style:'currency',
  currency:'IDR',
  maximumFractionDigits:0
 }).format(v||0);
}

async function init(){

 packageId =
 new URLSearchParams(
 location.search
 ).get('id');

 await loadPackage();
 await loadBahpe();

 document
 .getElementById('generateBtn')
 .onclick = async ()=>{

   await generateBahpe(packageId);
   await loadBahpe();
 };

 document
 .getElementById('approveBtn')
 .onclick = async ()=>{

   if(!bahpeData) return;

   await approveBahpe(
      bahpeData.id
   );

   await loadBahpe();
 };

 document
 .getElementById('submitBtn')
 .onclick = async ()=>{

   await submitToPBJ(
      packageId
   );

   await loadPackage();
 };
}

async function loadPackage(){

 const {data} =
 await window.supabaseClient
 .from('packages')
 .select('*')
 .eq('id',packageId)
 .single();

 packageData=data;

 if(!data) return;

 packageName.innerText =
 data.package_name;

 pkgName.innerText =
 data.package_name;

 procurementMethod.innerText =
 data.procurement_method;

 packageStatus.innerText =
 data.package_status;
}

async function loadBahpe(){

 const {data} =
 await window.supabaseClient
 .from('package_bahpe')
 .select('*')
 .eq('package_id',packageId)
 .maybeSingle();

 bahpeData=data;

 if(!data) return;

 hpsAmount.innerText =
 rupiah(data.hps_amount);

 tableHps.innerText =
 rupiah(data.hps_amount);

 bahpeDate.innerText =
 data.document_date || '-';
}

init();

</script>

</body>
</html>
