<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Survey Harga</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid py-4">

    <h3>Survey Harga E-Katalog</h3>

    <div class="card mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <label>Nama Produk</label>

                    <input
                        id="productName"
                        class="form-control">

                </div>

                <div class="col-md-3">

                    <label>Harga</label>

                    <input
                        id="price"
                        type="number"
                        class="form-control">

                </div>

                <div class="col-md-3">

                    <label>Satuan</label>

                    <input
                        id="unit"
                        class="form-control">

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label>Penyedia</label>

                    <input
                        id="supplier"
                        class="form-control">

                </div>

                <div class="col-md-6">

                    <label>URL Produk</label>

                    <input
                        id="productUrl"
                        class="form-control">

                </div>

            </div>

            <button
                id="saveBtn"
                class="btn btn-primary mt-3">

                Simpan Survey

            </button>

        </div>

    </div>

    <div class="card">

        <div class="card-header">

            Data Survey Harga

        </div>

        <div class="card-body">

            <table
                class="table table-striped">

                <thead>

                <tr>

                    <th>Produk</th>
                    <th>Harga</th>
                    <th>Penyedia</th>
                    <th>URL</th>

                </tr>

                </thead>

                <tbody
                    id="surveyTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script type="module">

import {
    getProfile
}
from '../assets/js/auth.js';

const db =
    window.supabaseClient;

let profile;

async function saveSurvey(){

    const productName =
        document
        .getElementById(
            'productName'
        ).value;

    const price =
        Number(
            document
            .getElementById(
                'price'
            ).value
        );

    const unit =
        document
        .getElementById(
            'unit'
        ).value;

    const supplier =
        document
        .getElementById(
            'supplier'
        ).value;

    const productUrl =
        document
        .getElementById(
            'productUrl'
        ).value;

    const { error } =
    await db
    .from(
        'catalog_products'
    )
    .insert({

        tenant_id:
            profile.tenant_id,

        product_name:
            productName,

        supplier_name:
            supplier,

        unit:
            unit,

        price:
            price,

        product_url:
            productUrl

    });

    if(error){

        alert(
            error.message
        );

        return;
    }

    await loadData();

    alert(
        'Survey tersimpan'
    );

}

async function loadData(){

    const {
        data
    } =
    await db
    .from(
        'catalog_products'
    )
    .select('*')
    .order(
        'created_at',
        {
            ascending:false
        }
    );

    const tbody =
    document
    .getElementById(
        'surveyTable'
    );

    tbody.innerHTML='';

    data.forEach(row=>{

        tbody.innerHTML += `

        <tr>

            <td>
                ${row.product_name}
            </td>

            <td>
                ${Number(
                    row.price
                ).toLocaleString(
                    'id-ID'
                )}
            </td>

            <td>
                ${row.supplier_name||''}
            </td>

            <td>

                <a
                href="${row.product_url}"
                target="_blank">

                Link

                </a>

            </td>

        </tr>

        `;

    });

}

async function init(){

    profile =
    await getProfile();

    document
    .getElementById(
        'saveBtn'
    )
    .onclick =
    saveSurvey;

    await loadData();

}

init();

</script>

</body>
</html>
