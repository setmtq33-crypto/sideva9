<body>

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h3>Survey Harga E-Katalog</h3>

        <a
            href="dashboard.html"
            class="btn btn-secondary">

            Kembali

        </a>

    </div>

    <div class="card mb-4">

        <div class="card-header">

            Form Survey Harga

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">

                        Package

                    </label>

                    <select
                        id="packageId"
                        class="form-select">

                        <option value="">

                            Pilih Package

                        </option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">

                        URL Produk E-Katalog

                    </label>

                    <div class="input-group">

                        <input
                            id="productUrl"
                            class="form-control"
                            placeholder="https://katalog.inaproc.id/...">

                        <button
                            id="fetchBtn"
                            type="button"
                            class="btn btn-success">

                            Ambil Data

                        </button>

                    </div>

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label class="form-label">

                        Nama Produk

                    </label>

                    <input
                        id="productName"
                        class="form-control">

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        Harga Satuan

                    </label>

                    <input
                        id="price"
                        type="number"
                        class="form-control">

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        Satuan

                    </label>

                    <input
                        id="unit"
                        class="form-control">

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <label class="form-label">

                        Penyedia

                    </label>

                    <input
                        id="supplier"
                        class="form-control">

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        Volume

                    </label>

                    <input
                        id="quantity"
                        type="number"
                        value="1"
                        min="1"
                        class="form-control">

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        Total

                    </label>

                    <input
                        id="totalPrice"
                        readonly
                        class="form-control">

                </div>

            </div>

            <div class="mt-4">

                <button
                    id="saveBtn"
                    class="btn btn-primary">

                    Simpan Survey

                </button>

                <button
                    id="cancelEditBtn"
                    class="btn btn-secondary ms-2"
                    style="display:none;">

                    Batal Edit

                </button>

            </div>

        </div>

    </div>

    <div class="card">

        <div class="card-header">

            Data Survey Harga

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-bordered table-striped align-middle">

                    <thead>

                        <tr>

                            <th>Package</th>

                            <th>Produk</th>

                            <th>Harga</th>

                            <th>Volume</th>

                            <th>Total</th>

                            <th>Penyedia</th>

                            <th>URL</th>

                            <th width="140">

                                Aksi

                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="surveyTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script type="module">

import {
    getProfile
}
from '../assets/js/auth.js';

const db =
    window.supabaseClient;

let profile;
let editingId = null;

function calculateTotal(){

    const qty =
        Number(
            document
            .getElementById(
                'quantity'
            ).value
        ) || 0;

    const price =
        Number(
            document
            .getElementById(
                'price'
            ).value
        ) || 0;

    document
    .getElementById(
        'totalPrice'
    )
    .value =
    qty * price;

}

async function loadPackages(){

    const {
        data,
        error
    } =
    await db
    .schema('business')
    .from('packages')
    .select(`
        id,
        package_name,
        fiscal_year
    `)
    .order(
        'package_name'
    );

    if(error){

        console.error(error);

        return;

    }

    const select =
    document
    .getElementById(
        'packageId'
    );

    select.innerHTML = `
        <option value="">
            Pilih Package
        </option>
    `;

    data.forEach(pkg=>{

        select.innerHTML += `
            <option value="${pkg.id}">
                ${pkg.package_name}
                (${pkg.fiscal_year})
            </option>
        `;

    });

}

async function fetchCatalogData(){

    const url =
    document
    .getElementById(
        'productUrl'
    )
    .value
    .trim();

    if(!url){

        alert(
            'Masukkan URL Produk'
        );

        return;

    }

    const slug =
    url.split('/')
       .pop();

    document
    .getElementById(
        'productName'
    )
    .value =
    slug
    .replaceAll(
        '-',
        ' '
    )
    .toUpperCase();

}

async function saveSurvey(){

    const packageId =
    document
    .getElementById(
        'packageId'
    )
    .value;

    if(!packageId){

        alert(
            'Pilih Package'
        );

        return;

    }

    const payload = {

        tenant_id:
            profile.tenant_id,

        package_id:
            packageId,

        product_name:
            document
            .getElementById(
                'productName'
            ).value,

        supplier_name:
            document
            .getElementById(
                'supplier'
            ).value,

        unit:
            document
            .getElementById(
                'unit'
            ).value,

        price:
            Number(
                document
                .getElementById(
                    'price'
                ).value
            ),

        quantity:
            Number(
                document
                .getElementById(
                    'quantity'
                ).value
            ),

        total_price:
            Number(
                document
                .getElementById(
                    'totalPrice'
                ).value
            ),

        product_url:
            document
            .getElementById(
                'productUrl'
            ).value,

        source_url:
            document
            .getElementById(
                'productUrl'
            ).value

    };

    let error;

    if(editingId){

        ({ error } =
        await db
        .from(
            'catalog_products'
        )
        .update(payload)
        .eq(
            'id',
            editingId
        ));

    }else{

        ({ error } =
        await db
        .from(
            'catalog_products'
        )
        .insert(payload));

    }

    if(error){

        alert(
            error.message
        );

        return;

    }

    resetForm();

    await loadData();

    alert(
        'Survey berhasil disimpan'
    );

}

async function editSurvey(id){

    const {
        data
    } =
    await db
    .from(
        'catalog_products'
    )
    .select('*')
    .eq(
        'id',
        id
    )
    .single();

    if(!data) return;

    editingId =
        data.id;

    document
    .getElementById(
        'packageId'
    )
    .value =
    data.package_id || '';

    document
    .getElementById(
        'productName'
    )
    .value =
    data.product_name || '';

    document
    .getElementById(
        'price'
    )
    .value =
    data.price || '';

    document
    .getElementById(
        'unit'
    )
    .value =
    data.unit || '';

    document
    .getElementById(
        'supplier'
    )
    .value =
    data.supplier_name || '';

    document
    .getElementById(
        'productUrl'
    )
    .value =
    data.product_url || '';

    document
    .getElementById(
        'quantity'
    )
    .value =
    data.quantity || 1;

    document
    .getElementById(
        'totalPrice'
    )
    .value =
    data.total_price || 0;

    document
    .getElementById(
        'cancelEditBtn'
    )
    .style.display =
    'inline-block';

}

async function deleteSurvey(id){

    const ok =
    confirm(
        'Hapus data survey?'
    );

    if(!ok) return;

    await db
    .from(
        'catalog_products'
    )
    .delete()
    .eq(
        'id',
        id
    );

    await loadData();

}

function resetForm(){

    editingId = null;

    document
    .getElementById(
        'packageId'
    )
    .value='';

    document
    .getElementById(
        'productName'
    )
    .value='';

    document
    .getElementById(
        'price'
    )
    .value='';

    document
    .getElementById(
        'unit'
    )
    .value='';

    document
    .getElementById(
        'supplier'
    )
    .value='';

    document
    .getElementById(
        'productUrl'
    )
    .value='';

    document
    .getElementById(
        'quantity'
    )
    .value='1';

    document
    .getElementById(
        'totalPrice'
    )
    .value='';

    document
    .getElementById(
        'cancelEditBtn'
    )
    .style.display='none';

}

async function loadData(){

    const {
        data,
        error
    } =
    await db
    .from(
        'catalog_products'
    )
    .select(`
        *,
        business_packages:package_id (
            package_name
        )
    `)
    .order(
        'created_at',
        {
            ascending:false
        }
    );

    if(error){

        console.error(error);

        return;

    }

    const tbody =
    document
    .getElementById(
        'surveyTable'
    );

    tbody.innerHTML='';

    data.forEach(row=>{

        tbody.innerHTML += `

        <tr>

            <td>
                ${row.business_packages?.package_name || '-'}
            </td>

            <td>
                ${row.product_name || ''}
            </td>

            <td>
                ${(row.price || 0).toLocaleString('id-ID')}
            </td>

            <td>
                ${row.quantity || 0}
            </td>

            <td>
                ${(row.total_price || 0).toLocaleString('id-ID')}
            </td>

            <td>
                ${row.supplier_name || ''}
            </td>

            <td>

                <a
                    href="${row.product_url || '#'}"
                    target="_blank">

                    Link

                </a>

            </td>

            <td>

                <button
                    class="btn btn-warning btn-sm"
                    onclick="editSurvey('${row.id}')">

                    Edit

                </button>

                <button
                    class="btn btn-danger btn-sm ms-1"
                    onclick="deleteSurvey('${row.id}')">

                    Hapus

                </button>

            </td>

        </tr>

        `;

    });

}

async function init(){

    profile =
    await getProfile();

    await loadPackages();

    await loadData();

    document
    .getElementById(
        'saveBtn'
    )
    .onclick =
    saveSurvey;

    document
    .getElementById(
        'fetchBtn'
    )
    .onclick =
    fetchCatalogData;

    document
    .getElementById(
        'cancelEditBtn'
    )
    .onclick =
    resetForm;

    document
    .getElementById(
        'quantity'
    )
    .addEventListener(
        'input',
        calculateTotal
    );

    document
    .getElementById(
        'price'
    )
    .addEventListener(
        'input',
        calculateTotal
    );

}

window.editSurvey =
    editSurvey;

window.deleteSurvey =
    deleteSurvey;

init();

</script>

</body>
</html>
