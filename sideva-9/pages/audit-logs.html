<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AUDIT LOGS - SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

<style>

body{
    background:#f5f6fa;
}

.card{
    border:none;
    border-radius:12px;
}

.kpi{
    font-size:28px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h3>AUDIT LOGS</h3>

            <small class="text-muted">

                Riwayat aktivitas pengguna SIDEVA9

            </small>

        </div>

        <a href="dashboard.html"
           class="btn btn-secondary">

           Kembali

        </a>

    </div>

    <div class="row mb-4">

        <div class="col-md-3">

            <div class="card">

                <div class="card-body">

                    <small>Total Log</small>

                    <div
                        id="totalLogs"
                        class="kpi">

                        0

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="card">

        <div class="card-header">

            <strong>

                Daftar Audit Log

            </strong>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead>

                        <tr>

                            <th>Waktu</th>
                            <th>Modul</th>
                            <th>Aksi</th>
                            <th>Deskripsi</th>
                            <th>User ID</th>

                        </tr>

                    </thead>

                    <tbody id="auditTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

const auditDb =
    window.supabaseClient;

async function loadAuditLogs(){

    const {
        data,
        error
    } =
    await auditDb
    .from('audit_logs')
    .select('*')
    .order(
        'created_at',
        {
            ascending:false
        }
    );

    if(error){

        console.error(error);

        return;
    }

    document
    .getElementById(
        'totalLogs'
    )
    .innerText =
        data?.length || 0;

    let html = '';

    (data || [])
    .forEach(log => {

        html += `

        <tr>

            <td>

                ${new Date(
                    log.created_at
                ).toLocaleString(
                    'id-ID'
                )}

            </td>

            <td>

                ${log.module_name || '-'}

            </td>

            <td>

                <span class="badge bg-primary">

                    ${log.action_name || '-'}

                </span>

            </td>

            <td>

                ${log.description || '-'}

            </td>

            <td>

                ${log.user_id || '-'}

            </td>

        </tr>

        `;
    });

    document
    .getElementById(
        'auditTable'
    )
    .innerHTML =
        html;
}

loadAuditLogs();

</script>

</body>
</html>
