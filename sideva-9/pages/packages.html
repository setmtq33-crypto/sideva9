<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIDEVA9</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/dashboard-documents.js"></script>

    <link rel="stylesheet" href="../css/app.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #333;
        }
        /* Dashboard Page Header Panel */
        .page-header-panel {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.12);
            margin-bottom: 25px;
        }
        /* Sections Layout Border Marker */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Custom Workspace Card Panel */
        .card-form-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            background: #ffffff;
            padding: 24px;
            margin-bottom: 30px;
        }
        /* Refined Package Blocks Box Row */
        .card-package {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            background: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            border-left: 5px solid #2a5298;
        }
        .card-package:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .form-label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.12);
        }
        .btn {
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 8px 16px;
            transition: all 0.2s;
        }
        .btn-group-actions .btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-pagu {
            background-color: #e2e8f0;
            color: #1e293b;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 6px;
        }
        .meta-info-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
        }
        .meta-info-text i {
            width: 20px;
            color: #475569;
        }
        .required {
            color: red;
        }
    </style>
</head>
<body>

<div class="container-fluid p-4">

    <div class="page-header-panel d-flex justify-content-between align-items-center text-white">
        <div>
            <h3 class="mb-1 fw-bold"><i class="fa-solid fa-cubes me-2"></i>Manajemen Paket Pengadaan</h3>
            <p class="mb-0 text-white-50 small">Kelola data program kegiatan, sub kegiatan belanja, penetapan pagu, rancangan RUP, beserta dokumen e-Purchasing.</p>
        </div>
        <div>
            <a href="dashboard.html" class="btn btn-outline-light px-3 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-arrow-left-long me-2"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="card-form-custom">
        <div class="section-title" id="formTitle"><i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru</div>
        
        <div class="row g-3">
            <div class="col-md-6" id="opdWrapper">
                <label class="form-label">OPD / Instansi Terkait</label>
                <select id="opdSelect" class="form-select">
                    <option value="">Pilih OPD</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Bidang <span class="required">*</span></label>
                <select id="bidangSelect" class="form-select">
                    <option value="">Pilih Bidang</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Akun Belanja (MAK) <span class="required">*</span></label>
                <select id="makSelect" class="form-select">
                    <option value="">Pilih MAK</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Nomor Kode RUP</label>
                <input type="text" id="rupNumber" class="form-control" placeholder="Masukkan Nomor RUP">
            </div>

            <div class="col-md-4">
                <label class="form-label">Program Kerja</label>
                <input type="text" id="program" class="form-control" placeholder="Input detail nama program">
            </div>

            <div class="col-md-4">
                <label class="form-label">Kegiatan</label>
                <input type="text" id="kegiatan" class="form-control" placeholder="Input detail nama kegiatan">
            </div>

            <div class="col-md-4">
                <label class="form-label">Sub Kegiatan</label>
                <input type="text" id="subKegiatan" class="form-control" placeholder="Input detail sub kegiatan">
            </div>

            <div class="col-md-12">
                <label class="form-label">Nama Paket Pekerjaan <span class="required">*</span></label>
                <input type="text" id="packageName" class="form-control" placeholder="Masukkan nama atau spesifikasi paket pengadaan">
            </div>

            <div class="col-md-4">
                <label class="form-label">Metode Pemilihan Pengadaan</label>
                <select id="method" class="form-select">
                    <option value="ECATALOG">E-Catalog</option>
                    <option value="PENGADAAN_LANGSUNG">Pengadaan Langsung</option>
                    <option value="MINI_KOMPETISI">Mini Kompetisi</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Pagu Dana Anggaran (Rp)</label>
                <input type="number" id="budget" class="form-control" placeholder="0">
            </div>

            <div class="col-md-4">
                <label class="form-label">Tanggal Dokumen DPP</label>
                <input type="date" id="dppDate" class="form-control">
            </div>

            <div class="col-md-12">
                <label class="form-label">Uraian Target Keluaran / Output</label>
                <textarea id="output" rows="3" class="form-control" placeholder="Tulis rincian deskripsi output capaian pekerjaan..."></textarea>
            </div>

            <hr>

            <h5>Sumber Pendanaan</h5>
            
            <div id="fundingContainer"></div>
            
            <button
            type="button"
            class="btn btn-outline-primary"
            onclick="addFundingRow()">
            
            + Tambah Sumber Dana
            
            </button>

            <div class="col-12 mt-4">
                <button class="btn btn-primary px-4 shadow-sm" id="saveBtn">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket
                </button>
            </div>
        </div>
    </div>

    <div class="card-form-custom">
        <div class="section-title"><i class="fa-solid fa-list-check me-2"></i>Daftar Rekapitulasi Paket Aktif</div>
        <div id="packageList">
            </div>
    </div>

</div>

<script>
const db = window.supabaseClient;

let profile = null;
let currentOpdId = null;
let editingPackageId = null;

document.addEventListener("DOMContentLoaded", initPage);

async function initPage(){
    profile = await getProfile();
    if(!profile) return;

    // ATURAN MAIN: Jika user beralih ke SUPER_ADMIN, paksa hak akses bernilai TRUE tanpa batasan permissions.js
    if(profile.role !== "SUPER_ADMIN" && !await canCreatePackage()){
        document.getElementById('saveBtn').style.display = 'none';
    }

    if(profile.role === "SUPER_ADMIN"){
        await loadOpds();
    } else {
        document.getElementById("opdWrapper").style.display = "none";
        currentOpdId = profile.opd_id;
    }

    await loadMak();
    await loadBidangs();
    await loadPackages();

    document.getElementById("opdSelect")?.addEventListener("change", async e => {
        currentOpdId = e.target.value;
        await loadBidangs();
        await loadPackages();
    });

    document.getElementById("saveBtn").addEventListener("click", savePackage);
}

async function loadOpds(){
    const { data, error } = await db.from("opds").select("*").order("name");
    if(error) return;

    const select = document.getElementById("opdSelect");
    select.innerHTML = '<option value="">Pilih OPD</option>';
    data.forEach(opd => {
        select.innerHTML += `<option value="${opd.id}">${opd.name}</option>`;
    });
}

async function loadBidangs(){
    const opdId = profile.role === "SUPER_ADMIN" ? currentOpdId : profile.opd_id;
    const select = document.getElementById("bidangSelect");
    select.innerHTML = '<option value="">Pilih Bidang</option>';
    
    if(!opdId) return;

    const { data } = await db.from("bidangs").select("*").eq("opd_id", opdId).order("bidang_name");
    data?.forEach(row=>{
        select.innerHTML += `<option value="${row.id}">${row.bidang_name}</option>`;
    });
}

async function loadMak(){
    const { data, error } = await db.from("budget_accounts").select("*").order("account_code");
    if(error) return;

    const select = document.getElementById("makSelect");
    select.innerHTML = '<option value="">Pilih MAK</option>';
    (data || []).forEach(row => {
        select.innerHTML += `<option value="${row.id}">${row.account_code} - ${row.account_name}</option>`;
    });
}

async function addFundingRow(data = {}) {

    const opdId =
        profile.role === "SUPER_ADMIN"
        ? currentOpdId
        : profile.opd_id;

    if (!opdId) {

        alert(
            "Pilih OPD terlebih dahulu sebelum menambah sumber pendanaan."
        );

        return;
    }

    const container =
        document.getElementById("fundingContainer");

    const row =
        document.createElement("div");

    row.className =
        "row g-2 border rounded p-3 mb-2 funding-row bg-light";

    row.innerHTML = `

        <div class="col-md-2">
            <label class="form-label">
                Bidang
            </label>
            <select class="form-select funding-bidang">
                <option value="">
                    Loading...
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">
                Program
            </label>
            <input
                type="text"
                class="form-control funding-program"
                value="${data.program || ""}"
                placeholder="Program">
        </div>

        <div class="col-md-2">
            <label class="form-label">
                Kegiatan
            </label>
            <input
                type="text"
                class="form-control funding-kegiatan"
                value="${data.kegiatan || ""}"
                placeholder="Kegiatan">
        </div>

        <div class="col-md-2">
            <label class="form-label">
                Sub Kegiatan
            </label>
            <input
                type="text"
                class="form-control funding-sub"
                value="${data.sub_kegiatan || ""}"
                placeholder="Sub Kegiatan">
        </div>

        <div class="col-md-2">
            <label class="form-label">
                MAK
            </label>
            <select class="form-select funding-mak">
                <option value="">
                    Loading...
                </option>
            </select>
        </div>

        <div class="col-md-1">
            <label class="form-label">
                Nilai
            </label>
            <input
                type="number"
                class="form-control funding-budget"
                value="${data.allocated_budget || 0}">
        </div>

        <div class="col-md-1 d-flex align-items-end">
            <button
                type="button"
                class="btn btn-danger w-100 remove-funding">

                <i class="fa fa-trash"></i>

            </button>
        </div>
    `;

    container.appendChild(row);

    const bidangSelect =
        row.querySelector(".funding-bidang");

    const makSelect =
        row.querySelector(".funding-mak");

    const removeBtn =
        row.querySelector(".remove-funding");

    removeBtn.addEventListener(
        "click",
        () => {
            row.remove();
        }
    );

    /*
    ===========================
    LOAD BIDANG
    ===========================
    */

    const {
        data: bidangs,
        error: bidangError
    } = await db
        .from("bidangs")
        .select("*")
        .eq("opd_id", opdId)
        .order("bidang_name");

    bidangSelect.innerHTML =
        '<option value="">Pilih Bidang</option>';

    if (!bidangError && bidangs) {

        bidangs.forEach(item => {

            bidangSelect.innerHTML += `
                <option value="${item.id}">
                    ${item.bidang_name}
                </option>
            `;
        });
    }

    if (data.bidang_id) {

        bidangSelect.value =
            data.bidang_id;
    }

    /*
    ===========================
    LOAD MAK
    ===========================
    */

    const {
        data: maks,
        error: makError
    } = await db
        .from("budget_accounts")
        .select("*")
        .order("account_code");

    makSelect.innerHTML =
        '<option value="">Pilih MAK</option>';

    if (!makError && maks) {

        maks.forEach(item => {

            makSelect.innerHTML += `
                <option value="${item.id}">
                    ${item.account_code}
                    -
                    ${item.account_name}
                </option>
            `;
        });
    }

    if (data.budget_account_id) {

        makSelect.value =
            data.budget_account_id;
    }
}

async function loadFundingDropdowns(row, data = {}) {

    const bidangSelect =
        row.querySelector(".funding-bidang");

    const makSelect =
        row.querySelector(".funding-mak");

    const opdId =
        profile.role === "SUPER_ADMIN"
        ? currentOpdId
        : profile.opd_id;

    const { data: bidangs } =
        await db
            .from("bidangs")
            .select("*")
            .eq("opd_id", opdId)
            .order("bidang_name");

    bidangSelect.innerHTML =
        '<option value="">Bidang</option>';

    (bidangs || []).forEach(item => {

        bidangSelect.innerHTML += `
            <option value="${item.id}">
                ${item.bidang_name}
            </option>
        `;
    });

    if(data.bidang_id)
        bidangSelect.value = data.bidang_id;

    const { data: maks } =
        await db
            .from("budget_accounts")
            .select("*")
            .order("account_code");

    makSelect.innerHTML =
        '<option value="">MAK</option>';

    (maks || []).forEach(item => {

        makSelect.innerHTML += `
            <option value="${item.id}">
                ${item.account_code}
                -
                ${item.account_name}
            </option>
        `;
    });

    if(data.budget_account_id)
        makSelect.value =
            data.budget_account_id;
}
    

async function savePackage(){
    if(
        profile.role !== "SUPER_ADMIN" &&
        !await canCreatePackage()
    ){
        alert("Anda tidak memiliki hak membuat paket");
        return;
    }

    const opdId =
        profile.role === "SUPER_ADMIN"
            ? currentOpdId
            : profile.opd_id;

    if(!opdId){
        alert("Pilih OPD terlebih dahulu");
        return;
    }

    const dppDateValue =
        document.getElementById("dppDate").value;

    const payload = {

        tenant_id: profile.tenant_id,

        opd_id: opdId,

        package_name:
            document.getElementById("packageName").value,

        fiscal_year:
            new Date().getFullYear(),

        procurement_method:
            document.getElementById("method").value,

        budget_ceiling:
            Number(
                document.getElementById("budget").value || 0
            ),

        created_by:
            profile.id,

        rup_number:
            document.getElementById("rupNumber").value,

        bidang_id:
            document.getElementById("bidangSelect").value || null,

        program:
            document.getElementById("program").value || null,

        kegiatan:
            document.getElementById("kegiatan").value || null,

        sub_kegiatan:
            document.getElementById("subKegiatan").value || null,

        budget_account_id:
            document.getElementById("makSelect").value || null,

        output:
            document.getElementById("output").value || null,

        dpp_date:
            dppDateValue || null
    };

    let packageId = editingPackageId;

    if(editingPackageId){

        const { error } =
            await db
                .from("packages")
                .update(payload)
                .eq("id", editingPackageId);

        if(error){
            alert(error.message);
            return;
        }

    } else {

        const {
            data,
            error
        } = await db
            .from("packages")
            .insert(payload)
            .select()
            .single();

        if(error){
            alert(error.message);
            return;
        }

        packageId = data.id;
    }

    await db
        .from("package_funding_sources")
        .delete()
        .eq("package_id", packageId);

    const fundingRows =
        document.querySelectorAll(
            ".funding-row"
        );

    const fundingPayload = [];

    fundingRows.forEach(row => {

        fundingPayload.push({

            tenant_id:
                profile.tenant_id,

            package_id:
                packageId,

            bidang_id:
                row.querySelector(
                    ".funding-bidang"
                )?.value || null,

            budget_account_id:
                row.querySelector(
                    ".funding-mak"
                )?.value || null,

            program:
                row.querySelector(
                    ".funding-program"
                )?.value || null,

            kegiatan:
                row.querySelector(
                    ".funding-kegiatan"
                )?.value || null,

            sub_kegiatan:
                row.querySelector(
                    ".funding-sub"
                )?.value || null,

            allocated_budget:
                Number(
                    row.querySelector(
                        ".funding-budget"
                    )?.value || 0
                )
        });

    });

    if(fundingPayload.length){

        const {
            error: fundingError
        } = await db
            .from(
                "package_funding_sources"
            )
            .insert(
                fundingPayload
            );

        if(fundingError){

            alert(
                fundingError.message
            );

            return;
        }
    }

    const isUpdate =
    !!editingPackageId;
    
    alert(
    isUpdate
    ? "Paket berhasil diperbarui"
    : "Paket berhasil disimpan"
    );
    
    await loadPackages();
    
    if(!isUpdate){
    clearForm();
    }
}

async function loadPackages() {
    let query =
        db
        .from("packages")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    const opdId =
        profile.role === "SUPER_ADMIN"
            ? currentOpdId
            : profile.opd_id;

    if(opdId){

        query =
            query.eq(
                "opd_id",
                opdId
            );
    }

    const {
        data,
        error
    } = await query;

    const container =
        document.getElementById(
            "packageList"
        );

    container.innerHTML = "";

    if(error){

        console.error(error);

        container.innerHTML =
            error.message;

        return;
    }

    if(!data || data.length === 0){

        container.innerHTML = `
            <div class="alert alert-light border">
                Belum ada paket.
            </div>
        `;

        return;
    }

    /*
    ==================================
    LOAD FUNDING SOURCES
    ==================================
    */

    const {
        data: fundingData
    } = await db
        .from(
            "package_funding_sources"
        )
        .select("*");

    const fundingMap = {};

    (fundingData || []).forEach(row => {
    
        if(!fundingMap[row.package_id]){
    
            fundingMap[row.package_id] = [];
    
        }
    
        fundingMap[row.package_id].push(row);
    
    });
    console.log("PACKAGES", data);
    console.log("FUNDING", fundingData);
    console.log("FUNDING MAP", fundingMap);
    /*
    ==================================
    RENDER PACKAGE
    ==================================
    */

    data.forEach(pkg => {
        console.log(
            "PACKAGE",
            pkg.id,
            fundingMap[pkg.id]
        );

        const fundingList =
            fundingMap[pkg.id] || [];

        container.innerHTML += `

        <div class="card-package p-4">

            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">

                <div>

                    <h5 class="fw-bold text-dark mb-1">
                        ${pkg.package_name || '-'}
                    </h5>

                    <div class="text-secondary small fw-medium">

                        <i class="fa-solid fa-hashtag me-1"></i>

                        No. RUP:

                        <span class="text-primary">
                            ${pkg.rup_number || '-'}
                        </span>

                        <span class="ms-3 text-muted">

                            <i class="fa-solid fa-code-branch me-1"></i>

                            Metode:

                            ${pkg.procurement_method || '-'}

                        </span>

                    </div>

                </div>

                <div class="badge-pagu shadow-sm">

                    <span class="text-muted small fw-normal">
                        Pagu:
                    </span>

                    Rp ${Number(
                        pkg.budget_ceiling || 0
                    ).toLocaleString('id-ID')}

                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-6">

                    ${fundingList.length
                        ? fundingList.map(item => 
                    
                            <div class="meta-info-text">
                                <i class="fa-solid fa-layer-group"></i>
                                <strong>Prog:</strong>
                                ${item.program || '-'}
                            </div>
                    
                            <div class="meta-info-text">
                                <i class="fa-solid fa-bars-progress"></i>
                                <strong>Keg:</strong>
                                ${item.kegiatan || '-'}
                            </div>
                    
                            <div class="meta-info-text">
                                <i class="fa-solid fa-circle-nodes"></i>
                                <strong>Sub:</strong>
                                ${item.sub_kegiatan || '-'}
                            </div>
                    
                            <hr class="my-2">
                    
                        ).join('')
                        : 
                            <div class="meta-info-text">
                                <strong>Prog:</strong> -
                            </div>
                    
                            <div class="meta-info-text">
                                <strong>Keg:</strong> -
                            </div>
                    
                            <div class="meta-info-text">
                                <strong>Sub:</strong> -
                            </div>
                        
                    }

                </div>

                <div class="col-md-6">

                    <div class="meta-info-text">

                        <i class="fa-solid fa-wallet"></i>

                        <strong>MAK:</strong>

                        ${funding?.budget_account_id || '-'}

                    </div>

                    <div class="meta-info-text">

                        <i class="fa-solid fa-bullseye"></i>

                        <strong>Output:</strong>

async function editPackage(id){
        const {
        data: pkg,
        error
    } = await db
        .from("packages")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    editingPackageId = id;

    document.getElementById("formTitle").innerHTML =
        `<i class="fa-solid fa-pen-to-square me-2"></i>Ubah / Edit Data Paket`;

    document.getElementById("saveBtn").innerHTML =
        `<i class="fa-solid fa-floppy-disk me-2"></i>Perbarui Paket`;

    document.getElementById("rupNumber").value =
        pkg.rup_number ?? "";

    document.getElementById("packageName").value =
        pkg.package_name ?? "";

    document.getElementById("program").value =
        pkg.program ?? "";

    document.getElementById("kegiatan").value =
        pkg.kegiatan ?? "";

    document.getElementById("subKegiatan").value =
        pkg.sub_kegiatan ?? "";

    document.getElementById("budget").value =
        Number(pkg.budget_ceiling || 0);

    document.getElementById("method").value =
        pkg.procurement_method || "ECATALOG";

    document.getElementById("bidangSelect").value =
        pkg.bidang_id || "";

    document.getElementById("makSelect").value =
        pkg.budget_account_id || "";

    document.getElementById("output").value =
        pkg.output || "";

    document.getElementById("dppDate").value =
        pkg.dpp_date || "";

    /*
    ==================================
    LOAD FUNDING SOURCES
    ==================================
    */

    document.getElementById(
        "fundingContainer"
    ).innerHTML = "";

    const {
        data: fundingRows,
        error: fundingError
    } = await db
        .from("package_funding_sources")
        .select("*")
        .eq("package_id", id)
        .order("created_at");

    if(!fundingError && fundingRows){

        for(const row of fundingRows){

            await addFundingRow({

                bidang_id:
                    row.bidang_id,

                budget_account_id:
                    row.budget_account_id,

                program:
                    row.program,

                kegiatan:
                    row.kegiatan,

                sub_kegiatan:
                    row.sub_kegiatan,

                allocated_budget:
                    row.allocated_budget
            });
        }
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

async function deletePackage(id){
    const ok = confirm("Hapus paket ini ?");
    if(!ok) return;
    
    const { error } = await db.from("packages").delete().eq("id", id);
    if(error){
        alert(error.message);
        return;
    }
    alert("Paket berhasil dihapus");
    await loadPackages();
}

function clearForm(){
    editingPackageId = null;

    document.getElementById("formTitle").innerHTML =
        `<i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru`;

    document.getElementById("saveBtn").innerHTML =
        `<i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket`;

    document.getElementById("rupNumber").value = "";
    document.getElementById("packageName").value = "";
    document.getElementById("program").value = "";
    document.getElementById("kegiatan").value = "";
    document.getElementById("subKegiatan").value = "";
    document.getElementById("budget").value = "";
    document.getElementById("output").value = "";
    document.getElementById("dppDate").value = "";

    document.getElementById("method").value =
        "ECATALOG";

    document.getElementById("bidangSelect").value = "";
    document.getElementById("makSelect").value = "";

    document.getElementById(
        "fundingContainer"
    ).innerHTML = "";
}

window.editPackage = editPackage;
