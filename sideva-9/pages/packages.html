<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

<link rel="stylesheet" href="../css/app.css">

</head>
<style>
body{
    background:#f5f7fb;
}

.page-header{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.card-package{
    border:none;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.label{
    font-size:.75rem;
    color:#6c757d;
}

.value{
    font-weight:600;
}

.required{
    color:red;
}
</style>
</head>

<body>
<h1 style="color:red">

TEST PACKAGE V2

</h1>

<div class="container-fluid py-4">

    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-1">Paket Pengadaan</h3>
                <small class="text-muted">
                    Manajemen Paket Pengadaan
                </small>
            </div>
        </div>
    </div>

    <div class="mb-3">

    <a href="dashboard.html"
       class="btn btn-secondary">
    
    ← Dashboard
    
    </a>
    
    </div>

    <!-- FORM -->

    <div class="card mb-4">
        <div class="card-header">
            <strong>Tambah Paket</strong>
        </div>

        <div class="card-body">

            <div class="row g-3">

                <!-- OPD -->

                <div class="col-md-6" id="opdWrapper">
                    <label class="form-label">
                        OPD
                    </label>

                    <select id="opdSelect" class="form-select">
                        <option value="">
                            Pilih OPD
                        </option>
                    </select>
                </div>

                <!-- BIDANG -->

                <div class="col-md-6">
                    <label class="form-label">
                        Bidang
                        <span class="required">*</span>
                    </label>

                    <select id="bidangSelect" class="form-select">
                        <option value="">
                            Pilih Bidang
                        </option>
                    </select>
                </div>

                <!-- MAK -->

                <div class="col-md-6">
                    <label class="form-label">
                        Akun Belanja (MAK)
                        <span class="required">*</span>
                    </label>

                    <select id="makSelect" class="form-select">
                        <option value="">
                            Pilih MAK
                        </option>
                    </select>
                </div>

                <!-- NO RUP -->

                <div class="col-md-6">
                    <label class="form-label">
                        No RUP
                    </label>

                    <input
                        type="text"
                        id="rupNumber"
                        class="form-control">
                </div>

                <!-- PROGRAM -->

                <div class="col-md-4">
                    <label class="form-label">
                        Program
                    </label>

                    <input
                        type="text"
                        id="program"
                        class="form-control">
                </div>

                <!-- KEGIATAN -->

                <div class="col-md-4">
                    <label class="form-label">
                        Kegiatan
                    </label>

                    <input
                        type="text"
                        id="kegiatan"
                        class="form-control">
                </div>

                <!-- SUB -->

                <div class="col-md-4">
                    <label class="form-label">
                        Sub Kegiatan
                    </label>

                    <input
                        type="text"
                        id="subKegiatan"
                        class="form-control">
                </div>

                <!-- NAMA -->

                <div class="col-md-12">
                    <label class="form-label">
                        Nama Paket
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="packageName"
                        class="form-control">
                </div>

                <!-- METODE -->

                <div class="col-md-4">
                    <label class="form-label">
                        Metode Pengadaan
                    </label>

                    <select id="method" class="form-select">
                        <option value="ECATALOG">
                            E-Catalog
                        </option>

                        <option value="PENGADAAN_LANGSUNG">
                            Pengadaan Langsung
                        </option>

                        <option value="MINI_KOMPETISI">
                            Mini Kompetisi
                        </option>
                    </select>
                </div>

                <!-- PAGU -->

                <div class="col-md-4">
                    <label class="form-label">
                        Pagu
                    </label>

                    <input
                        type="number"
                        id="budget"
                        class="form-control">
                </div>

                <!-- DPP -->

                <div class="col-md-4">
                    <label class="form-label">
                        Tanggal DPP
                    </label>

                    <input
                        type="date"
                        id="dppDate"
                        class="form-control">
                </div>

                <!-- OUTPUT -->

                <div class="col-md-12">
                    <label class="form-label">
                        Output
                    </label>

                    <textarea
                        id="output"
                        rows="3"
                        class="form-control"></textarea>
                </div>

                <div class="col-12">
                    <button
                        class="btn btn-primary"
                        id="saveBtn">
                        Simpan Paket
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- LIST -->

    <div class="card">
        <div class="card-header">
            <strong>Daftar Paket</strong>
        </div>

        <div class="card-body">

            <div id="packageList">

            </div>

        </div>
    </div>

</div>

<script>

const db = window.supabaseClient;

let profile = null;
let currentOpdId = null;

document.addEventListener(
    "DOMContentLoaded",
    initPage
);

async function initPage(){

    profile = await getProfile();

    if(!profile){
        return;
    }

    if(profile.role === "SUPER_ADMIN"){

        await loadOpds();

    }else{

        document
            .getElementById("opdWrapper")
            .style.display = "none";

        currentOpdId = profile.opd_id;
    }

    await loadMak();

    await loadBidangs();

    await loadPackages();

    document
        .getElementById("opdSelect")
        ?.addEventListener(
            "change",
            async e => {

                currentOpdId = e.target.value;

                await loadBidangs();
                await loadPackages();
            }
        );

    document
        .getElementById("saveBtn")
        .addEventListener(
            "click",
            savePackage
        );
}

async function loadOpds(){

    const { data, error } = await window.supabaseClient
        .from("opds")
        .select("*")
        .order("name");

    if(error){
        console.error(error);
        return;
    }

    const select =
        document.getElementById("opdSelect");

    select.innerHTML =
        '<option value="">Pilih OPD</option>';

    data.forEach(opd => {

        select.innerHTML += `
            <option value="${opd.id}">
                ${opd.name}
            </option>
        `;
    });
}

async function loadBidangs(){

    const opdId =
        profile.role === "SUPER_ADMIN"
        ? currentOpdId
        : profile.opd_id;

    if(!opdId){
        return;
    }

    const { data } = await window.supabaseClient
        .from("bidangs")
        .select("*")
        .eq("opd_id", opdId)
        .order("bidang_name");

    const select =
        document.getElementById("bidangSelect");

    select.innerHTML =
        '<option value="">Pilih Bidang</option>';

    data.forEach(row=>{

        select.innerHTML += `
            <option value="${row.id}">
                ${row.bidang_name}
            </option>
        `;
    });
}

async function loadMak(){

    const { data, error } = await window.supabaseClient
        .from("budget_accounts")
        .select("*")
        .order("account_code");

    if(error){
        console.error("loadMak", error);
        return;
    }

    const select =
        document.getElementById("makSelect");

    select.innerHTML =
        '<option value="">Pilih MAK</option>';

    (data || []).forEach(row => {

        select.innerHTML += `
            <option value="${row.id}">
                ${row.account_code}
                -
                ${row.account_name}
            </option>
        `;
    });
}

async function savePackage(){

    const opdId =
        profile.role === "SUPER_ADMIN"
        ? currentOpdId
        : profile.opd_id;

    if(!opdId){

        alert("Pilih OPD");
        return;
    }

    const payload = {

        tenant_id:
            profile.tenant_id,

        opd_id:
            opdId,

        package_name:
            document.getElementById("packageName").value,

        fiscal_year:
            new Date().getFullYear(),

        procurement_method:
            document.getElementById("method").value,

        budget_ceiling:
            Number(
                document.getElementById("budget").value || 0
            ),

        created_by:
            profile.id,

        rup_number:
            document.getElementById("rupNumber").value,

        bidang_id:
            document.getElementById("bidangSelect").value,

        program:
            document.getElementById("program").value,

        kegiatan:
            document.getElementById("kegiatan").value,

        sub_kegiatan:
            document.getElementById("subKegiatan").value,

        budget_account_id:
            document.getElementById("makSelect").value,

        output:
            document.getElementById("output").value,

        dpp_date:
            document.getElementById("dppDate").value
    };

    const { error } = await window.supabaseClient
        .from("packages")
        .insert(payload);

    if(error){

        alert(error.message);
        return;
    }

    alert("Paket berhasil disimpan");

    location.reload();
}

async function loadPackages(){

    const opdId =
        profile.role === "SUPER_ADMIN"
        ? currentOpdId
        : profile.opd_id;

    let query =
        window.supabaseClient
        .from("packages")
        .select("*")
        .order(
            "created_at",
            { ascending:false }
        );

    if(opdId){

        query = query.eq(
            "opd_id",
            opdId
        );
    }

    const {
        data,
        error
    } = await query;

    if(error){

        console.error(
            "loadPackages error",
            error
        );

        return;
    }

    const container =
        document.getElementById(
            "packageList"
        );

    container.innerHTML = "";

    if(!data || data.length === 0){

        container.innerHTML = `
            <div class="alert alert-light">
                Belum ada paket.
            </div>
        `;

        return;
    }

    data.forEach(pkg=>{

        container.innerHTML += `

        <div class="card card-package mb-3">

            <div class="card-body">

                <h5>
                    ${pkg.package_name || '-'}
                </h5>

                <div class="row mt-3">

                    <div class="col-md-2">
                        <div class="label">
                            No RUP
                        </div>
                        <div class="value">
                            ${pkg.rup_number || '-'}
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="label">
                            Bidang ID
                        </div>
                        <div class="value">
                            ${pkg.bidang_id || '-'}
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="label">
                            Program
                        </div>
                        <div class="value">
                            ${pkg.program || '-'}
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="label">
                            Kegiatan
                        </div>
                        <div class="value">
                            ${pkg.kegiatan || '-'}
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="label">
                            Pagu
                        </div>
                        <div class="value">
                            Rp ${Number(
                                pkg.budget_ceiling || 0
                            ).toLocaleString('id-ID')}
                        </div>
                    </div>

                </div>

                <hr>

                <div class="d-flex gap-2">

                    <button
                        class="btn btn-outline-primary btn-sm"
                        onclick="openItems('${pkg.id}')">

                        Rincian Belanja

                    </button>

                    <button
                        class="btn btn-outline-success btn-sm"
                        onclick="openSurvey('${pkg.id}')">

                        Survey Harga

                    </button>

                    <button
                        class="btn btn-outline-secondary btn-sm"
                        onclick="openDocs('${pkg.id}')">

                        Dokumen

                    </button>

                    <button

                        class="btn btn-outline-warning btn-sm"
                        onclick="openHps('${pkg.id}')">
                    
                        HPS
                    
                    </button>

                    <button
                        class="btn btn-outline-success btn-sm"
                        onclick="openBahpe('${pkg.id}')">
                    
                        BAHPE
                    
                    </button>

                </div>

            </div>

        </div>

        `;
    });
}

function openItems(id){

    location.href =
        `package-items.html?id=${id}`;
}

function openSurvey(id){

    location.href =
        `price-surveys.html?id=${id}`;
}

function openDocs(id){

    location.href =
        `package-documents.html?id=${id}`;
}

function openHps(id){

    location.href =
        `hps.html?id=${id}`;
}

function openBahpe(id){

    location.href =
        `bahpe.html?id=${id}`;
}
    
    

</script>


    

</body>
</html>
