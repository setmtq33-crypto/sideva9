<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIDEVA9</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/dashboard-documents.js"></script>

    <link rel="stylesheet" href="../css/app.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #333;
        }
        /* Dashboard Page Header Panel */
        .page-header-panel {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.12);
            margin-bottom: 25px;
        }
        /* Sections Layout Border Marker */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Custom Workspace Card Panel */
        .card-form-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            background: #ffffff;
            padding: 24px;
            margin-bottom: 30px;
        }
        /* Refined Package Blocks Box Row */
        .card-package {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            background: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            border-left: 5px solid #2a5298;
        }
        .card-package:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .form-label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.12);
        }
        .btn {
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 8px 16px;
            transition: all 0.2s;
        }
        .btn-group-actions .btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-pagu {
            background-color: #e2e8f0;
            color: #1e293b;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 6px;
        }
        .meta-info-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
        }
        .meta-info-text i {
            width: 20px;
            color: #475569;
        }
        .required {
            color: red;
        }
        textarea.form-control {
            resize: vertical; 
            min-height: 80px; 
        }
    </style>
</head>
<body>

<div class="container-fluid p-4">

    <div class="page-header-panel d-flex justify-content-between align-items-center text-white">
        <div>
            <h3 class="mb-1 fw-bold"><i class="fa-solid fa-cubes me-2"></i>Manajemen Paket Pengadaan</h3>
            <p class="mb-0 text-white-50 small">Kelola data program kegiatan, sub kegiatan belanja, penetapan pagu, rancangan RUP, beserta dokumen e-Purchasing.</p>
        </div>
        <div>
            <a href="dashboard.html" class="btn btn-outline-light px-3 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-arrow-left-long me-2"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="card-form-custom">
        <div class="section-title" id="formTitle"><i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru</div>
        
        <div class="row g-3">
            <div class="col-md-6" id="opdWrapper">
                <label class="form-label">OPD / Instansi Terkait</label>
                <select id="opdSelect" class="form-select">
                    <option value="">Pilih OPD</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Bidang <span class="required">*</span></label>
                <select id="bidangSelect" class="form-select">
                    <option value="">Pilih Bidang</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Akun Belanja (MAK) <span class="required">*</span></label>
                <select id="makSelect" class="form-select">
                    <option value="">Pilih MAK</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Nomor Kode RUP</label>
                <input type="text" id="rupNumber" class="form-control" placeholder="Masukkan Nomor RUP">
            </div>

            <div class="col-md-4">
                <label class="form-label">Program Kerja</label>
                <textarea id="program" class="form-control" rows="2" placeholder="Input detail nama program"></textarea>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Kegiatan</label>
                <textarea id="kegiatan" class="form-control" rows="2" placeholder="Input detail nama kegiatan"></textarea>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Sub Kegiatan</label>
                <textarea id="subKegiatan" class="form-control" rows="2" placeholder="Input detail sub kegiatan"></textarea>
            </div>

            <div class="col-md-12">
                <label class="form-label">Nama Paket Pekerjaan <span class="required">*</span></label>
                <input type="text" id="packageName" class="form-control" placeholder="Masukkan nama atau spesifikasi paket pengadaan">
            </div>

            <div class="col-md-4">
                <label class="form-label">Metode Pemilihan Pengadaan</label>
                <select id="method" class="form-select">
                    <option value="ECATALOG">E-Catalog</option>
                    <option value="PENGADAAN_LANGSUNG">Pengadaan Langsung</option>
                    <option value="MINI_KOMPETISI">Mini Kompetisi</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Pagu Dana Anggaran (Rp)</label>
                <input type="number" id="budget" class="form-control" placeholder="0">
            </div>

            <div class="col-md-4">
                <label class="form-label">Tanggal Dokumen DPP</label>
                <input type="date" id="dppDate" class="form-control">
            </div>

            <div class="col-md-12">
                <label class="form-label">Uraian Target Keluaran / Output</label>
                <textarea id="output" rows="3" class="form-control" placeholder="Tulis rincian deskripsi output capaian pekerjaan..."></textarea>
            </div>

            <div class="col-12 mt-4">
                <button class="btn btn-primary px-4 shadow-sm" id="saveBtn">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket
                </button>
            </div>
        </div>
    </div>

    <div class="card-form-custom">
        <div class="section-title"><i class="fa-solid fa-list-check me-2"></i>Daftar Rekapitulasi Paket Aktif</div>
        <div id="packageList">
            </div>
    </div>

</div>

<script>
const db = window.supabaseClient;

let profile = null;
let currentOpdId = null;
let editingPackageId = null;

document.addEventListener("DOMContentLoaded", initPage);

async function initPage(){
    profile = await getProfile();
    if(!profile) return;

    // ATURAN MAIN: Jika user beralih ke SUPER_ADMIN, paksa hak akses bernilai TRUE tanpa batasan permissions.js
    if(profile.role !== "SUPER_ADMIN" && !await canCreatePackage()){
        document.getElementById('saveBtn').style.display = 'none';
    }

    if(profile.role === "SUPER_ADMIN"){
        await loadOpds();
    } else {
        document.getElementById("opdWrapper").style.display = "none";
        currentOpdId = profile.opd_id;
    }

    await loadMak();
    await loadBidangs();
    await loadPackages();

    document.getElementById("opdSelect")?.addEventListener("change", async e => {
        currentOpdId = e.target.value;
        await loadBidangs();
        await loadPackages();
    });

    document.getElementById("saveBtn").addEventListener("click", savePackage);
}

async function loadOpds(){
    const { data, error } = await db.from("opds").select("*").order("name");
    if(error) return;

    const select = document.getElementById("opdSelect");
    select.innerHTML = '<option value="">Pilih OPD</option>';
    data.forEach(opd => {
        select.innerHTML += `<option value="${opd.id}">${opd.name}</option>`;
    });
}

async function loadBidangs(){
    const opdId = profile.role === "SUPER_ADMIN" ? currentOpdId : profile.opd_id;
    const select = document.getElementById("bidangSelect");
    select.innerHTML = '<option value="">Pilih Bidang</option>';
    
    if(!opdId) return;

    const { data } = await db.from("bidangs").select("*").eq("opd_id", opdId).order("bidang_name");
    data?.forEach(row=>{
        select.innerHTML += `<option value="${row.id}">${row.bidang_name}</option>`;
    });
}

async function loadMak(){
    const { data, error } = await db.from("budget_accounts").select("*").order("account_code");
    if(error) return;

    const select = document.getElementById("makSelect");
    select.innerHTML = '<option value="">Pilih MAK</option>';
    (data || []).forEach(row => {
        select.innerHTML += `<option value="${row.id}">${row.account_code} - ${row.account_name}</option>`;
    });
}

async function savePackage(){
    // ATURAN MAIN: SUPER_ADMIN bypass verifikasi canCreatePackage()
    if(profile.role !== "SUPER_ADMIN" && !await canCreatePackage()){
        alert('Anda tidak memiliki hak membuat paket');
        return;
    }

    const opdId = profile.role === "SUPER_ADMIN" ? currentOpdId : profile.opd_id;
    if(!opdId){
        alert("Pilih OPD terlebih dahulu");
        return;
    }

    const payload = {
        tenant_id: profile.tenant_id,
        opd_id: opdId,
        package_name: document.getElementById("packageName").value,
        fiscal_year: new Date().getFullYear(),
        procurement_method: document.getElementById("method").value,
        budget_ceiling: Number(document.getElementById("budget").value || 0),
        created_by: profile.id,
        rup_number: document.getElementById("rupNumber").value,
        bidang_id: document.getElementById("bidangSelect").value,
        program: document.getElementById("program").value,
        kegiatan: document.getElementById("kegiatan").value,
        sub_kegiatan: document.getElementById("subKegiatan").value,
        budget_account_id: document.getElementById("makSelect").value,
        output: document.getElementById("output").value,
        dpp_date: document.getElementById("dppDate").value
    };

    let query = editingPackageId ? db.from("packages").update(payload).eq("id", editingPackageId) : db.from("packages").insert(payload);
    const { error } = await query;

    if(error){
        alert(error.message);
        return;
    }

    alert(editingPackageId ? "Paket berhasil diperbarui" : "Paket berhasil disimpan");
    clearForm();
    await loadPackages();
}

async function loadPackages() {
    let query = db.from("packages").select("*").order("created_at", { ascending: false });
    
    const opdId = profile.role === "SUPER_ADMIN" ? currentOpdId : profile.opd_id;
    if (opdId) {
        query = query.eq("opd_id", opdId);
    }

    const { data, error } = await query;
    const container = document.getElementById("packageList");
    container.innerHTML = "";

    if (error || !data || data.length === 0) {
        container.innerHTML = `
        <div class="text-center p-5 text-muted bg-light rounded-3 border border-dashed">
            <i class="fa-solid fa-folder-open display-6 mb-3"></i>
            <p class="mb-0">Belum ada paket pengadaan yang terdaftar dalam cakupan ini.</p>
        </div>`;
        return;
    }

    data.forEach(pkg => {
        container.innerHTML += `
        <div class="card-package p-4">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h5 class="fw-bold text-dark mb-1">${pkg.package_name || '-'}</h5>
                    <div class="text-secondary small fw-medium">
                        <i class="fa-solid fa-hashtag me-1"></i>No. RUP: <span class="text-primary">${pkg.rup_number || '-'}</span>
                        <span class="ms-3 text-muted"><i class="fa-solid fa-code-branch me-1"></i>Metode: ${pkg.procurement_method || '-'}</span>
                    </div>
                </div>
                <div class="badge-pagu shadow-sm">
                    <span class="text-muted small fw-normal">Pagu:</span> Rp ${Number(pkg.budget_ceiling || 0).toLocaleString('id-ID')}
                </div>
            </div>
            
            <div class="row mb-3">
                
                <div class="col-12">
                    <div class="meta-info-text">
                        <i class="fa-solid fa-layer-group"></i>
                        <span><strong>Prog:</strong> ${pkg.program || '-'}</span>
                    </div>
                    <div class="meta-info-text">
                        <i class="fa-solid fa-bars-progress"></i>
                        <span><strong>Keg:</strong> ${pkg.kegiatan || '-'}</span>
                    </div>
                    <div class="meta-info-text">
                        <i class="fa-solid fa-circle-nodes"></i>
                        <span><strong>Sub:</strong> ${pkg.sub_kegiatan || '-'}</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="meta-info-text"><i class="fa-solid fa-wallet"></i><strong>MAK ID:</strong> ${pkg.budget_account_id || '-'}</div>
                    <div class="meta-info-text"><i class="fa-solid fa-bullseye"></i><strong>Output:</strong> ${pkg.output || "-"}</div>
                    <div class="meta-info-text"><i class="fa-solid fa-calendar-day"></i><strong>Tgl DPP:</strong> ${pkg.dpp_date || "-"}</div>
                </div>
            </div>
            
            <hr class="my-3 text-black-50">
            
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 btn-group-actions">
                <div class="d-flex gap-1 flex-wrap">
                    <button class="btn btn-sm btn-primary" onclick="openItems('${pkg.id}')">
                        <i class="fa-solid fa-basket-shopping"></i> Rincian Belanja
                    </button>
                    <button class="btn btn-sm btn-info text-white" onclick="openSurvey('${pkg.id}')">
                        <i class="fa-solid fa-magnifying-glass-dollar"></i> Survey Harga
                    </button>
                    <button class="btn btn-sm btn-outline-info" onclick="openDpp('${pkg.id}')">
                        <i class="fa-solid fa-file-shield"></i> DPP
                    </button>
                    <button class="btn btn-sm btn-outline-dark" onclick="location.href='dpp-document.html?id=${pkg.id}'">
                        <i class="fa-solid fa-file-pdf"></i> DPP PDF
                    </button>
                    <button class="btn btn-sm btn-secondary" onclick="openDocs('${pkg.id}')">
                        <i class="fa-solid fa-folder"></i> Dokumen
                    </button>
                    
                    ${(profile.role === 'SUPER_ADMIN' || canSeeHps(profile.role)) ? `
                        <button class="btn btn-sm btn-success" onclick="openHps('${pkg.id}')"><i class="fa-solid fa-calculator"></i> HPS</button>
                        <button class="btn btn-sm btn-outline-success" onclick="openBahpe('${pkg.id}')"><i class="fa-solid fa-file-contract"></i> BAHPE</button>
                    ` : ""}

                    <button class="btn btn-sm btn-outline-warning" onclick="location.href='review.html?id=${pkg.id}'">Review</button>
                    <button class="btn btn-sm btn-outline-dark" onclick="location.href='review-document.html?id=${pkg.id}'"><i class="fa-solid fa-file-pdf"></i> Review PDF</button>
                </div>
                
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-warning" onclick="editPackage('${pkg.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deletePackage('${pkg.id}')"><i class="fa-solid fa-trash-can"></i> Hapus</button>
                </div>
            </div>
        </div>`;
    });
}

async function editPackage(id){
    const { data, error } = await db.from("packages").select("*").eq("id", id).single();
    if(error){
        alert(error.message);
        return;
    }
    
    editingPackageId = id;
    document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-pen-to-square me-2"></i>Ubah / Edit Data Paket`;
    document.getElementById("saveBtn").innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i>Perbarui Paket`;

    document.getElementById("rupNumber").value = data.rup_number || "";
    document.getElementById("packageName").value = data.package_name || "";
    document.getElementById("program").value = data.program || "";
    document.getElementById("kegiatan").value = data.kegiatan || "";
    document.getElementById("subKegiatan").value = data.sub_kegiatan || "";
    document.getElementById("budget").value = data.budget_ceiling || "";
    document.getElementById("method").value = data.procurement_method || "ECATALOG";
    document.getElementById("bidangSelect").value = data.bidang_id || "";
    document.getElementById("makSelect").value = data.budget_account_id || "";
    document.getElementById("output").value = data.output || "";
    document.getElementById("dppDate").value = data.dpp_date || "";
    
    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deletePackage(id){
    const ok = confirm("Hapus paket ini ?");
    if(!ok) return;
    
    const { error } = await db.from("packages").delete().eq("id", id);
    if(error){
        alert(error.message);
        return;
    }
    alert("Paket berhasil dihapus");
    await loadPackages();
}

function clearForm(){
    editingPackageId = null;
    document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru`;
    document.getElementById("saveBtn").innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket`;
    document.getElementById("rupNumber").value = "";
    document.getElementById("packageName").value = "";
    document.getElementById("program").value = "";
    document.getElementById("kegiatan").value = "";
    document.getElementById("subKegiatan").value = "";
    document.getElementById("budget").value = "";
    document.getElementById("output").value = "";
    document.getElementById("dppDate").value = "";
}

function canSeeHps(role){ return ['SUPER_ADMIN', 'ADMIN_OPD', 'PPK'].includes(role); }
function canSeeBahpe(role){ return ['SUPER_ADMIN', 'ADMIN_OPD', 'PPK'].includes(role); }
function openItems(id){ location.href = `package-items.html?id=${id}`; }
function openSurvey(id){ location.href = `price-surveys.html?id=${id}`; }
function openDocs(id){ location.href = `package-documents.html?id=${id}`; }
function openHps(id){ location.href = `hps.html?id=${id}`; }
function openBahpe(id){ location.href = `bahpe.html?id=${id}`; }
function openDpp(id){ location.href = `dpp.html?id=${id}`; }

window.editPackage = editPackage;
window.deletePackage = deletePackage;
</script>
</body>
</html>
