<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/permissions.js"></script>
<script src="../js/dashboard-documents.js"></script>

<link rel="stylesheet" href="../css/app.css">

<style>
body {
    background: #f4f6f9;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #333;
}

/* Page Header Panel Customization */
.page-header-panel {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(30, 60, 114, 0.12);
    margin-bottom: 25px;
}

/* Section Title Modifiers */
.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1e3c72;
    border-left: 4px solid #2a5298;
    padding-left: 10px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Form Container Card Customization */
.card-form-custom {
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    background: #ffffff;
    padding: 24px;
    margin-bottom: 30px;
}

/* Package List Row Styling */
.card-package {
    border: none;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    background: #ffffff;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
    border-left: 5px solid #2a5298;
}

.card-package:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
}

/* Form Control Layouts */
.form-label {
    font-weight: 600;
    color: #4a5568;
    font-size: 0.85rem;
    margin-bottom: 6px;
}

.form-control, .form-select {
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    padding: 10px 14px;
    font-size: 0.9rem;
    transition: all 0.2s ease;
}

.form-control:focus, .form-select:focus {
    border-color: #2a5298;
    box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.12);
}

/* Action Button Layout Grid */
.btn {
    border-radius: 8px;
    font-weight: 500;
    font-size: 0.85rem;
    padding: 8px 16px;
    transition: all 0.2s;
}

.btn-group-actions .btn {
    padding: 6px 12px;
    font-size: 0.8rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.badge-pagu {
    background-color: #e2e8f0;
    color: #1e293b;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 6px 14px;
    border-radius: 6px;
}

.meta-info-text {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 4px;
}

.meta-info-text i {
    width: 20px;
    color: #475569;
}
</style>

</head>
<body>
<div class="container-fluid p-4">

    <div class="page-header-panel d-flex justify-content-between align-items-center text-white">
        <div>
            <h3 class="mb-1 fw-bold"><i class="fa-solid fa-cubes me-2"></i>Manajemen Paket Pengadaan</h3>
            <p class="mb-0 text-white-50 small">Kelola data program kegiatan, sub kegiatan belanja, penetapan pagu, rancangan RUP, beserta dokumen e-Purchasing.</p>
        </div>
        <div>
            <a href="dashboard.html" class="btn btn-outline-light px-3 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-arrow-left-long me-2"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="card-form-custom">
        <div class="section-title" id="formTitle"><i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru</div>
        
        <form id="packageForm" onsubmit="savePackage(event)">
            <input type="hidden" id="packageId">
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Program Kerja</label>
                    <input type="text" id="program" class="form-control" placeholder="Contoh: 5.01.02 - Program Perencanaan" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label">Kegiatan</label>
                    <input type="text" id="kegiatan" class="form-control" placeholder="Contoh: 5.01.02.2.01 - Penyusunan Anggaran" required>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label">Sub Kegiatan</label>
                    <input type="text" id="subKegiatan" class="form-control" placeholder="Contoh: 5.01.02.2.01.0003 - Konsultasi Publik" required>
                </div>
                
                <div class="col-md-3">
                    <label class="form-label">Nomor RUP</label>
                    <input type="text" id="rupNumber" class="form-control" placeholder="Masukkan ID RUP" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Kode Akun Belanja</label>
                    <select id="accountId" class="form-select" required>
                        <option value="">-- Pilih Akun Belanja --</option>
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label">Nama Paket Pengadaan</label>
                    <input type="text" id="packageName" class="form-control" placeholder="Masukkan spesifikasi nama paket pekerjaan" required>
                </div>
                
                <div class="col-md-3">
                    <label class="form-label">Pagu Dana Anggaran (Rp)</label>
                    <input type="number" id="budgetCeiling" class="form-control" placeholder="0" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Tanggal Dokumen DPP</label>
                    <input type="date" id="dppDate" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Keluaran / Output Kerja</label>
                    <input type="text" id="output" class="form-control" placeholder="Masukkan uraian target output capaian" required>
                </div>

                <div class="col-md-6 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary px-4 shadow-sm" id="btnSubmit">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket
                    </button>
                    <button type="button" class="btn btn-light border text-secondary px-3" id="btnCancel" onclick="resetForm()" style="display:none;">
                        Batal
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="card-form-custom">
        <div class="section-title"><i class="fa-solid fa-list-check me-2"></i>Daftar Rekapitulasi Paket Aktif</div>
        <div id="packageList">
            </div>
    </div>

</div>

<script>
const db = window.supabaseClient;
let currentProfile = null;

async function init() {
    currentProfile = await getProfile();
    await loadAccounts();
    await loadPackages();
}

async function loadAccounts() {
    const { data, error } = await db
        .from("accounts")
        .select("*")
        .order("account_code");
        
    if (error) return;
    
    let html = '<option value="">-- Pilih Akun Belanja --</option>';
    data.forEach(acc => {
        html += `<option value="${acc.id}">${acc.account_code} - ${acc.account_name}</option>`;
    });
    document.getElementById("accountId").innerHTML = html;
}

async function loadPackages() {
    let query = db.from("packages").select(`
        *,
        accounts ( account_code, account_name )
    `).order("created_at", { ascending: false });
    
    if (currentProfile.role === 'ADMIN_OPD' || currentProfile.role === 'PPK' || currentProfile.role === 'PPTK') {
        query = query.eq("opd_id", currentProfile.opd_id);
    }
    
    const { data, error } = await query;
    if (error) return;
    
    let html = "";
    if (!data || data.length === 0) {
        html = `
        <div class="text-center p-5 text-muted bg-light rounded-3 border border-dashed">
            <i class="fa-solid fa-folder-open display-6 mb-3"></i>
            <p class="mb-0">Belum ada paket pengadaan yang terdaftar dalam instansi ini.</p>
        </div>`;
    } else {
        data.forEach(pkg => {
            const code = pkg.accounts?.account_code || "-";
            const name = pkg.accounts?.account_name || "-";
            
            html += `
            <div class="card-package p-4">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                    <div>
                        <h5 class="fw-bold text-dark mb-1">${pkg.package_name}</h5>
                        <div class="text-secondary small fw-medium"><i class="fa-solid fa-hashtag me-1"></i>No. RUP: <span class="text-primary">${pkg.rup_number}</span></div>
                    </div>
                    <div class="badge-pagu shadow-sm">
                        <span class="text-muted small fw-normal">Pagu:</span> Rp ${Number(pkg.budget_ceiling).toLocaleString("id-ID")}
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="meta-info-text"><i class="fa-solid fa-layer-group"></i><strong>Prog:</strong> ${pkg.program}</div>
                        <div class="meta-info-text"><i class="fa-solid fa-bars-progress"></i><strong>Keg:</strong> ${pkg.kegiatan}</div>
                        <div class="meta-info-text"><i class="fa-solid fa-circle-nodes"></i><strong>Sub:</strong> ${pkg.sub_kegiatan}</div>
                    </div>
                    <div class="col-md-6">
                        <div class="meta-info-text"><i class="fa-solid fa-wallet"></i><strong>Akun:</strong> ${code} - ${name}</div>
                        <div class="meta-info-text"><i class="fa-solid fa-bullseye"></i><strong>Output:</strong> ${pkg.output || "-"}</div>
                        <div class="meta-info-text"><i class="fa-solid fa-calendar-day"></i><strong>Tgl DPP:</strong> ${pkg.dpp_date || "-"}</div>
                    </div>
                </div>
                
                <hr class="my-3 text-black-50">
                
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 btn-group-actions">
                    <div class="d-flex gap-1 flex-wrap">
                        <button class="btn btn-sm btn-primary" onclick="openItems('${pkg.id}')">
                            <i class="fa-solid fa-basket-shopping"></i> Item Belanja
                        </button>
                        <button class="btn btn-sm btn-info text-white" onclick="openSurvey('${pkg.id}')">
                            <i class="fa-solid fa-magnifying-glass-dollar"></i> Survei Harga
                        </button>
                        
                        ${canSeeHps(currentProfile.role) ? `
                            <button class="btn btn-sm btn-success" onclick="openHps('${pkg.id}')">
                                <i class="fa-solid fa-calculator"></i> HPS
                            </button>
                        ` : ""}
                        
                        <button class="btn btn-sm btn-secondary" onclick="openDocs('${pkg.id}')">
                            <i class="fa-solid fa-file-invoice"></i> Dokumen DPP
                        </button>
                    </div>
                    
                    <div class="d-flex gap-1">
                        <button class="btn btn-sm btn-outline-warning" onclick='editPackage(${JSON.stringify(pkg)})'>
                            <i class="fa-solid fa-pen-to-square"></i> Edit
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletePackage('${pkg.id}')">
                            <i class="fa-solid fa-trash-can"></i> Hapus
                        </button>
                    </div>
                </div>
            </div>`;
        });
    }
    document.getElementById("packageList").innerHTML = html;
}

async function savePackage(e) {
    e.preventDefault();
    
    const id = document.getElementById("packageId").value;
    const payload = {
        program: document.getElementById("program").value,
        kegiatan: document.getElementById("kegiatan").value,
        sub_kegiatan: document.getElementById("subKegiatan").value,
        rup_number: document.getElementById("rupNumber").value,
        account_id: document.getElementById("accountId").value,
        package_name: document.getElementById("packageName").value,
        budget_ceiling: parseFloat(document.getElementById("budgetCeiling").value) || 0,
        output: document.getElementById("output").value,
        dpp_date: document.getElementById("dppDate").value,
        opd_id: currentProfile.opd_id
    };
    
    let res;
    if (id) {
        res = await db.from("packages").update(payload).eq("id", id);
    } else {
        res = await db.from("packages").insert([payload]);
    }
    
    if (res.error) {
        alert(res.error.message);
        return;
    }
    
    alert("Paket berhasil disimpan");
    resetForm();
    await loadPackages();
}

function editPackage(data) {
    document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-pen-to-square me-2"></i>Ubah / Edit Data Paket`;
    document.getElementById("btnSubmit").innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i>Update Paket`;
    
    document.getElementById("packageId").value = data.id;
    document.getElementById("program").value = data.program || "";
    document.getElementById("kegiatan").value = data.kegiatan || "";
    document.getElementById("subKegiatan").value = data.sub_kegiatan || "";
    document.getElementById("rupNumber").value = data.rup_number || "";
    document.getElementById("accountId").value = data.account_id || "";
    document.getElementById("packageName").value = data.package_name || "";
    document.getElementById("budgetCeiling").value = data.budget_ceiling || 0;
    document.getElementById("output").value = data.output || "";
    document.getElementById("dppDate").value = data.dpp_date || "";
    
    document.getElementById("btnCancel").style.display = "inline-block";
    
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function resetForm() {
    document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru`;
    document.getElementById("btnSubmit").innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket`;
    document.getElementById("packageForm").reset();
    document.getElementById("packageId").value = "";
    document.getElementById("btnCancel").style.display = "none";
}

async function deletePackage(id) {
    const ok = confirm("Hapus paket ini ?");
    if (!ok) return;
    
    const { error } = await db.from("packages").delete().eq("id", id);
    if (error) {
        alert(error.message);
        return;
    }
    
    alert("Paket berhasil dihapus");
    await loadPackages();
}

function canSeeHps(role) {
    return ['SUPER_ADMIN', 'ADMIN_OPD', 'PPK'].includes(role);
}

function canSeeBahpe(role) {
    return ['SUPER_ADMIN', 'ADMIN_OPD', 'PPK'].includes(role);
}

function openItems(id) {
    location.href = `package-items.html?id=${id}`;
}

function openSurvey(id) {
    location.href = `price-surveys.html?id=${id}`;
}

function openDocs(id) {
    location.href = `package-documents.html?id=${id}`;
}

function openHps(id) {
    location.href = `hps.html?id=${id}`;
}

init();
</script>
</body>
</html>
