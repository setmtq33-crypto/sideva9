<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIDEVA v9</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="../js/telegram.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/dashboard-documents.js"></script>

    <link rel="stylesheet" href="../css/app.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #333;
        }
        /* Dashboard Page Header Panel */
        .page-header-panel {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.12);
            margin-bottom: 25px;
        }
        
        /* Sections Layout Border Marker */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Custom Workspace Card Panel */
        .card-form-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            background: #ffffff;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        /* Refined Package Blocks Box Row */
        .card-package {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            background: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            border-left: 5px solid #2a5298;
        }
        
        .card-package:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        
        .form-label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        
        .form-control,
        .form-select {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .form-control:focus,
        .form-select:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.12);
        }
        
        .btn {
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 8px 16px;
            transition: all 0.2s;
        }
        
        .btn-group-actions .btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .badge-pagu {
            background-color: #e2e8f0;
            color: #1e293b;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 6px;
        }
        
        .meta-info-text {
            line-height: 1.5;
            margin-bottom: 8px;
            display: block;
        }
        
        .meta-info-text i {
            width: 20px;
            color: #475569;
        }
        
        .required {
            color: red;
        }
        
        textarea.form-control {
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }
        
        /* Styling tambahan untuk elemen di dalam kartu daftar */
        .card-package .list-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
        }
        
        .card-package .list-content {
            font-size: 0.9rem;
            color: #1e293b;
            line-height: 1.5;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #f1f5f9;
            min-height: 40px;
        }
        
        .card-package .pkg-title {
            color: #1e3c72;
            font-size: 1.15rem;
        }
        
        .card-package .border-divider {
            border-top: 1px dashed #e2e8f0;
            margin: 15px 0;
        }
        
        /* Tombol aksi */
        .btn-group-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .meta-info-text .content-multiline {
            white-space: pre-line;
            display: block;
            margin-top: 4px;
            padding-left: 20px;
        }
        
        /* ==========================================
           MOBILE OPTIMIZATION
           iPhone 13 / 14 / 15 / 16
           Android
        ========================================== */
        
        @media (max-width: 768px) {
        
            .page-header-panel {
                padding: 14px;
            }
        
            .page-header-panel h3 {
                font-size: 1.1rem;
                margin-bottom: 8px;
            }
        
            .page-header-panel p {
                font-size: 0.75rem;
                line-height: 1.4;
            }
        
            .card-form-custom {
                padding: 12px;
                margin-bottom: 15px;
            }
        
            .card-package {
                padding: 12px !important;
                margin-bottom: 15px;
            }
        
            .section-title {
                font-size: 0.95rem;
                margin-bottom: 15px;
            }
        
            .form-label {
                font-size: 0.8rem;
            }
        
            .form-control,
            .form-select {
                font-size: 16px; /* anti zoom Safari */
                padding: 10px 12px;
            }
        
            .btn-group-actions {
                flex-direction: column;
                align-items: stretch;
            }
        
            .btn-group-actions .btn {
                width: 100%;
                justify-content: center;
            }
        
            .badge-pagu {
                width: 100%;
                text-align: center;
                margin-top: 10px;
            }
        
            .meta-info-text {
                font-size: 0.9rem;
            }
        
            .card-package .pkg-title {
                font-size: 1rem;
            }
        }
        
        /* Extra Small Device */
        
        @media (max-width: 576px) {
        
            body {
                font-size: 14px;
            }
        
            .container-fluid {
                padding-left: 8px !important;
                padding-right: 8px !important;
            }
        
            .page-header-panel {
                border-radius: 10px;
            }
        
            .card-form-custom {
                border-radius: 10px;
            }
        
            .card-package {
                border-radius: 10px;
            }
        
            .btn {
                min-height: 42px;
            }
        }

        
    </style>
</head>
<body>

<div class="container-fluid p-2 p-md-4">

    <div class="page-header-panel d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center text-white gap-3">
        <div>
            <h3 class="mb-1 fw-bold"><i class="fa-solid fa-cubes me-2"></i>Manajemen Paket Pengadaan</h3>
            <p class="mb-0 text-white-50 small">Kelola data program kegiatan, sub kegiatan belanja, penetapan pagu, rancangan RUP, beserta dokumen e-Purchasing.</p>
        </div>
        <div>
            <a href="dashboard.html" class="btn btn-outline-light px-3 d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-arrow-left-long me-2"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="card-form-custom">
        <div class="section-title" id="formTitle"><i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru</div>
        
        <div class="row g-3">
            <div class="col-md-6" id="opdWrapper">
                <label class="form-label">OPD / Instansi Terkait</label>
                <select id="opdSelect" class="form-select">
                    <option value="">Pilih OPD</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Bidang <span class="required">*</span></label>
                <select id="bidangSelect" class="form-select">
                    <option value="">Pilih Bidang</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Akun Belanja (MAK) <span class="required">*</span></label>
                <select id="makSelect" class="form-select">
                    <option value="">Pilih MAK</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Nomor Kode RUP</label>
                <input type="text" id="rupNumber" class="form-control" placeholder="Masukkan Nomor RUP">
            </div>

            <div class="col-md-4">
                <label class="form-label">Program Kerja</label>
                <textarea id="program" class="form-control" rows="4" placeholder="Input detail nama program"></textarea>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Kegiatan</label>
                <textarea id="kegiatan" class="form-control" rows="4" placeholder="Input detail nama kegiatan"></textarea>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Sub Kegiatan</label>
                <textarea id="subKegiatan" class="form-control" rows="4" placeholder="Input detail sub kegiatan"></textarea>
            </div>

            <div class="col-md-12">
                <label class="form-label">Nama Paket Pekerjaan <span class="required">*</span></label>
                <input type="text" id="packageName" class="form-control" placeholder="Masukkan nama atau spesifikasi paket pengadaan">
            </div>

            <div class="col-md-4">
                <label class="form-label">Metode Pemilihan Pengadaan</label>
                <select id="method" class="form-select">
                    <option value="ECATALOG">E-Catalog</option>
                    <option value="PENGADAAN_LANGSUNG">Pengadaan Langsung</option>
                    <option value="MINI_KOMPETISI">Mini Kompetisi</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Pagu Dana Anggaran (Rp)</label>
                <input type="number" id="budget" class="form-control" placeholder="0">
            </div>

            <div class="col-md-4">
                <label class="form-label">Tanggal Dokumen DPP</label>
                <input type="date" id="dppDate" class="form-control">
            </div>

            <div class="col-md-3">
                <label class="form-label">Lama Pelaksanaan</label>
                <input type="number"
                       id="workDurationDays"
                       class="form-control"
                       placeholder="30">
            </div>
            
            <div class="col-md-3">
                <label class="form-label">Jenis Hari</label>
                <select id="workDurationType"
                        class="form-select">
                    <option value="KALENDER">Hari Kalender</option>
                    <option value="KERJA">Hari Kerja</option>
                </select>
            </div>
            
            <div class="col-md-3">
                <label class="form-label">Tanggal Mulai</label>
                <input type="date"
                       id="workStartDate"
                       class="form-control">
            </div>
            
            <div class="col-md-3">
                <label class="form-label">Tanggal Selesai</label>
                <input type="date"
                       id="workEndDate"
                       class="form-control">
            </div>

            <div class="col-md-12">
                <label class="form-label">Uraian Target Keluaran / Output</label>
                <textarea id="output" rows="3" class="form-control" placeholder="Tulis rincian deskripsi output capaian pekerjaan..."></textarea>
            </div>

            <div class="col-12 mt-4">
                <button class="btn btn-primary px-4 shadow-sm" id="saveBtn">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket
                </button>
            </div>
        </div>
    </div>

    <div class="card-form-custom">
        <div class="section-title"><i class="fa-solid fa-list-check me-2"></i>Daftar Rekapitulasi Paket Aktif</div>
        <div id="packageList">
            </div>
    </div>

</div>

<script>
const db = window.supabaseClient;

let profile = null;
let currentOpdId = null;
let editingPackageId = null;

document.addEventListener("DOMContentLoaded", initPage);

async function initPage(){
    profile = await getProfile();
    if(!profile) return;

    // ATURAN MAIN: Jika user beralih ke SUPER_ADMIN, paksa hak akses bernilai TRUE tanpa batasan permissions.js
    if(
        profile.role !== "SUPER_ADMIN"
        &&
        profile.role !== "ADMIN_OPD"
    ){
        document.getElementById('saveBtn').style.display = 'none';
    }

    if(profile.role === "SUPER_ADMIN"){
        await loadOpds();
        currentOpdId = getCurrentOpdId(profile);

        document.getElementById("opdSelect").value =
    
            currentOpdId || "";
    } else {
        document.getElementById("opdWrapper").style.display = "none";
        currentOpdId = getCurrentOpdId(profile);
    }

    await loadMak();
    await loadBidangs();
    await loadPackages();

    document.getElementById("opdSelect")?.addEventListener("change", async e => {
        currentOpdId = e.target.value;
        if(profile.role === "SUPER_ADMIN"){
            localStorage.setItem(    
                "global_opd_id",
                currentOpdId    
            );
    
        }
        await loadBidangs();
        await loadPackages();
    });

    document.getElementById("saveBtn").addEventListener("click", savePackage);
}

// Tambahkan di dalam tag <script> file packages
function formatMultilineText(text) {
    if (!text) return "-";
    // Regex ini akan mencari pola angka kode (misal 5.05) yang didahului spasi 
    // dan menggantinya dengan baris baru (\n)
    return text.trim().replace(/(\s)(\d+\.)/g, '\n$2');
}

function formatTextWithBreak(text) {
    if (!text) return '<span class="text-muted">-</span>';
    // Memisahkan berdasarkan tanda "-" pertama
    let parts = text.split(/\s*-\s*/);
    if (parts.length > 1) {
        // parts[0] adalah Kode, sisanya adalah Deskripsi
        return `<div class="fw-bold text-primary">${parts[0]}</div>
                <div class="small text-secondary" style="line-height:1.2;">${parts.slice(1).join(' - ')}</div>`;
    }
    return text;
}
    

async function loadOpds(){
    const { data, error } = await db.from("opds").select("*").order("name");
    if(error) return;

    const select = document.getElementById("opdSelect");
    select.innerHTML = '<option value="">Pilih OPD</option>';
    data.forEach(opd => {
        select.innerHTML += `
            <option value="${opd.id}">
                ${opd.code} - ${opd.name}
            </option>
        `;
    });
    
    const activeOpd = getCurrentOpdId(profile);
    
    if(activeOpd){
        select.value = activeOpd;
        currentOpdId = activeOpd;
    }
}

async function loadBidangs(){
    const opdId = profile.role === "SUPER_ADMIN" ? currentOpdId : getCurrentOpdId(profile);
    const select = document.getElementById("bidangSelect");
    select.innerHTML = '<option value="">Pilih Bidang</option>';
    
    if(!opdId) return;

    const { data } = await db.from("bidangs").select("*").eq("opd_id", opdId).order("bidang_name");
    data?.forEach(row=>{
        select.innerHTML += `<option value="${row.id}">${row.bidang_name}</option>`;
    });
}

async function loadMak(){
    const { data, error } = await db.from("budget_accounts").select("*").order("account_code");
    if(error) return;

    const select = document.getElementById("makSelect");
    select.innerHTML = '<option value="">Pilih MAK</option>';
    (data || []).forEach(row => {
        select.innerHTML += `<option value="${row.id}">${row.account_code} - ${row.account_name}</option>`;
    });
}

async function savePackage(){

    if(
        profile.role !== "SUPER_ADMIN"
        &&
        !await canCreatePackage()
    ){
        alert('Anda tidak memiliki hak membuat paket');
        return;
    }

    const opdId =
        profile.role === "SUPER_ADMIN"
        ? currentOpdId
        : getCurrentOpdId(profile);

    if(!opdId){
        alert("Pilih OPD terlebih dahulu");
        return;
    }

    const payload = {
        tenant_id: profile.tenant_id,
        opd_id: opdId,

        package_name:
            document.getElementById("packageName").value,

        fiscal_year:
            new Date().getFullYear(),

        procurement_method:
            document.getElementById("method").value,

        budget_ceiling:
            Number(
                document.getElementById("budget").value || 0
            ),

        created_by:
            profile.id,

        rup_number:
            document.getElementById("rupNumber").value,

        bidang_id:
            document.getElementById("bidangSelect").value,

        program:
            document.getElementById("program").value,

        kegiatan:
            document.getElementById("kegiatan").value,

        sub_kegiatan:
            document.getElementById("subKegiatan").value,

        budget_account_id:
            document.getElementById("makSelect").value,

        output:
            document.getElementById("output").value,

        dpp_date:
            document.getElementById("dppDate").value,

        /* ===== FIELD BARU ===== */

        work_duration_days:
            Number(
                document.getElementById("workDurationDays")?.value || 0
            ),

        work_duration_type:
            document.getElementById("workDurationType")?.value || "KALENDER",

        work_start_date:
            document.getElementById("workStartDate")?.value || null,

        work_end_date:
            document.getElementById("workEndDate")?.value || null
    };

    let query;

    if(editingPackageId){

        query = db
            .from("packages")
            .update(payload)
            .eq("id", editingPackageId);

    }else{

        query = db
            .from("packages")
            .insert(payload);

    }

    const { error } = await query;

    if(error){
        console.error(error);
        alert(error.message);
        return;
    }

    if(editingPackageId){

        await sendNotification(
            'PACKAGE_UPDATED',
            'Paket Diperbarui',
            payload.package_name
        );

    }else{

        await sendNotification(
            'PACKAGE_CREATED',
            'Paket Baru',
            payload.package_name
        );

    }

    alert(
        editingPackageId
            ? "Paket berhasil diperbarui"
            : "Paket berhasil disimpan"
    );

    clearForm();

    await loadPackages();
}

async function loadPackages() {
    let query = db.from("packages").select("*").order("created_at", { ascending: false });
    
    const opdId = profile.role === "SUPER_ADMIN" ? currentOpdId : getCurrentOpdId(profile);
    if (opdId) {
        query = query.eq("opd_id", opdId);
    }

    const { data, error } = await query;
    const container = document.getElementById("packageList");
    container.innerHTML = "";

    if (error || !data || data.length === 0) {
        container.innerHTML = `
        <div class="text-center p-5 text-muted bg-light rounded-3 border border-dashed">
            <i class="fa-solid fa-folder-open display-6 mb-3"></i>
            <p class="mb-0">Belum ada paket pengadaan yang terdaftar dalam cakupan ini.</p>
        </div>`;
        return;
    }

    data.forEach(pkg => {
        container.innerHTML += `
        <div class="card-package p-4 mb-4">
            <!-- Bagian Atas: Nama Paket & Pagu -->
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h5 class="fw-bold text-primary mb-1">${pkg.package_name || '-'}</h5>
                    <div class="text-secondary small fw-medium">
                        <i class="fa-solid fa-hashtag me-1"></i>No. RUP: <span class="text-dark">${pkg.rup_number || '-'}</span>
                        <span class="ms-3 text-muted"><i class="fa-solid fa-code-branch me-1"></i>Metode: ${pkg.procurement_method || '-'}</span>
                    </div>
                </div>
                <div class="badge-pagu shadow-sm border-0" style="background: #eef2f7;">
                    <span class="text-muted small fw-normal">Pagu:</span> Rp ${Number(pkg.budget_ceiling || 0).toLocaleString('id-ID')}
                </div>
            </div>
            
            <!-- Bagian Tengah: Row 3 Kolom (Mengikuti pola Form) -->
            <div class="row g-3 mb-3 pb-3 border-bottom">
                <div class="col-md-4">
                    <label class="form-label text-muted" style="font-size: 0.75rem; text-transform: uppercase;">Program Kerja</label>
                    <div class="meta-info-text text-dark fw-medium">${formatTextWithBreak(pkg.program)}</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted" style="font-size: 0.75rem; text-transform: uppercase;">Kegiatan</label>
                    <div class="meta-info-text text-dark fw-medium">${formatTextWithBreak(pkg.kegiatan)}</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted" style="font-size: 0.75rem; text-transform: uppercase;">Sub Kegiatan</label>
                    <div class="meta-info-text text-dark fw-medium">${formatTextWithBreak(pkg.sub_kegiatan)}</div>
                </div>
            </div>
    
            <!-- Bagian Info Tambahan -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="meta-info-text"><i class="fa-solid fa-wallet"></i> <strong>MAK ID:</strong> ${pkg.budget_account_id || '-'}</div>
                    <div class="meta-info-text"><i class="fa-solid fa-calendar-day"></i> <strong>Tgl DPP:</strong> ${pkg.dpp_date || "-"}</div>
                </div>
                <div class="col-md-6">
                    <div class="meta-info-text"><i class="fa-solid fa-bullseye"></i> <strong>Output:</strong> ${pkg.output || "-"}</div>
                </div>
            </div>
            
            <!-- Bagian Tombol Aksi -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 btn-group-actions">
                <div class="d-flex gap-1 flex-wrap">
                    <button class="btn btn-sm btn-primary" onclick="openItems('${pkg.id}')">
                        <i class="fa-solid fa-basket-shopping"></i> Rincian Belanja
                    </button>
                    <button class="btn btn-sm btn-info text-white" onclick="openSurvey('${pkg.id}')">
                        <i class="fa-solid fa-magnifying-glass-dollar"></i> Survey Harga
                    </button>
                    <button class="btn btn-sm btn-outline-info" onclick="openDpp('${pkg.id}')">
                        <i class="fa-solid fa-file-shield"></i> DPP
                    </button>
                    <button class="btn btn-sm btn-outline-dark" onclick="location.href='dpp-document.html?id=${pkg.id}'">
                        <i class="fa-solid fa-file-pdf"></i> DPP PDF
                    </button>
                    <button class="btn btn-sm btn-secondary" onclick="openDocs('${pkg.id}')">
                        <i class="fa-solid fa-folder"></i> Dokumen
                    </button>
                    
                    ${(profile.role === 'SUPER_ADMIN' || canSeeHps(profile.role)) ? `
                        <button class="btn btn-sm btn-success" onclick="openHps('${pkg.id}')"><i class="fa-solid fa-calculator"></i> HPS</button>
                        <button class="btn btn-sm btn-outline-success" onclick="openBahpe('${pkg.id}')"><i class="fa-solid fa-file-contract"></i> BAHPE</button>
                    ` : ""}
    
                    <button class="btn btn-sm btn-outline-warning" onclick="location.href='review.html?id=${pkg.id}'">Review</button>
                    <button class="btn btn-sm btn-outline-dark" onclick="location.href='review-document.html?id=${pkg.id}'"><i class="fa-solid fa-file-pdf"></i> Review PDF</button>
                    <button class="btn btn-sm btn-primary" onclick="location.href='procurement-ready.html?id=${pkg.id}'">
                        <i class="fa-solid fa-circle-check"></i> Procurement Ready
                    </button>
                </div>
                
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-warning" onclick="editPackage('${pkg.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                    <button
                        class="btn btn-sm btn-danger"
                        onclick="deletePackage(
                            '${pkg.id}',
                            '${pkg.package_name}'
                        )">
                        <i class="fa-solid fa-trash-can"></i>
                        Hapus
                    </button>
                </div>
            </div>
        </div>`;
    });
}

async function editPackage(id){

    const { data, error } = await db
        .from("packages")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    editingPackageId = id;

    document.getElementById("formTitle").innerHTML =
        `<i class="fa-solid fa-pen-to-square me-2"></i>Ubah / Edit Data Paket`;

    document.getElementById("saveBtn").innerHTML =
        `<i class="fa-solid fa-floppy-disk me-2"></i>Perbarui Paket`;

    document.getElementById("rupNumber").value =
        data.rup_number || "";

    document.getElementById("packageName").value =
        data.package_name || "";

    document.getElementById("program").value =
        data.program || "";

    document.getElementById("kegiatan").value =
        data.kegiatan || "";

    document.getElementById("subKegiatan").value =
        data.sub_kegiatan || "";

    document.getElementById("budget").value =
        data.budget_ceiling || "";

    document.getElementById("method").value =
        data.procurement_method || "ECATALOG";

    document.getElementById("bidangSelect").value =
        data.bidang_id || "";

    document.getElementById("makSelect").value =
        data.budget_account_id || "";

    document.getElementById("output").value =
        data.output || "";

    document.getElementById("dppDate").value =
        data.dpp_date || "";

    /* ===== FIELD BARU ===== */

    document.getElementById("workDurationDays").value =
        data.work_duration_days || "";

    document.getElementById("workDurationType").value =
        data.work_duration_type || "KALENDER";

    document.getElementById("workStartDate").value =
        data.work_start_date || "";

    document.getElementById("workEndDate").value =
        data.work_end_date || "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

async function deletePackage(
    id,
    packageName = ''
){

    const ok =
        confirm(
            "Hapus paket ini ?"
        );

    if(!ok) return;

    const { error } =
        await db
            .from("packages")
            .delete()
            .eq("id", id);

    if(error){

        alert(
            error.message
        );

        return;
    }

    await sendNotification(
        'PACKAGE_DELETED',
        'Paket Dihapus',
        packageName || id
    );

    alert(
        "Paket berhasil dihapus"
    );

    await loadPackages();
}

function clearForm(){

    editingPackageId = null;

    document.getElementById("formTitle").innerHTML =
        `<i class="fa-solid fa-folder-plus me-2"></i>Tambah Paket Baru`;

    document.getElementById("saveBtn").innerHTML =
        `<i class="fa-solid fa-floppy-disk me-2"></i>Simpan Paket`;

    document.getElementById("rupNumber").value = "";
    document.getElementById("packageName").value = "";
    document.getElementById("program").value = "";
    document.getElementById("kegiatan").value = "";
    document.getElementById("subKegiatan").value = "";
    document.getElementById("budget").value = "";
    document.getElementById("output").value = "";
    document.getElementById("dppDate").value = "";

    /* ===== FIELD BARU ===== */

    document.getElementById("workDurationDays").value = "";

    document.getElementById("workDurationType").value =
        "KALENDER";

    document.getElementById("workStartDate").value = "";

    document.getElementById("workEndDate").value = "";
}
