<body>

<h1>Dashboard SI-DEVA 9</h1>

<div id="userInfo"></div>

<div id="profileInfo"></div>

<script>

async function init() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = 'login.html';
        return;
    }

    document.getElementById('userInfo').innerHTML = `
        UID : ${user.id}
        <br>
        Email : ${user.email}
    `;

    const { data, error } =
        await supabaseClient
            .from('profiles')
            .select(`
                *,
                opds(name),
                tenants(name)
            `)
            .eq('auth_user_id', user.id)
            .single();

    console.log(data);
    console.log(error);

    if (error) {
        console.error(error);
        return;
    }

    document.getElementById('profileInfo').innerHTML = `
        <p><b>Nama:</b> ${data.full_name}</p>
        <p><b>Role:</b> ${data.role}</p>
        <p><b>Tenant:</b> ${data.tenants?.name ?? '-'}</p>
        <p><b>OPD:</b> ${data.opds?.name ?? '-'}</p>
    `;
}

init();

</script>

</body>
