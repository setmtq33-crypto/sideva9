<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard SI-DEVA 9</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>

</head>
<body>

<h1>SI-DEVA 9</h1>

<div id="userInfo">
Loading...
</div>

<hr>

<h2>Menu Utama</h2>

<p>
<a href="packages.html">
    Kelola Paket Pengadaan
</a>
</p>

<p>
<a href="packages.html">
    Rincian Belanja & Survey Harga
</a>
</p>

<hr>

<h2>Ringkasan</h2>

<div id="summary">

    <p>
        Jumlah Paket :
        <span id="totalPackages">0</span>
    </p>

    <p>
        Jumlah Item :
        <span id="totalItems">0</span>
    </p>

    <p>
        Jumlah Survey :
        <span id="totalSurveys">0</span>
    </p>

</div>

<hr>

<button onclick="logout()">
    Logout
</button>

<script>

let profile = null;

async function loadProfile() {

    const {
        data: { user }
    } =
    await window.supabaseClient.auth.getUser();

    if(!user){

        window.location.href =
            "login.html";

        return;
    }

    const { data, error } =
        await window.supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "auth_user_id",
                user.id
            )
            .single();

    if(error){

        console.error(error);

        return;
    }

    profile = data;

    document.getElementById(
        "userInfo"
    ).innerHTML = `

        <b>${data.full_name}</b>

        <br>

        Email :
        ${data.email}

        <br>

        Role :
        ${data.role}

    `;
}

async function loadSummary() {

    let packageQuery =
        window.supabaseClient
            .from("packages")
            .select("*", {
                count: "exact",
                head: true
            });

    let itemQuery =
        window.supabaseClient
            .from("package_items")
            .select("*", {
                count: "exact",
                head: true
            });

    let surveyQuery =
        window.supabaseClient
            .from("price_surveys")
            .select("*", {
                count: "exact",
                head: true
            });

    if(profile.role === "ADMIN_OPD") {

        packageQuery =
            packageQuery.eq(
                "opd_id",
                profile.opd_id
            );

        itemQuery =
            itemQuery.eq(
                "opd_id",
                profile.opd_id
            );

        surveyQuery =
            surveyQuery.eq(
                "opd_id",
                profile.opd_id
            );
    }

    const {
        count: packageCount
    } = await packageQuery;

    const {
        count: itemCount
    } = await itemQuery;

    const {
        count: surveyCount
    } = await surveyQuery;

    document.getElementById(
        "totalPackages"
    ).innerText =
        packageCount || 0;

    document.getElementById(
        "totalItems"
    ).innerText =
        itemCount || 0;

    document.getElementById(
        "totalSurveys"
    ).innerText =
        surveyCount || 0;
}

async function logout() {

    await window.supabaseClient
        .auth
        .signOut();

    window.location.href =
        "login.html";
}

async function init() {

    await loadProfile();

    await loadSummary();
}

init();

</script>

</body>
</html>
