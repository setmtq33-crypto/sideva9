<button onclick="logout()">

</button>

<script>

let profile = null;

async function loadProfile() {

    const {
        data: { user }
    } =
    await window.supabaseClient.auth.getUser();

    if(!user){

        window.location.href =
            "login.html";

        return;
    }

    const {
        data,
        error
    } =
    await window.supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "auth_user_id",
            user.id
        )
        .single();

    if(error){

        console.error(error);

        return;
    }

    profile = data;

    document.getElementById(
        "userInfo"
    ).innerHTML = `

        <b>${data.full_name}</b>

        <br>

        ${data.email}

        <br>

        Role :
        ${data.role}

    `;
}

async function logout() {

    await window.supabaseClient
        .auth
        .signOut();

    window.location.href =
        "login.html";
}

loadProfile();

</script>
