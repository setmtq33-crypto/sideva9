<table class="table table-bordered">

<thead>
<tr>
<th>Nama Paket</th>

<script>

const dashboardDb = window.supabaseClient;

function rupiah(v){
 return new Intl.NumberFormat('id-ID',{
 style:'currency',
 currency:'IDR',
 maximumFractionDigits:0
 }).format(v||0);
}

async function init(){

 const profile = await getProfile();

 document.getElementById('welcomeText').innerHTML =
 `Selamat datang <b>${profile.full_name}</b> (${profile.role})`;

 await loadKPI();
 await loadStatus();
 await loadRecentPackages();
}

async function loadKPI(){

 const {data:packages} =
 await dashboardDb.from('packages').select('*');

 const {data:hps} =
 await dashboardDb.from('package_hps').select('*');

 const totalPackages =
 (packages||[]).length;

 const totalBudget =
 (packages||[]).reduce((a,b)=>
 a + Number(b.budget_ceiling||0),0);

 const totalHps =
 (hps||[]).reduce((a,b)=>
 a + Number(b.total_hps||0),0);

 document.getElementById('totalPackages').innerText =
 totalPackages;

 document.getElementById('totalBudget').innerText =
 rupiah(totalBudget);

 document.getElementById('totalHps').innerText =
 rupiah(totalHps);

 document.getElementById('efficiency').innerText =
 rupiah(totalBudget-totalHps);
}

async function loadStatus(){

 const statuses=[
 'DRAFT',
 'DPP_COMPLETE',
 'ITEMS_COMPLETE',
 'SURVEY_COMPLETE',
 'DOCUMENT_COMPLETE',
 'HPS_COMPLETE',
 'BAHPE_DRAFT',
 'BAHPE_COMPLETE',
 'READY_PROCUREMENT',
 ];

 const {data} =
 await dashboardDb.from('packages')
 .select('package_status');

 let html='';

 statuses.forEach(status=>{

   const count =
   (data||[]).filter(x=>
   x.package_status===status).length;

   html += `
   <tr>
     <td>${status}</td>
     <td>${count}</td>
   </tr>`;
 });

 document.getElementById('statusTable').innerHTML=html;
}

async function loadRecentPackages(){

 const {data} =
 await dashboardDb
 .from('packages')
 .select('*')
 .order('created_at',{ascending:false})
 .limit(10);

 let html='';

 (data||[]).forEach(pkg=>{

 html += `
 <tr>
   <td>${pkg.package_name}</td>
   <td>${rupiah(pkg.budget_ceiling)}</td>
   <td>${pkg.package_status||'DRAFT'}</td>
 </tr>`;
 });

 document.getElementById('recentPackages').innerHTML=html;
}


init();

</script>
