<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
OPD Management
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
}

.table td,
.table th{
    vertical-align:middle;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div
class="d-flex justify-content-between align-items-center mb-4">

<h3>

OPD Management

</h3>

<div>

<a
href="dashboard.html"
class="btn btn-secondary">

Dashboard

</a>

</div>

</div>

<div class="card mb-4">

<div class="card-body">

<div class="row">

<div class="col-md-3">

<label>

Kode OPD

</label>

<input
id="code"
class="form-control">

</div>

<div class="col-md-4">

<label>
Nama OPD
</label>

<input
id="name"
class="form-control">

</div>

<div class="col-md-5">

<label>
Nama SIRUP
</label>

<input
id="sirup_name"
class="form-control">

</div>

<div
class="col-md-3 d-flex align-items-end">

<button
id="saveBtn"
class="btn btn-primary w-100">

Simpan OPD

</button>

</div>

</div>

</div>

</div>

<div class="card">

<div class="card-body">

<table
class="table table-bordered">

<thead>

<tr>

<th width="150">

Kode

</th>

<th>

Nama OPD

</th>

<th width="120">

Status

</th>

<th width="250">

Aksi

</th>

</tr>

</thead>

<tbody id="opdTable">

<tr>

<td colspan="4">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>

const opdDb =
    window.supabaseClient;

let currentProfile =
    null;

let editId =
    null;

async function init(){

    currentProfile =
        await getProfile();

    if(
        currentProfile.role !==
        'SUPER_ADMIN'
    ){

        alert(
            'Akses ditolak'
        );

        location.href =
            'dashboard.html';

        return;
    }

    document
    .getElementById(
        'saveBtn'
    )
    .onclick =
        saveOpd;

    await loadOpds();
}

document
.getElementById('name')
.addEventListener(
    'input',
    function(){

        const sirup =
        document.getElementById(
            'sirup_name'
        );

        if(
            !sirup.value
        ){
            sirup.value =
                this.value;
        }
    }
);

async function loadOpds(){

    const {
        data,
        error
    } =
    await opdDb
    .from('opds')
    .select('*')
    .order(
        'name',
        {
            ascending:true
        }
    );

    if(error){

        console.error(error);

        return;
    }

    let html = '';

    data.forEach(opd => {

        html += `

        <tr>

            <td>

                ${opd.code || ''}

            </td>

            <td>

                ${opd.name || ''}

            </td>

            <td>

                ${
                    opd.is_active
                    ? '<span class="badge bg-success">Aktif</span>'
                    : '<span class="badge bg-danger">Nonaktif</span>'
                }

            </td>

            <td>

                <button
                class="btn btn-sm btn-warning"
                onclick="editOpd(
                    '${opd.id}',
                    '${opd.code}',
                    '${opd.name}',
                    '${opd.sirup_name || ''}'
                )">

                Edit

                </button>

                <button
                class="btn btn-sm btn-secondary"
                onclick="toggleOpd(
                    '${opd.id}',
                    ${opd.is_active}
                )">

                Toggle

                </button>

            </td>

        </tr>

        `;
    });

    if(
        html === ''
    ){

        html = `

        <tr>

            <td colspan="4">

                Belum ada OPD

            </td>

        </tr>

        `;
    }

    document
    .getElementById(
        'opdTable'
    )
    .innerHTML =
        html;
}

async function saveOpd(){

    const opdCode =
        document
        .getElementById('code')
        .value
        .trim();

    const opdName =
        document
        .getElementById('name')
        .value
        .trim();

    const sirupName =
        document
        .getElementById('sirup_name')
        .value
        .trim();

    if(
        !opdCode ||
        !opdName
    ){
        alert(
            'Kode dan Nama OPD wajib diisi'
        );
        return;
    }

    let result;

    if(editId){

        result =
        await opdDb
        .from('opds')
        .update({

            code:
                opdCode,

            name:
                opdName,

            sirup_name:
                sirupName || opdName

        })
        .eq(
            'id',
            editId
        );

        await writeAuditLog(
            'OPD',
            'UPDATE',
            editId,
            'Update OPD'
        );

    }else{

        result =
        await opdDb
        .from('opds')
        .insert({

            tenant_id:
                currentProfile.tenant_id,

            code:
                opdCode,

            name:
                opdName,

            sirup_name:
                sirupName || opdName,

            is_active:
                true

        });

        await writeAuditLog(
            'OPD',
            'CREATE',
            null,
            'Tambah OPD'
        );
    }

    if(result.error){

        alert(
            result.error.message
        );

        return;
    }

    document.getElementById(
        'code'
    ).value='';

    document.getElementById(
        'name'
    ).value='';

    document.getElementById(
        'sirup_name'
    ).value='';

    editId = null;

    await loadOpds();

    alert(
        'Data berhasil disimpan'
    );
}

function editOpd(
    id,
    codeValue,
    nameValue,
    sirupValue
){

    editId = id;

    document
    .getElementById('code')
    .value =
        codeValue;

    document
    .getElementById('name')
    .value =
        nameValue;

    document
    .getElementById('sirup_name')
    .value =
        sirupValue || '';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

async function toggleOpd(
    id,
    currentStatus
){

    const {
        error
    } =
    await opdDb
    .from('opds')
    .update({

        is_active:
            !currentStatus

    })
    .eq(
        'id',
        id
    );

    if(error){

        alert(
            error.message
        );

        return;
    }

    await writeAuditLog(

        'OPD',

        'TOGGLE',

        id,

        'Aktif Nonaktif OPD'

    );

    await loadOpds();
}

init();

</script>

</body>
</html>
