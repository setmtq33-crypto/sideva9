<script>

const rupDb =
    window.supabaseClient;

let profile =
    null;

let editingRupId =
    null;

async function init(){

    await loadLayout();

    profile =
        await getProfile();

    if(!profile){
        return;
    }

    document
        .getElementById(
            'saveBtn'
        )
        .onclick =
        saveRup;

    await loadRupImports();
    await loadOpdFilter();
    await loadOpdDropdown();

    document
    .getElementById(
        'syncSirupBtn'
    )
    .onclick =
    syncSirup;

    document
    .getElementById(
        'importJsonBtn'
    )
    .onclick =
    importSirupJson;

    document
    .getElementById(
        'searchSatkerBtn'
    )
    .onclick =
    tarikSatker;

    document
    .getElementById('searchRup')
    ?.addEventListener(
        'input',
        filterRupTable
    )

    document
    .getElementById('filterOpd')
    ?.addEventListener(
        'change',
        filterRupTable
    );
    
}

async function loadRupImports(){

    const {
        data,
        error
    } =
    await rupDb
    .from('rup_imports')
    .select('*')
    .order(
        'created_at',
        {
            ascending:false
        }
    );

    if(error){

        console.error(error);

        return;
    }

    let html='';

    (data || [])
    .forEach(row=>{

        html += `

        <tr>

            <td class="fw-semibold text-secondary">
                ${row.rup_number || '-'}
            </td>

            <td>
                ${row.opd_name || '-'}
            </td>

            <td class="fw-medium text-dark">
                ${row.package_name || '-'}
            </td>

            <td class="fw-bold text-slate-700">
                Rp ${Number(
                    row.budget_ceiling || 0
                ).toLocaleString('id-ID')}
            </td>

            <td class="text-center">
                <div class="d-inline-flex gap-1">
                    <button
                    class="btn btn-success btn-sm"
                    onclick="importToPackage('${row.id}')" title="Import ke Paket">
                    Import
                    </button>
                
                    <button
                    class="btn btn-warning btn-sm"
                    onclick="editRup('${row.id}')" title="Edit">
                    Edit
                    </button>
                
                    <button
                    class="btn btn-danger btn-sm"
                    onclick="deleteRup('${row.id}')" title="Hapus">
                    Hapus
                    </button>
                </div>
            </td>

        </tr>

        `;
    });

    if(html === ''){

        html = `

        <tr>

            <td colspan="5" class="text-center py-4 text-muted">
                Belum ada data RUP
            </td>

        </tr>

        `;
    }

    document
        .getElementById(
            'rupTable'
        )
        .innerHTML =
        html;
}

async function loadOpdFilter(){

    const {
        data
    } = await rupDb
        .from('opds')
        .select('name')
        .order('name');

    let html =
        '<option value="">Semua OPD</option>';

    (data || []).forEach(opd => {

        html += `
        <option value="${opd.name}">
            ${opd.name}
        </option>`;
    });

    document
        .getElementById('filterOpd')
        .innerHTML = html;
}

async function loadOpdDropdown(){

    const { data, error } =
        await rupDb
        .from('opds')
        .select('name,sirup_name')
        .order('name');

    if(error){
        console.error(error);
        return;
    }

    let html =
        '<option value="">Pilih OPD</option>';

    (data || []).forEach(opd => {

        html += `
        <option value="${opd.sirup_name || opd.name}">
            ${opd.name}
        </option>`;
    });

    document
        .getElementById('opdName')
        .innerHTML = html;
}


async function saveRup(){

        const rupNumber =
        document
        .getElementById(
            'rupNumber'
        )
        .value
        .trim();
    
    const opdName =
        document
        .getElementById(
            'opdName'
        )
        .value
        .trim();
    
    const packageName =
        document
        .getElementById(
            'packageName'
        )
        .value
        .trim();
    
    const fiscalYear =
        document
        .getElementById(
            'fiscalYear'
        )
        .value;
    
    const budgetCeiling =
        document
        .getElementById(
            'budgetCeiling'
        )
        .value;
    
    const procurementMethod =
        document
        .getElementById(
            'procurementMethod'
        )
        .value
        .trim();
    
    const sourceUrl =
        document
        .getElementById(
            'sourceUrl'
        )
        .value
        .trim();
    
    if(
        !rupNumber ||
        !packageName
    ){
    
        alert(
            'Kode RUP dan Nama Paket wajib diisi'
        );
    
        return;
    }
    
    let query;
    
    if(editingRupId){
    
        query =
        rupDb
        .from('rup_imports')
        .update({
    
            opd_name:
                opdName,
    
            rup_number:
                rupNumber,
    
            package_name:
                packageName,
    
            fiscal_year:
                fiscalYear,
    
            budget_ceiling:
                budgetCeiling,
    
            procurement_method:
                procurementMethod,
    
            source_url:
                sourceUrl
    
        })
        .eq(
            'id',
            editingRupId
        );
    
    }else{
    
        query =
        rupDb
        .from('rup_imports')
        .insert({
    
            tenant_id:
                profile.tenant_id,
    
            opd_name:
                opdName,
    
            rup_number:
                rupNumber,
    
            package_name:
                packageName,
    
            fiscal_year:
                fiscalYear,
    
            budget_ceiling:
                budgetCeiling,
    
            procurement_method:
                procurementMethod || 'ECATALOG',
    
            source_url:
                sourceUrl,
    
            imported_by:
                profile.id
    
        });
    
    }
    
    const {
        error
    } =
    await query;
    
    if(error){
    
        alert(
            error.message
        );
    
        return;
    }
    
    await writeAuditLog(
    
        'RUP_IMPORT',
    
        editingRupId
            ? 'UPDATE'
            : 'CREATE',
    
        editingRupId,
    
        editingRupId
            ? `Update RUP ${rupNumber}`
            : `Import RUP ${rupNumber}`
    
    );

    
    clearForm();
    
    await loadRupImports();
    
    alert(
    
        editingRupId
        ? 'RUP berhasil diperbarui'
        : 'RUP berhasil disimpan'
    
    );
}

function mapProcurementMethod(
    method
){

    if(!method)
        return 'ECATALOG';

    const value =
        method
        .toUpperCase();

    if(
        value.includes(
            'E-PURCHASING'
        )
    ){
        return 'ECATALOG';
    }

    if(
        value.includes(
            'LANGSUNG'
        )
    ){
        return 'PENGADAAN_LANGSUNG';
    }

    if(
        value.includes(
            'MINI'
        )
    ){
        return 'MINI_KOMPETISI';
    }

    return 'ECATALOG';
}
    

async function importToPackage(
    rupId
){

    const {
        data: rup,
        error
    } =
    await rupDb
    .from('rup_imports')
    .select('*')
    .eq(
        'id',
        rupId
    )
    .single();

    if(error){

        alert(
            error.message
        );

        return;
    }

    const {
        data: opd
    } =
    await rupDb
    .from('opds')
    .select('*')
    .eq(
        'sirup_name',
        rup.opd_name
    )
    .single();

    if(!opd){

        alert(
            'Mapping OPD tidak ditemukan'
        );

        return;
    }

    const {
        error: packageError
    } =
    await rupDb
    .from('packages')
    .insert({

        tenant_id:
            profile.tenant_id,

        opd_id:
            opd.id,

        package_name:
            rup.package_name,

        fiscal_year:
            rup.fiscal_year,

        procurement_method:
            mapProcurementMethod(
                rup.procurement_method
            ),

        budget_ceiling:
            rup.budget_ceiling,

        rup_number:
            rup.rup_number,

        package_status:
            'DRAFT',

        created_by:
            profile.id

    });

    if(packageError){

        alert(
            packageError.message
        );

        return;
    }

    await writeAuditLog(

        'RUP_IMPORT',

        'IMPORT_PACKAGE',

        rup.id,

        `Import RUP ${rup.rup_number} ke Packages`

    );

    alert(
        'Berhasil import ke Packages'
    );
}

function filterRupTable(){

    const keyword =
        document
        .getElementById('searchRup')
        .value
        .toLowerCase();

    const opdFilter =
        document
        .getElementById('filterOpd')
        .value
        .toLowerCase();

    document
        .querySelectorAll('#rupTable tr')
        .forEach(row => {

            const text =
                row.innerText.toLowerCase();

            const cocokCari =
                text.includes(keyword);

            const cocokOpd =
                !opdFilter ||
                text.includes(opdFilter);

            row.style.display =
                (cocokCari && cocokOpd)
                ? ''
                : 'none';
        });
}

async function editRup(id){

    console.log(
        'EDIT',
        id
    );
    
    const {
        data,
        error
    } =
    await rupDb
    .from('rup_imports')
    .select('*')
    .eq('id',id)
    .single();

    console.log(
    data,
    error
    );

    if(error){
        alert(error.message);
        return;
    }

    editingRupId = id;

    document.getElementById(
        'rupNumber'
    ).value =
    data.rup_number || '';

    document.getElementById(
        'opdName'
    ).value =
    data.opd_name || '';

    document.getElementById(
        'packageName'
    ).value =
    data.package_name || '';

    document.getElementById(
        'fiscalYear'
    ).value =
    data.fiscal_year || '';

    document.getElementById(
        'budgetCeiling'
    ).value =
    data.budget_ceiling || '';

    document.getElementById(
        'procurementMethod'
    ).value =
    data.procurement_method || '';

    document.getElementById(
        'sourceUrl'
    ).value =
    data.source_url || '';

}

async function deleteRup(id){

    const ok =
    confirm(
        'Hapus data RUP ini ?'
    );

    if(!ok){
        return;
    }

    const {
        error
    } =
    await rupDb
    .from('rup_imports')
    .delete()
    .eq('id',id);

    if(error){

        alert(
            error.message
        );

        return;
    }

    await loadRupImports();

    alert(
        'RUP berhasil dihapus'
    );

}
    
    

function clearForm(){

    document
        .getElementById(
            'rupNumber'
        )
        .value='';

    document
        .getElementById(
            'opdName'
        )
        .value='';

    document
        .getElementById(
            'packageName'
        )
        .value='';

    document
        .getElementById(
            'fiscalYear'
        )
        .value='';

    document
        .getElementById(
            'budgetCeiling'

async function syncSirup(){

    try{

            await fetch(
                endpoint,
                {
                    headers:{

                }

        const result =
            await response.json();

        const rows =

        for(

        ){

            const rupNumber =
                row[0];

            const packageName =
                row[1];

            const budgetCeiling =
                Number(

                );

            const procurementMethod =
                row[3];

            const sourceFund =
                row[4];

            const selectionSchedule =
                row[6];

            const {
                error
            } =
            await rupDb
            .from(
                'rup_imports'
            )
            .upsert({

                tenant_id:
                    profile.tenant_id,

                opd_name:
'BADAN PERENCANAAN PEMBANGUNAN, RISET DAN INOVASI DAERAH',

                rup_number:
                    rupNumber,

                package_name:
                    packageName,

                budget_ceiling:
                    budgetCeiling,

                procurement_method:
                    procurementMethod,

                source_fund:
                    sourceFund,

                selection_schedule:
                    selectionSchedule,

                fiscal_year:
                    2026,

                sync_year:
                    2026,

                sirup_satker_id:
                    '404567',

                imported_by:
                    profile.id

            });

            if(
                !error
            ){
                imported++;
            }

        }

        await loadRupImports();

        alert(
            imported +
            ' paket berhasil disinkronkan'
        );

    }
    catch(err){

        console.error(
            err
        );

        alert(
            'CORS Error atau gagal akses SIRUP'
        );

    }

}

async function importSirupJson(){

    try{

        const rawJson =
            document
            .getElementById(
                'sirupJson'
            )
            .value
            .trim();

        if(
            !rawJson
        ){
            alert(
                'Paste JSON SIRUP terlebih dahulu'
            );
            return;
        }

        const json =
            JSON.parse(
                rawJson
            );

        const rows =
            json.aaData || [];

        if(
            rows.length === 0
        ){
            alert(
                'Tidak ada data paket'
            );
            return;
        }

        let imported = 0;

        for(
            const row of rows
        ){

            const rupNumber =
                row[0];

            const packageName =
                row[1];

            const budgetCeiling =
                Number(
                    row[2]
                );

            const sirupMethod =
                row[3];

            let procurementMethod =
                'PENGADAAN_LANGSUNG';

            if(
                sirupMethod
                ?.toUpperCase()
                .includes(
                    'E-PURCHASING'
                )
            ){
                procurementMethod =
                    'ECATALOG';
            }

            const {
                error
            } =
            await rupDb
            .from(
                'rup_imports'
            )
            .upsert({

                tenant_id:
                    profile.tenant_id,

                rup_number:
                    rupNumber,

                package_name:
                    packageName,

                budget_ceiling:
                    budgetCeiling,

                procurement_method:
                    procurementMethod,

                fiscal_year:
                    2026,

                sync_year:
                    2026,

                sirup_satker_id:
                    '404567',

                import_status:
                    'PENDING',

                imported_by:
                    profile.id

            },
            {
                onConflict:
                'rup_number'
            });

            if(
                !error
            ){
                imported++;
            }
            else{
                console.error(
                    error
                );
            }

        }

        await loadRupImports();

        alert(

            imported +

            ' paket berhasil diimport'

        );

    }
    catch(error){

        console.error(
            error
        );

        alert(
            error.message
        );

    }

}
