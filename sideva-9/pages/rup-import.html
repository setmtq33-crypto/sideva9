<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
Import RUP
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>
<script src="../js/layout.js"></script>

<link
rel="stylesheet"
href="../css/app.css">

<style>

body{
    background:#f5f6fa;
}

.card{
    border:none;
    border-radius:12px;
}

textarea{
    min-height:250px;
}

</style>

</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

<div id="topbar-container"></div>

<div class="container-fluid p-4">

<div
class="d-flex justify-content-between align-items-center mb-4">

<div>

<h3>
Import RUP
</h3>

<small class="text-muted">
Import data paket dari SIRUP
</small>

</div>

<a
href="dashboard.html"
class="btn btn-secondary">

Dashboard

</a>

</div>

<div class="card mb-4">

<div class="card-header">

Paste Detail RUP

</div>

<div class="card-body">

<div class="mb-3">

<label class="form-label">

Kode RUP

</label>

<input
id="rupNumber"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Nama OPD SIRUP

</label>

<input
id="opdName"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Nama Paket

</label>

<input
id="packageName"
class="form-control">

</div>

<div class="row">

<div class="col-md-4">

<label class="form-label">

Tahun

</label>

<input
id="fiscalYear"
type="number"
class="form-control">

</div>

<div class="col-md-4">

<label class="form-label">

Pagu

</label>

<input
id="budgetCeiling"
type="number"
class="form-control">

</div>

<div class="col-md-4">

<label class="form-label">

Metode

</label>

<input
id="procurementMethod"
class="form-control">

</div>

</div>

<div class="mt-3">

<label class="form-label">

Source URL

</label>

<input
id="sourceUrl"
class="form-control">

</div>

<div class="mt-4">

<button
id="saveBtn"
class="btn btn-primary">

Simpan RUP

</button>

<button
id="syncSirupBtn"
class="btn btn-success ms-2">

Sync SIRUP 2026

</button>

</div>

</div>

</div>

<div class="card mb-4">

    <div class="card-header">

        Import JSON SIRUP

    </div>

    <div class="card-body">

        <textarea
            id="sirupJson"
            class="form-control"
            rows="10"
            placeholder="Paste JSON response SIRUP di sini">
        </textarea>

        <button
            id="importJsonBtn"
            class="btn btn-success mt-3">

            Import JSON SIRUP

        </button>

    </div>

</div>

    

<div class="card">

<div class="card-header">

Daftar Import RUP

</div>

<div class="card-body">

<table
class="table table-bordered">

<thead>

<tr>

<th>Kode RUP</th>
<th>OPD</th>
<th>Nama Paket</th>
<th>Pagu</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="rupTable">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const rupDb =
    window.supabaseClient;

let profile =
    null;

async function init(){

    await loadLayout();

    profile =
        await getProfile();

    if(!profile){
        return;
    }

    document
        .getElementById(
            'saveBtn'
        )
        .onclick =
        saveRup;

    await loadRupImports();

    document
    .getElementById(
        'syncSirupBtn'
    )
    .onclick =
    syncSirup;

    document
    .getElementById(
        'importJsonBtn'
    )
    .onclick =
    importSirupJson;
    
}

async function loadRupImports(){

    const {
        data,
        error
    } =
    await rupDb
    .from('rup_imports')
    .select('*')
    .order(
        'created_at',
        {
            ascending:false
        }
    );

    if(error){

        console.error(error);

        return;
    }

    let html='';

    (data || [])
    .forEach(row=>{

        html += `

        <tr>

            <td>
                ${row.rup_number || '-'}
            </td>

            <td>
                ${row.opd_name || '-'}
            </td>

            <td>
                ${row.package_name || '-'}
            </td>

            <td>
                Rp ${Number(
                    row.budget_ceiling || 0
                ).toLocaleString('id-ID')}
            </td>

            <td>

                <button
                class="btn btn-success btn-sm"
                onclick="importToPackage(
                    '${row.id}'
                )">

                Import

                </button>

            </td>

        </tr>

        `;
    });

    if(html === ''){

        html = `

        <tr>

            <td colspan="5">

                Belum ada data RUP

            </td>

        </tr>

        `;
    }

    document
        .getElementById(
            'rupTable'
        )
        .innerHTML =
        html;
}

async function saveRup(){

    const rupNumber =
        document
        .getElementById(
            'rupNumber'
        )
        .value
        .trim();

    const opdName =
        document
        .getElementById(
            'opdName'
        )
        .value
        .trim();

    const packageName =
        document
        .getElementById(
            'packageName'
        )
        .value
        .trim();

    const fiscalYear =
        document
        .getElementById(
            'fiscalYear'
        )
        .value;

    const budgetCeiling =
        document
        .getElementById(
            'budgetCeiling'
        )
        .value;

    const procurementMethod =
        document
        .getElementById(
            'procurementMethod'
        )
        .value
        .trim();

    const sourceUrl =
        document
        .getElementById(
            'sourceUrl'
        )
        .value
        .trim();

    if(
        !rupNumber ||
        !packageName
    ){

        alert(
            'Kode RUP dan Nama Paket wajib diisi'
        );

        return;
    }

    const {
        error
    } =
    await rupDb
    .from('rup_imports')
    .insert({

        tenant_id:
            profile.tenant_id,

        opd_name:
            opdName,

        rup_number:
            rupNumber,

        package_name:
            packageName,

        fiscal_year:
            fiscalYear,

        budget_ceiling:
            budgetCeiling,

        procurement_method:
            'ECATALOG',

        source_url:
            sourceUrl,

        imported_by:
            profile.id

    });

    if(error){

        alert(
            error.message
        );

        return;
    }

    await writeAuditLog(

        'RUP_IMPORT',

        'CREATE',

        null,

        `Import RUP ${rupNumber}`

    );

    clearForm();

    await loadRupImports();

    alert(
        'RUP berhasil disimpan'
    );
}

function mapProcurementMethod(
    method
){

    if(!method)
        return 'ECATALOG';

    const value =
        method
        .toUpperCase();

    if(
        value.includes(
            'E-PURCHASING'
        )
    ){
        return 'ECATALOG';
    }

    if(
        value.includes(
            'LANGSUNG'
        )
    ){
        return 'PENGADAAN_LANGSUNG';
    }

    if(
        value.includes(
            'MINI'
        )
    ){
        return 'MINI_KOMPETISI';
    }

    return 'ECATALOG';
}
    

async function importToPackage(
    rupId
){

    const {
        data: rup,
        error
    } =
    await rupDb
    .from('rup_imports')
    .select('*')
    .eq(
        'id',
        rupId
    )
    .single();

    if(error){

        alert(
            error.message
        );

        return;
    }

    const {
        data: opd
    } =
    await rupDb
    .from('opds')
    .select('*')
    .eq(
        'sirup_name',
        rup.opd_name
    )
    .single();

    if(!opd){

        alert(
            'Mapping OPD tidak ditemukan'
        );

        return;
    }

    const {
        error: packageError
    } =
    await rupDb
    .from('packages')
    .insert({

        tenant_id:
            profile.tenant_id,

        opd_id:
            opd.id,

        package_name:
            rup.package_name,

        fiscal_year:
            rup.fiscal_year,

        procurement_method:
            mapProcurementMethod(
                rup.procurement_method
            ),

        budget_ceiling:
            rup.budget_ceiling,

        rup_number:
            rup.rup_number,

        package_status:
            'DRAFT',

        created_by:
            profile.id

    });

    if(packageError){

        alert(
            packageError.message
        );

        return;
    }

    await writeAuditLog(

        'RUP_IMPORT',

        'IMPORT_PACKAGE',

        rup.id,

        `Import RUP ${rup.rup_number} ke Packages`

    );

    alert(
        'Berhasil import ke Packages'
    );
}

function clearForm(){

    document
        .getElementById(
            'rupNumber'
        )
        .value='';

    document
        .getElementById(
            'opdName'
        )
        .value='';

    document
        .getElementById(
            'packageName'
        )
        .value='';

    document
        .getElementById(
            'fiscalYear'
        )
        .value='';

    document
        .getElementById(
            'budgetCeiling'
        )
        .value='';

    document
        .getElementById(
            'procurementMethod'
        )
        .value='';

    document
        .getElementById(
            'sourceUrl'
        )
        .value='';
}

async function syncSirup(){

    try{

        const endpoint =
'https://sirup.inaproc.id/sirup/datatablectr/dataruppenyediasatker?tahun=2026&idSatker=404567&sEcho=1&iColumns=7&iDisplayStart=0&iDisplayLength=500';

        const response =
            await fetch(
                endpoint,
                {
                    headers:{
                        'X-Requested-With':
                        'XMLHttpRequest'
                    }
                }
            );

        const result =
            await response.json();

        const rows =
            result.aaData || [];

        let imported = 0;

        for(
            const row of rows
        ){

            const rupNumber =
                row[0];

            const packageName =
                row[1];

            const budgetCeiling =
                Number(
                    row[2]
                );

            const procurementMethod =
                row[3];

            const sourceFund =
                row[4];

            const selectionSchedule =
                row[6];

            const {
                error
            } =
            await rupDb
            .from(
                'rup_imports'
            )
            .upsert({

                tenant_id:
                    profile.tenant_id,

                opd_name:
'BADAN PERENCANAAN PEMBANGUNAN, RISET DAN INOVASI DAERAH',

                rup_number:
                    rupNumber,

                package_name:
                    packageName,

                budget_ceiling:
                    budgetCeiling,

                procurement_method:
                    procurementMethod,

                source_fund:
                    sourceFund,

                selection_schedule:
                    selectionSchedule,

                fiscal_year:
                    2026,

                sync_year:
                    2026,

                sirup_satker_id:
                    '404567',

                imported_by:
                    profile.id

            });

            if(
                !error
            ){
                imported++;
            }

        }

        await loadRupImports();

        alert(
            imported +
            ' paket berhasil disinkronkan'
        );

    }
    catch(err){

        console.error(
            err
        );

        alert(
            'CORS Error atau gagal akses SIRUP'
        );

    }

}

async function importSirupJson(){

    try{

        const rawJson =
            document
            .getElementById(
                'sirupJson'
            )
            .value
            .trim();

        if(
            !rawJson
        ){
            alert(
                'Paste JSON SIRUP terlebih dahulu'
            );
            return;
        }

        const json =
            JSON.parse(
                rawJson
            );

        const rows =
            json.aaData || [];

        if(
            rows.length === 0
        ){
            alert(
                'Tidak ada data paket'
            );
            return;
        }

        let imported = 0;

        for(
            const row of rows
        ){

            const rupNumber =
                row[0];

            const packageName =
                row[1];

            const budgetCeiling =
                Number(
                    row[2]
                );

            const sirupMethod =
                row[3];

            let procurementMethod =
                'PENGADAAN_LANGSUNG';

            if(
                sirupMethod
                ?.toUpperCase()
                .includes(
                    'E-PURCHASING'
                )
            ){
                procurementMethod =
                    'ECATALOG';
            }

            const {
                error
            } =
            await rupDb
            .from(
                'rup_imports'
            )
            .upsert({

                tenant_id:
                    profile.tenant_id,

                rup_number:
                    rupNumber,

                package_name:
                    packageName,

                budget_ceiling:
                    budgetCeiling,

                procurement_method:
                    procurementMethod,

                fiscal_year:
                    2026,

                sync_year:
                    2026,

                sirup_satker_id:
                    '404567',

                import_status:
                    'PENDING',

                imported_by:
                    profile.id

            },
            {
                onConflict:
                'rup_number'
            });

            if(
                !error
            ){
                imported++;
            }
            else{
                console.error(
                    error
                );
            }

        }

        await loadRupImports();

        alert(

            imported +

            ' paket berhasil diimport'

        );

    }
    catch(error){

        console.error(
            error
        );

        alert(
            error.message
        );

    }

}



init();

</script>

</body>
</html>
