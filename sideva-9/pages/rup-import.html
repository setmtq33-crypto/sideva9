<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
Import RUP
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>
<script src="../js/layout.js"></script>

<link
rel="stylesheet"
href="../css/app.css">

<style>

body{
    background:#f5f6fa;
}

.card{
    border:none;
    border-radius:12px;
}

textarea{
    min-height:250px;
}

</style>

</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

<div id="topbar-container"></div>

<div class="container-fluid p-4">

<div
class="d-flex justify-content-between align-items-center mb-4">

<div>

<h3>
Import RUP
</h3>

<small class="text-muted">
Import data paket dari SIRUP
</small>

</div>

<a
href="dashboard.html"
class="btn btn-secondary">

Dashboard

</a>

</div>

<div class="card mb-4">

<div class="card-header">

Paste Detail RUP

</div>

<div class="card-body">

<div class="mb-3">

<label class="form-label">

Kode RUP

</label>

<input
id="rupNumber"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Nama OPD SIRUP

</label>

<input
id="opdName"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Nama Paket

</label>

<input
id="packageName"
class="form-control">

</div>

<div class="row">

<div class="col-md-4">

<label class="form-label">

Tahun

</label>

<input
id="fiscalYear"
type="number"
class="form-control">

</div>

<div class="col-md-4">

<label class="form-label">

Pagu

</label>

<input
id="budgetCeiling"
type="number"
class="form-control">

</div>

<div class="col-md-4">

<label class="form-label">

Metode

</label>

<input
id="procurementMethod"
class="form-control">

</div>

</div>

<div class="mt-3">

<label class="form-label">

Source URL

</label>

<input
id="sourceUrl"
class="form-control">

</div>

<div class="mt-4">

<button
id="saveBtn"
class="btn btn-primary">

Simpan RUP

</button>

</div>

</div>

</div>

<div class="card">

<div class="card-header">

Daftar Import RUP

</div>

<div class="card-body">

<table
class="table table-bordered">

<thead>

<tr>

<th>Kode RUP</th>
<th>OPD</th>
<th>Nama Paket</th>
<th>Pagu</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="rupTable">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const rupDb =
    window.supabaseClient;

let profile =
    null;

async function init(){

    await loadLayout();

    profile =
        await getProfile();

    if(!profile){
        return;
    }

    document
        .getElementById(
            'saveBtn'
        )
        .onclick =
        saveRup;

    await loadRupImports();
}

async function loadRupImports(){

    const {
        data,
        error
    } =
    await rupDb
    .from('rup_imports')
    .select('*')
    .order(
        'created_at',
        {
            ascending:false
        }
    );

    if(error){

        console.error(error);

        return;
    }

    let html='';

    (data || [])
    .forEach(row=>{

        html += `

        <tr>

            <td>
                ${row.rup_number || '-'}
            </td>

            <td>
                ${row.opd_name || '-'}
            </td>

            <td>
                ${row.package_name || '-'}
            </td>

            <td>
                Rp ${Number(
                    row.budget_ceiling || 0
                ).toLocaleString('id-ID')}
            </td>

            <td>

                <button
                class="btn btn-success btn-sm"
                onclick="importToPackage(
                    '${row.id}'
                )">

                Import

                </button>

            </td>

        </tr>

        `;
    });

    if(html === ''){

        html = `

        <tr>

            <td colspan="5">

                Belum ada data RUP

            </td>

        </tr>

        `;
    }

    document
        .getElementById(
            'rupTable'
        )
        .innerHTML =
        html;
}

async function saveRup(){

    const rupNumber =
        document
        .getElementById(
            'rupNumber'
        )
        .value
        .trim();

    const opdName =
        document
        .getElementById(
            'opdName'
        )
        .value
        .trim();

    const packageName =
        document
        .getElementById(
            'packageName'
        )
        .value
        .trim();

    const fiscalYear =
        document
        .getElementById(
            'fiscalYear'
        )
        .value;

    const budgetCeiling =
        document
        .getElementById(
            'budgetCeiling'
        )
        .value;

    const procurementMethod =
        document
        .getElementById(
            'procurementMethod'
        )
        .value
        .trim();

    const sourceUrl =
        document
        .getElementById(
            'sourceUrl'
        )
        .value
        .trim();

    if(
        !rupNumber ||
        !packageName
    ){

        alert(
            'Kode RUP dan Nama Paket wajib diisi'
        );

        return;
    }

    const {
        error
    } =
    await rupDb
    .from('rup_imports')
    .insert({

        tenant_id:
            profile.tenant_id,

        opd_name:
            opdName,

        rup_number:
            rupNumber,

        package_name:
            packageName,

        fiscal_year:
            fiscalYear,

        budget_ceiling:
            budgetCeiling,

        procurement_method:
            procurementMethod,

        source_url:
            sourceUrl,

        imported_by:
            profile.id

    });

    if(error){

        alert(
            error.message
        );

        return;
    }

    await writeAuditLog(

        'RUP_IMPORT',

        'CREATE',

        null,

        `Import RUP ${rupNumber}`

    );

    clearForm();

    await loadRupImports();

    alert(
        'RUP berhasil disimpan'
    );
}

async function importToPackage(
    rupId
){

    const {
        data: rup,
        error
    } =
    await rupDb
    .from('rup_imports')
    .select('*')
    .eq(
        'id',
        rupId
    )
    .single();

    if(error){

        alert(
            error.message
        );

        return;
    }

    const {
        data: opd
    } =
    await rupDb
    .from('opds')
    .select('*')
    .eq(
        'sirup_name',
        rup.opd_name
    )
    .single();

    if(!opd){

        alert(
            'Mapping OPD tidak ditemukan'
        );

        return;
    }

    const {
        error: packageError
    } =
    await rupDb
    .from('packages')
    .insert({

        tenant_id:
            profile.tenant_id,

        opd_id:
            opd.id,

        package_name:
            rup.package_name,

        fiscal_year:
            rup.fiscal_year,

        procurement_method:
            rup.procurement_method,

        budget_ceiling:
            rup.budget_ceiling,

        rup_number:
            rup.rup_number,

        package_status:
            'DRAFT',

        created_by:
            profile.id

    });

    if(packageError){

        alert(
            packageError.message
        );

        return;
    }

    await writeAuditLog(

        'RUP_IMPORT',

        'IMPORT_PACKAGE',

        rup.id,

        `Import RUP ${rup.rup_number} ke Packages`

    );

    alert(
        'Berhasil import ke Packages'
    );
}

function clearForm(){

    document
        .getElementById(
            'rupNumber'
        )
        .value='';

    document
        .getElementById(
            'opdName'
        )
        .value='';

    document
        .getElementById(
            'packageName'
        )
        .value='';

    document
        .getElementById(
            'fiscalYear'
        )
        .value='';

    document
        .getElementById(
            'budgetCeiling'
        )
        .value='';

    document
        .getElementById(
            'procurementMethod'
        )
        .value='';

    document
        .getElementById(
            'sourceUrl'
        )
        .value='';
}

init();

</script>

</body>
</html>
