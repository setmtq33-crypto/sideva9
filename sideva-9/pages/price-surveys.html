<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

<link rel="stylesheet" href="../css/app.css">

</head>
 
<style>
body{background:#f5f6fa}
.item-active{background:#0d6efd;color:white}
.pointer{cursor:pointer}
.card{border:none}
</style>
</head>
<body>

<div class="container-fluid p-4">

<div class="d-flex justify-content-between align-items-center mb-3">
<div>
<h3>Survey Harga</h3>
<div id="packageName">Loading...</div>
</div>

<div>
<a href="packages.html" class="btn btn-secondary">
<i class="bi bi-arrow-left"></i> Kembali
</a>
</div>
</div>

<div class="row">

<div class="col-md-3">

<div class="card">
<div class="card-header">
<b>Item Paket</b>
</div>

<div class="list-group list-group-flush" id="itemList"></div>

</div>

</div>

<div class="col-md-9">

<div class="row mb-3">

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Jumlah Survey</small>
<h5 id="surveyCount">0</h5>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Rata Survey</small>
<h5 id="avgSurvey">Rp0</h5>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Rata Negosiasi</small>
<h5 id="avgNegotiated">Rp0</h5>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Harga Terendah</small>
<h5 id="lowestPrice">Rp0</h5>
</div>
</div>
</div>

</div>

<div class="card">

<div class="card-header d-flex justify-content-between">

<b id="selectedItemName">Pilih Item</b>

<button class="btn btn-primary btn-sm" onclick="openAddModal()">
Tambah Survey
</button>

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered">

<thead>
<tr>
<th>Vendor</th>
<th>Brand</th>
<th>Survey</th>
<th>Negosiasi</th>
<th>Kandidat</th>
<th>Pemenang</th>
<th>Tanggal</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="surveyTable"></tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<div class="modal fade" id="surveyModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5>Survey Harga</h5>
</div>

<div class="modal-body">

<input type="hidden" id="surveyId">

<div class="mb-2">
<label>Vendor</label>
<input id="vendorName" class="form-control">
</div>

<div class="mb-2">
<label>Brand</label>
<input id="brand" class="form-control">
</div>

<div class="mb-2">
<label>Survey Price</label>
<input id="surveyPrice" type="number" class="form-control">
</div>

<div class="mb-2">
<label>Negotiated Price</label>
<input id="negotiatedPrice" type="number" class="form-control">
</div>

<div class="mb-2">
<label>Source URL</label>
<input id="sourceUrl" class="form-control">
</div>

<div class="mb-2">
<label>Tanggal Survey</label>
<input id="surveyDate" type="date" class="form-control">
</div>

<div class="form-check">
<input id="isCandidate" class="form-check-input" type="checkbox">
<label class="form-check-label">Kandidat</label>
</div>

<div class="form-check">
<input id="isWinner" class="form-check-input" type="checkbox">
<label class="form-check-label">Pemenang</label>
</div>

<div class="mt-2">
<textarea id="notes" class="form-control" placeholder="Catatan"></textarea>
</div>

</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
<button class="btn btn-primary" onclick="saveSurvey()">Simpan</button>
</div>

</div>

</div>

</div>

<script>

const supabase = window.supabaseClient;

let profile=null;
let packageId=null;
let selectedItemId=null;
let items=[];
let surveys=[];

const modal = new bootstrap.Modal(document.getElementById('surveyModal'));

function rupiah(v){
 return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v||0);
}

async function init(){

 profile = await getProfile();

 packageId = new URLSearchParams(location.search).get('id');

 await loadPackage();
 await loadItems();
}

async function loadPackage(){

 const {data} = await supabase
 .from('packages')
 .select('*')
 .eq('id',packageId)
 .single();

 if(data){
   document.getElementById('packageName').innerText=data.package_name;
 }
}

async function loadItems(){

 const {data} = await supabase
 .from('package_items')
 .select('*')
 .eq('package_id',packageId)
 .order('item_name');

 items=data||[];

 renderItems();
}

function renderItems(){

 let html='';

 items.forEach(item=>{

   html += `
   <button
   class="list-group-item list-group-item-action"
   onclick="selectItem('${item.id}')">
   ${item.item_name}
   </button>`;

 });

 document.getElementById('itemList').innerHTML=html;

 if(items.length){
   selectItem(items[0].id);
 }
}

async function selectItem(id){

 selectedItemId=id;

 const item = items.find(x=>x.id===id);

 document.getElementById('selectedItemName').innerText=item.item_name;

 const {data} = await supabase
 .from('price_surveys')
 .select('*')
 .eq('package_item_id',id)
 .order('survey_date',{ascending:false});

 surveys=data||[];

 renderSurvey();
}

function renderSurvey(){

 let html='';

 let surveyTotal=0;
 let negoTotal=0;
 let lowest=0;

 surveys.forEach((s,index)=>{

   surveyTotal += Number(s.survey_price||0);
   negoTotal += Number(s.negotiated_price||0);

   if(index===0) lowest=Number(s.survey_price||0);

   if(Number(s.survey_price||0)<lowest){
      lowest=Number(s.survey_price||0);
   }

   html += `
   <tr>
   <td>${s.vendor_name||''}</td>
   <td>${s.brand||''}</td>
   <td>${rupiah(s.survey_price)}</td>
   <td>${rupiah(s.negotiated_price)}</td>
   <td>${s.is_candidate ? '✔' : ''}</td>
   <td>${s.is_winner ? '✔' : ''}</td>
   <td>${s.survey_date||''}</td>
   <td>
     <button class="btn btn-warning btn-sm" onclick="editSurvey('${s.id}')">Edit</button>
     <button class="btn btn-danger btn-sm" onclick="deleteSurvey('${s.id}')">Hapus</button>
   </td>
   </tr>`;
 });

 document.getElementById('surveyTable').innerHTML=html;

 const count=surveys.length;

 document.getElementById('surveyCount').innerText=count;
 document.getElementById('avgSurvey').innerText=rupiah(count?surveyTotal/count:0);
 document.getElementById('avgNegotiated').innerText=rupiah(count?negoTotal/count:0);
 document.getElementById('lowestPrice').innerText=rupiah(lowest);
}

function openAddModal(){

 surveyId.value='';
 vendorName.value='';
 brand.value='';
 surveyPrice.value='';
 negotiatedPrice.value='';
 sourceUrl.value='';
 notes.value='';

 modal.show();
}

function editSurvey(id){

 const s = surveys.find(x=>x.id===id);

 if(!s) return;

 surveyId.value=s.id;
 vendorName.value=s.vendor_name||'';
 brand.value=s.brand||'';
 surveyPrice.value=s.survey_price||0;
 negotiatedPrice.value=s.negotiated_price||0;
 sourceUrl.value=s.source_url||'';
 surveyDate.value=s.survey_date||'';
 notes.value=s.notes||'';

 isCandidate.checked=s.is_candidate;
 isWinner.checked=s.is_winner;

 modal.show();
}

async function saveSurvey(){

 const payload={
  tenant_id:profile.tenant_id,
  opd_id:profile.opd_id,
  package_item_id:selectedItemId,
  vendor_name:vendorName.value,
  brand:brand.value,
  survey_price:Number(surveyPrice.value||0),
  negotiated_price:Number(negotiatedPrice.value||0),
  source_url:sourceUrl.value,
  survey_date:surveyDate.value,
  notes:notes.value,
  is_candidate:isCandidate.checked,
  is_winner:isWinner.checked
 };

 let result;

 if(surveyId.value){

   result=await supabase
   .schema('business')
   .from('price_surveys')
   .update(payload)
   .eq('id',surveyId.value);

 }else{

   result=await supabase
   .schema('business')
   .from('price_surveys')
   .insert(payload);
 }

 if(result.error){
   return Swal.fire('Error',result.error.message,'error');
 }

 modal.hide();

 await selectItem(selectedItemId);
}

async function deleteSurvey(id){

 const ok = await Swal.fire({
   title:'Hapus data?',
   showCancelButton:true
 });

 if(!ok.isConfirmed) return;

 const {error}=await supabase
 .schema('business')
 .from('price_surveys')
 .delete()
 .eq('id',id);

 if(error){
   return Swal.fire('Error',error.message,'error');
 }

 await selectItem(selectedItemId);
}

init();

</script>

</body>
</html>
