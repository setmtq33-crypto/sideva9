<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIDEVA v9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/workflow.js"></script>

<link rel="stylesheet" href="../css/app.css">

<style>
body{background:#f5f6fa}
.item-active{background:#0d6efd;color:white}
.pointer{cursor:pointer}
.card{border:none}

@media (max-width:768px){

.container,
.container-fluid{
    padding-left:10px !important;
    padding-right:10px !important;
}

.card,
.card-body{
    padding:12px !important;
}

.form-control,
.form-select{
    font-size:16px !important;
}

.btn{
    width:100%;
    margin-bottom:6px;
}

.btn-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.table{
    font-size:.85rem;
}

h1,h2,h3,h4,h5{
    word-break:break-word;
}

}

.survey-grid{
    display:grid;
    grid-template-columns:
    repeat(
        auto-fill,
        minmax(380px,1fr)
    );
    gap:18px;
}

.survey-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:20px;
    padding:20px;
    box-shadow:
    0 8px 24px rgba(0,0,0,.05);
}

.winner-card{
    border:2px solid #22c55e;
    box-shadow:
    0 10px 25px rgba(34,197,94,.15);
}

.survey-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.vendor-name{
    font-weight:700;
    font-size:1.05rem;
    color:#111827;
}

.brand-name{
    color:#64748b;
    font-size:.85rem;
}

.price-box{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.price-value{
    font-size:1.2rem;
    font-weight:800;
    color:#2563eb;
}

.winner-badge{
    background:#dcfce7;
    color:#166534;
    border-radius:999px;
    padding:6px 12px;
    font-size:.75rem;
    font-weight:700;
}

.candidate-badge{
    background:#fef3c7;
    color:#92400e;
    border-radius:999px;
    padding:6px 12px;
    font-size:.75rem;
    font-weight:700;
}

.survey-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}
    


</style>
</head>
<body>

<div class="container-fluid p-4">

<div class="d-flex justify-content-between align-items-center mb-3">
<div>
<h3>Survey Harga</h3>
<div id="packageName">Loading...</div>
</div>

<div>
<a href="packages.html" class="btn btn-secondary">
<i class="bi bi-arrow-left"></i> Kembali
</a>
</div>
</div>

<div class="row">

<div class="col-md-3">

<div class="card">
<div class="card-header">
<b>Item Paket</b>
</div>

<div class="list-group list-group-flush" id="itemList"></div>

</div>

</div>

<div class="col-md-9">

<div class="row mb-3">

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Jumlah Survey</small>
<h5 id="surveyCount">0</h5>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Rata Survey</small>
<h5 id="avgSurvey">Rp0</h5>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Rata Negosiasi</small>
<h5 id="avgNegotiated">Rp0</h5>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card">
<div class="card-body">
<small>Harga Terendah</small>
<h5 id="lowestPrice">Rp0</h5>
</div>
</div>
</div>

</div>

<div class="card">

<div class="card-header d-flex justify-content-between">

<b id="selectedItemName">Pilih Item</b>

<button class="btn btn-primary btn-sm" onclick="openAddModal()">
Tambah Survey
</button>

</div>

<div class="card-body">

<div
    id="surveyTable"
    class="survey-grid">
</div>

</div>

</div>

</div>

</div>

</div>

<div class="modal fade" id="surveyModal">

<div class="modal-dialog modal-dialog-scrollable">

<div class="modal-content">

<div class="modal-header">
<h5>Survey Harga</h5>
</div>

<div class="modal-body">

<input type="hidden" id="surveyId">

<div class="mb-2">
<label>URL E-Katalog</label>

<div class="input-group">

<input
    id="catalogUrl"
    class="form-control"
    placeholder="https://katalog.inaproc.id/...">

<button
    type="button"
    class="btn btn-success"
    onclick="fetchCatalogData()">
    Ambil Data
</button>

</div>
</div>
 
<div class="mb-2">
<label>Vendor</label>
<input id="vendorName" class="form-control">
</div>

<div class="mb-2">
<label>Brand</label>
<input id="brand" class="form-control">
</div>

<div class="mb-2">
<label>Survey Price</label>
<input id="surveyPrice" type="number" class="form-control">
</div>

<div class="mb-2">
<label>Negotiated Price</label>
<input id="negotiatedPrice" type="number" class="form-control">
</div>

<div class="mb-2">
<label>Source URL</label>
<input id="sourceUrl" class="form-control">
</div>

<div class="mb-2">
<label>Tanggal Survey</label>
<input id="surveyDate" type="date" class="form-control">
</div>

<div class="form-check">
<input id="isCandidate" class="form-check-input" type="checkbox">
<label class="form-check-label">Kandidat</label>
</div>

<div class="form-check">
<input id="isWinner" class="form-check-input" type="checkbox">
<label class="form-check-label">Pemenang</label>
</div>

<div class="mt-2">
<textarea id="notes" class="form-control" placeholder="Catatan"></textarea>
</div>

</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
<button
    class="btn btn-primary"
    onclick="saveSurvey();">
    Simpan
</button>
</div>

</div>

</div>

</div>

<script>

const surveyDb = window.supabaseClient;

let profile = null;
let packageId = null;
let selectedItemId = null;
let currentSurveyId = null;

let items = [];
let surveys = [];

const modal = new bootstrap.Modal(document.getElementById('surveyModal'));

function rupiah(v){
 return new Intl.NumberFormat(
 'id-ID',
 {
  style:'currency',
  currency:'IDR',
  maximumFractionDigits:0
 }).format(v||0);
}

async function init(){
 profile = await getProfile();
 packageId = new URLSearchParams(location.search).get('id');

 await loadPackage();
 await loadItems();
}

async function loadPackage(){
 const {data,error} = await surveyDb
 .from('packages')
 .select('id,package_name')
 .eq('id',packageId)
 
 .single();

 if(error){
   console.error(error);
   return;
 }

 packageName.innerText = data.package_name;
}

async function loadItems(){
 const {data,error} = await surveyDb
 .from('package_items')
 .select('*')
 .eq('package_id',packageId)
 .order('item_name');

 if(error){
   console.error(error);
   return;
 }

 items = data || [];
 renderItems();
}

function renderItems(){

    let html = '';

    items.forEach(item=>{

        html += `

        <div
            class="item-selector-card
            ${selectedItemId === item.id ? 'active' : ''}"
            onclick="selectItem('${item.id}')">

            <div class="item-selector-title">
                📦 ${item.item_name}
            </div>

            <div class="item-selector-meta">
                ${item.quantity || 0}
                ${item.unit || ''}
            </div>

        </div>

        `;

    });

    itemList.innerHTML = html;

    if(
        items.length &&
        !selectedItemId
    ){
        selectItem(
            items[0].id
        );
    }
}

async function selectItem(id){
    selectedItemId = id;
    renderItems();
    console.log('SELECT ITEM DIPANGGIL', id);

    const item = items.find(x => x.id === id);
    if(item){
        document.getElementById('selectedItemName').innerText = item.item_name;
    }

    const { data, error } = await surveyDb
        .from('price_surveys')
        .select('*')
        .eq('package_item_id', id)
       
        .order('survey_date', { ascending:false });

    if(error){
        alert(error.message);
        return;
    }

    surveys = data || [];
    renderSurvey();
}

function renderSurvey(){

    let html = '';

    let surveyTotal = 0;
    let negoTotal = 0;

    let lowest =
        surveys.length
        ? Number(
            surveys[0].survey_price || 0
          )
        : 0;

    surveys.forEach(s=>{

        surveyTotal +=
            Number(
                s.survey_price || 0
            );

        negoTotal +=
            Number(
                s.negotiated_price || 0
            );

        if(
            Number(
                s.survey_price || 0
            ) < lowest
        ){
            lowest =
            Number(
                s.survey_price || 0
            );
        }

        const isWinner =
            s.is_winner === true;
        
        html += `
        
        <div class="survey-card ${isWinner ? 'winner-card' : ''}">

            <div class="survey-top">

                <div>

                    <div class="vendor-name">
                        🏪 ${s.vendor_name || '-'}
                    </div>

                    <div class="brand-name">
                        ${s.brand || '-'}
                    </div>

                </div>

                ${
                    s.is_winner
                    ? `
                    <span class="winner-badge">
                        ⭐ Pemenang
                    </span>
                    `
                    : s.is_candidate
                    ? `
                    <span class="candidate-badge">
                        Kandidat
                    </span>
                    `
                    : ''
                }

            </div>

            <div class="price-box">

                <div>

                    <small class="text-muted">
                        Survey
                    </small>

                    <div class="price-value">
                        ${rupiah(
                            s.survey_price
                        )}
                    </div>

                </div>

                <div>

                    <small class="text-muted">
                        Negosiasi
                    </small>

                    <div class="fw-bold">
                        ${rupiah(
                            s.negotiated_price
                        )}
                    </div>

                </div>

            </div>

            <div class="mt-3 text-muted small">
                📅 ${s.survey_date || '-'}
            </div>

            <div class="survey-actions">

                <button
                    class="btn btn-warning btn-sm"
                    onclick="editSurvey('${s.id}')">

                    Edit

                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="deleteSurvey('${s.id}')">

                    Hapus

                </button>

            </div>

        </div>

        `;
    });

    document.getElementById(
        'surveyTable'
    ).innerHTML = html;

    const count =
        surveys.length;

    document.getElementById(
        'surveyCount'
    ).innerText = count;

    document.getElementById(
        'avgSurvey'
    ).innerText =
    rupiah(
        count
        ? surveyTotal / count
        : 0
    );

    document.getElementById(
        'avgNegotiated'
    ).innerText =
    rupiah(
        count
        ? negoTotal / count
        : 0
    );

    document.getElementById(
        'lowestPrice'
    ).innerText =
    rupiah(lowest);
}

function openAddModal(){
 currentSurveyId = null;
 surveyId.value='';
 vendorName.value='';
 brand.value='';
 surveyPrice.value='';
 negotiatedPrice.value='';
 sourceUrl.value='';
 notes.value='';

 surveyDate.value = new Date().toISOString().split('T')[0];

 isCandidate.checked=false;
 isWinner.checked=false;

 modal.show();
}

async function editSurvey(id){
 const {data,error} = await surveyDb
 .from('price_surveys')
 .select('*')
 .eq('id',id)
 
 .single();

 if(error){
  console.error(error);
  return;
 }

 currentSurveyId = id;
 surveyId.value=id;
 
 selectedItemId = data.package_item_id; 

 vendorName.value = data.vendor_name || '';
 brand.value = data.brand || '';
 surveyPrice.value = data.survey_price || 0;
 negotiatedPrice.value = data.negotiated_price || 0;
 sourceUrl.value = data.source_url || '';
 surveyDate.value = data.survey_date || '';
 notes.value = data.notes || '';
 isCandidate.checked = data.is_candidate;
 isWinner.checked = data.is_winner;

 modal.show();
}

async function saveSurvey(){

    const payload = {
        vendor_name: vendorName.value,
        brand: brand.value,
        survey_price: Number(
            surveyPrice.value || 0
        ),
        negotiated_price: Number(
            negotiatedPrice.value || 0
        ),
        source_url: sourceUrl.value,
        survey_date: surveyDate.value,
        notes: notes.value,
        is_candidate: isCandidate.checked,
        is_winner: isWinner.checked
    };

    let result;

    if(currentSurveyId){

        result = await surveyDb
            .from('price_surveys')
            .update(payload)
            .eq(
                'id',
                currentSurveyId
            );

    }else{

        result = await surveyDb
            .from('price_surveys')
            .insert({
                ...payload,
                tenant_id:
                    profile.tenant_id,
                opd_id:
                    profile.opd_id,
                package_item_id:
                    selectedItemId
            });
    }

    if(result.error){

        alert(
            result.error.message
        );

        return;
    }

    modal.hide();

    await selectItem(
        selectedItemId
    );

    alert(
        currentSurveyId
        ? 'Survey berhasil diperbarui'
        : 'Survey berhasil disimpan'
    );
}

async function deleteSurvey(id){
 if(!confirm('Hapus survey ini?')){
  return;
 }

 const {error} = await surveyDb
 .from('price_surveys')
 .delete()
 .eq('id',id);

 if(error){
  console.error(error);
  alert(error.message);
  return;
 }

 await selectItem(selectedItemId);
}

// FUNGSI UTAMA YANG MENGGUNAKAN CLOUDFLARE WORKERS
async function fetchCatalogData(){
    const url = catalogUrl.value.trim();

    if(!url){
        alert('Masukkan URL E-Katalog terlebih dahulu');
        return;
    }

    // Ubah status tombol menjadi Loading sejenak agar terlihat responsif
    const btn = document.querySelector("button[onclick='fetchCatalogData()']");
    const originalText = btn.innerText;
    btn.innerText = "Mengurai URL...";
    btn.disabled = true;

    try {
        // 1. Ambil slug produk (elemen terakhir dari URL)
        // Contoh: "https://katalog.inaproc.id/cv-muria-setia/kertas-hvs-f4" -> "kertas-hvs-f4"
        const urlObj = new URL(url);
        const pathSegments = urlObj.pathname.split('/').filter(p => p.length > 0);
        
        if (pathSegments.length < 1) {
            throw new Error('Struktur URL E-Katalog tidak dikenali');
        }

        const slug = pathSegments[pathSegments.length - 1];
        const cleanBrand = slug.replaceAll('-', ' ').toUpperCase();

        // 2. Deteksi Nama Vendor secara cerdas dari Path URL
        // Biasanya struktur URL E-Katalog: /id/produk/nama-vendor/nama-produk atau /nama-vendor/nama-produk
        let detectedVendor = 'PENYEDIA E-KATALOG';
        
        if (pathSegments.length >= 2) {
            // Mengambil segment tepat sebelum nama produk sebagai nama vendor
            const vendorSegment = pathSegments[pathSegments.length - 2];
            if (vendorSegment !== 'product' && vendorSegment !== 'produk') {
                detectedVendor = vendorSegment.replaceAll('-', ' ').toUpperCase();
            }
        }

        // 3. Masukkan data hasil urai otomatis ke dalam Form Modal
        vendorName.value = detectedVendor;
        brand.value = cleanBrand;
        sourceUrl.value = url;
        
        // Berikan nilai default Rp0 agar User terbiasa mengetikkan harga asli dari tab sebelah
        surveyPrice.value = 0;
        negotiatedPrice.value = 0;

        alert('Berhasil mengurai data lokal! Proteksi E-Katalog ketat, silakan input manual harga aslinya.');

        // Fokuskan kursor langsung ke input harga agar user tinggal mengetik
        setTimeout(() => { surveyPrice.focus(); }, 300);

    } catch (error) {
        console.error('Error parsing catalog:', error);
        alert('Gagal membaca URL. Pastikan format URL utuh dan benar.');
    } finally {
        // Kembalikan status tombol ke semula
        btn.innerText = originalText;
        btn.disabled = false;
    }
}

window.openAddModal = openAddModal;
window.editSurvey = editSurvey;
window.deleteSurvey = deleteSurvey;
window.saveSurvey = saveSurvey;
window.selectItem = selectItem;
window.fetchCatalogData = fetchCatalogData;

init();

</script>

</body>
</html>
