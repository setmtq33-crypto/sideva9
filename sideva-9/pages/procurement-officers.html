<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pejabat Pengadaan - SIDEVA9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
</head>
<body class="bg-light">

<div id="sidebar-container"></div>
<div class="main-content" style="margin-left: 256px;">
    <div id="topbar-container"></div>

    <div class="container py-4">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h4 class="mb-4"><i class="bi bi-person-gear"></i> Master Pejabat Pengadaan</h4>
                <div class="row g-3">
                    <div class="col-md-3"><input id="fullName" class="form-control" placeholder="Nama Lengkap"></div>
                    <div class="col-md-2"><input id="nip" class="form-control" placeholder="NIP"></div>
                    <div class="col-md-3"><input id="position" class="form-control" placeholder="Jabatan"></div>
                    <div class="col-md-2" id="opdContainer" style="display:none;">
                        <select id="opdSelect" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <button onclick="saveOfficer()" class="btn btn-primary w-100">Simpan</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Nama</th>
                            <th>NIP</th>
                            <th>Jabatan</th>
                            <th class="text-end pe-3" style="width: 150px;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="officerList"><tr><td colspan="4" class="text-center">Memuat...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Edit -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Pejabat Pengadaan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="editFullName" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">NIP</label>
                    <input type="text" id="editNip" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Jabatan</label>
                    <input type="text" id="editPosition" class="form-control">
                </div>
                <div class="mb-3" id="editOpdContainer" style="display:none;">
                    <label class="form-label">OPD</label>
                    <select id="editOpdSelect" class="form-select"></select>
                </div>
            </div>
            <div class="modal-header gap-2 justify-content-end border-top-0 pt-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="button" onclick="updateOfficer()" class="btn btn-success">Simpan Perubahan</button>
            </div>
        </div>
    </div>
</div>

<script>
let profile = null;
let editModalBs = null;

async function init() {
    await loadLayout();
    profile = await getProfile();
    if (!profile) return;
    
    editModalBs = new bootstrap.Modal(document.getElementById('editModal'));

    if (profile.role === 'SUPER_ADMIN') {
        document.getElementById('opdContainer').style.display = 'block';
        document.getElementById('editOpdContainer').style.display = 'block';
        const { data } = await supabaseClient.from('opds').select('id, name');
        
        const select = document.getElementById('opdSelect');
        const editSelect = document.getElementById('editOpdSelect');
        data?.forEach(o => {
            select.innerHTML += `<option value="${o.id}">${o.name}</option>`;
            editSelect.innerHTML += `<option value="${o.id}">${o.name}</option>`;
        });
    }
    await loadOfficers();
}

async function saveOfficer() {
    const full_name = document.getElementById("fullName").value.trim();
    const nip = document.getElementById("nip").value.trim();
    const position = document.getElementById("position").value.trim();
    const opd_id = profile.role === 'SUPER_ADMIN' ? document.getElementById("opdSelect").value : profile.opd_id;

    if (!full_name || !nip || !position) return alert("Semua kolom wajib diisi!");

    const { error } = await supabaseClient.from("procurement_officers").insert([{
        tenant_id: profile.tenant_id,
        opd_id, full_name, nip, position
    }]);

    if (error) return alert("Error: " + error.message);
    alert("Berhasil disimpan!");
    document.querySelectorAll('.card-body input').forEach(i => i.value = '');
    loadOfficers();
}

async function loadOfficers() {
    let query = supabaseClient.from("procurement_officers").select("*").order("full_name");
    if (profile.role !== 'SUPER_ADMIN') query = query.eq("opd_id", profile.opd_id);

    const { data } = await query;
    const tbody = document.getElementById("officerList");
    
    if(!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">Data kosong</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(i => `
        <tr>
            <td class="ps-3">${i.full_name}</td>
            <td>${i.nip}</td>
            <td>${i.position}</td>
            <td class="text-end pe-3">
                <button class="btn btn-sm btn-warning" onclick="openEditModal('${i.id}', '${i.full_name}', '${i.nip}', '${i.position}', '${i.opd_id}')"><i class="bi bi-pencil-square"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteOfficer('${i.id}')"><i class="bi bi-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

function openEditModal(id, name, nip, position, opd_id) {
    document.getElementById('editId').value = id;
    document.getElementById('editFullName').value = name;
    document.getElementById('editNip').value = nip;
    document.getElementById('editPosition').value = position;
    if (profile.role === 'SUPER_ADMIN') {
        document.getElementById('editOpdSelect').value = opd_id;
    }
    editModalBs.show();
}

async function updateOfficer() {
    const id = document.getElementById('editId').value;
    const full_name = document.getElementById('editFullName').value.trim();
    const nip = document.getElementById('editNip').value.trim();
    const position = document.getElementById('editPosition').value.trim();
    const opd_id = profile.role === 'SUPER_ADMIN' ? document.getElementById("editOpdSelect").value : profile.opd_id;

    if (!full_name || !nip || !position) return alert("Semua kolom wajib diisi!");

    const { error } = await supabaseClient.from("procurement_officers")
        .update({ full_name, nip, position, opd_id })
        .eq('id', id);

    if (error) return alert("Gagal mengupdate: " + error.message);
    alert("Data berhasil diubah!");
    editModalBs.hide();
    loadOfficers();
}

async function deleteOfficer(id) {
    if (!confirm("Apakah Anda yakin ingin menghapus data pejabat pengadaan ini?")) return;
    const { error } = await supabaseClient.from("procurement_officers").delete().eq('id', id);
    if (error) return alert("Gagal menghapus: " + error.message);
    alert("Data berhasil dihapus!");
    loadOfficers();
}

init();
</script>
</body>
</html>
