<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pejabat Pengadaan - SIDEVA9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
</head>
<body class="bg-light">

<div id="sidebar-container"></div>
<div class="main-content" style="margin-left: 256px;">
    <div id="topbar-container"></div>

    <div class="container py-4">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h4 class="mb-4"><i class="bi bi-person-gear"></i> Master Pejabat Pengadaan</h4>
                <div class="row g-3">
                    <div class="col-md-3"><input id="fullName" class="form-control" placeholder="Nama Lengkap"></div>
                    <div class="col-md-2"><input id="nip" class="form-control" placeholder="NIP"></div>
                    <div class="col-md-3"><input id="position" class="form-control" placeholder="Jabatan"></div>
                    <div class="col-md-2" id="opdContainer" style="display:none;">
                        <select id="opdSelect" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <button onclick="saveOfficer()" class="btn btn-primary w-100">Simpan</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr><th>Nama</th><th>NIP</th><th>Jabatan</th></tr>
                    </thead>
                    <tbody id="officerList"><tr><td colspan="3" class="text-center">Memuat...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let profile = null;

async function init() {
    await loadLayout();
    profile = await getProfile();
    
    if (!profile) return;
    
    // Jika Super Admin, munculkan pilihan OPD
    if (profile.role === 'SUPER_ADMIN') {
        document.getElementById('opdContainer').style.display = 'block';
        const { data } = await supabaseClient.from('opds').select('id, name');
        const select = document.getElementById('opdSelect');
        data?.forEach(o => select.innerHTML += `<option value="${o.id}">${o.name}</option>`);
    }
    await loadOfficers();
}

async function saveOfficer() {
    const full_name = document.getElementById("fullName").value.trim();
    const nip = document.getElementById("nip").value.trim();
    const position = document.getElementById("position").value.trim();
    const opd_id = profile.role === 'SUPER_ADMIN' ? document.getElementById("opdSelect").value : profile.opd_id;

    if (!full_name || !nip || !position) return alert("Semua kolom wajib diisi!");
    if (!opd_id) return alert("OPD tidak ditemukan!");

    const { error } = await supabaseClient.from("procurement_officers").insert([{
        tenant_id: profile.tenant_id,
        opd_id, full_name, nip, position
    }]);

    if (error) return alert("Error: " + error.message);
    alert("Berhasil disimpan!");
    document.querySelectorAll('input').forEach(i => i.value = '');
    loadOfficers();
}

async function loadOfficers() {
    let query = supabaseClient.from("procurement_officers").select("*").order("full_name");
    if (profile.role !== 'SUPER_ADMIN') query = query.eq("opd_id", profile.opd_id);

    const { data } = await query;
    const tbody = document.getElementById("officerList");
    tbody.innerHTML = data?.map(i => `<tr><td>${i.full_name}</td><td>${i.nip}</td><td>${i.position}</td></tr>`).join('') || '<tr><td colspan="3">Data kosong</td></tr>';
}

init();
</script>
</body>
</html>
