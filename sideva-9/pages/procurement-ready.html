<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>READY PROCUREMENT - SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

<style>
body{
    background:#f5f6fa;
}

.card{
    border:none;
    border-radius:12px;
}

.kpi{
    font-size:28px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3>READY PROCUREMENT</h3>
            <small class="text-muted">
                Paket siap diserahkan ke PBJ / SPSE
            </small>
        </div>

        <a href="dashboard.html"
           class="btn btn-secondary">
           Kembali
        </a>

    </div>

    <div class="row mb-4">

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small>Total Paket</small>
                    <div id="totalPackages" class="kpi">0</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small>Total Pagu</small>
                    <div id="totalBudget" class="kpi">Rp0</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small>Total HPS</small>
                    <div id="totalHps" class="kpi">Rp0</div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small>Total Efisiensi</small>
                    <div id="totalEfficiency" class="kpi">Rp0</div>
                </div>
            </div>
        </div>

    </div>

    <div class="card">

        <div class="card-header">
            <strong>Daftar Paket READY PROCUREMENT</strong>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead>
                        <tr>
                            <th>Nama Paket</th>
                            <th>Metode</th>
                            <th>Pagu</th>
                            <th>HPS</th>
                            <th>Efisiensi</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="packageTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

const db = window.supabaseClient;

function rupiah(v){

    return new Intl.NumberFormat(
        'id-ID',
        {
            style:'currency',
            currency:'IDR',
            maximumFractionDigits:0
        }
    ).format(v || 0);
}

async function loadSummary(){

    const { data, error } =
        await db
        .from('ready_procurement_summary')
        .select('*')
        .single();

    if(error){
        console.error(error);
        return;
    }

    document.getElementById('totalPackages').innerText =
        data.total_packages || 0;

    document.getElementById('totalBudget').innerText =
        rupiah(data.total_budget);

    document.getElementById('totalHps').innerText =
        rupiah(data.total_hps);

    document.getElementById('totalEfficiency').innerText =
        rupiah(data.total_efficiency);
}

async function loadPackages(){

    const { data, error } =
        await db
        .from('ready_procurement_packages')
        .select('*')
        .order('created_at',{ascending:false});

    if(error){
        console.error(error);
        return;
    }

    let html = '';

    (data || []).forEach(pkg => {

        html += `
        <tr>

            <td>${pkg.package_name}</td>

            <td>${pkg.procurement_method || '-'}</td>

            <td>${rupiah(pkg.budget_ceiling)}</td>

            <td>${rupiah(pkg.total_hps)}</td>

            <td>${rupiah(pkg.efficiency)}</td>

            <td>
                <span class="badge bg-success">
                    READY PROCUREMENT
                </span>
            </td>

            <td>

                <a
                    href="bahpe.html?id=${pkg.id}"
                    class="btn btn-primary btn-sm">
                    BAHPE
                </a>

            </td>

        </tr>
        `;
    });

    document.getElementById('packageTable').innerHTML =
        html;
}

async function init(){

    await loadSummary();
    await loadPackages();
}

init();

</script>

</body>
</html>
