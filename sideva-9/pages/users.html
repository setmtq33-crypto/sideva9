<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
User Management
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>
<script src="../js/permissions.js"></script>

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div
class="d-flex justify-content-between align-items-center mb-4">

<h3>

User Management

</h3>

<div>

<a
href="dashboard.html"
class="btn btn-secondary">

Dashboard

</a>

</div>

</div>

<div class="card">

<div class="card-body">

<div class="row mb-3">

<div class="col-md-4">

<select
id="opdFilter"
class="form-select">

<option value="">

Semua OPD

</option>

</select>

</div>

</div>

<table
class="table table-bordered">

<thead>

<tr>

<th>Nama</th>

<th>Email</th>

<th>Role</th>

<th>Aktif</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</div>

</div>

</div>

<script>

const usersDb =
    window.supabaseClient;

let currentProfile = null;

async function init(){

    currentProfile =
        await getProfile();

    if(
        currentProfile.role !==
        'SUPER_ADMIN'
        &&
        currentProfile.role !==
        'ADMIN_OPD'
    ){

        alert(
            'Akses ditolak'
        );

        location.href =
            'dashboard.html';

        return;
    }

    await loadOpds();

    await loadUsers();

    opdFilter.onchange =
        loadUsers;
}

async function loadOpds(){

    const {
        data
    } =
    await usersDb
    .from('opds')
    .select('*')
    .order('name');

    let html =
        '<option value="">Semua OPD</option>';

    data?.forEach(opd => {

        html += `
        <option
        value="${opd.id}">
        ${opd.name}
        </option>
        `;
    });

    opdFilter.innerHTML =
        html;
}

async function loadUsers(){

    let query =
        usersDb
        .from('profiles')
        .select('*')
        .order(
            'full_name'
        );

    if(
        currentProfile.role
        ===
        'ADMIN_OPD'
    ){

        query =
            query.eq(
                'opd_id',
                currentProfile.opd_id
            );
    }

    if(
        opdFilter.value
    ){

        query =
            query.eq(
                'opd_id',
                opdFilter.value
            );
    }

    const {
        data
    } =
    await query;

    let html = '';

    data?.forEach(user => {

        html += `

        <tr>

            <td>

                ${user.full_name}

            </td>

            <td>

                ${user.email}

            </td>

            <td>

                <select
                onchange="
                updateRole(
                    '${user.id}',
                    this.value
                )"
                class="form-select">

                    <option
                    ${user.role==='SUPER_ADMIN'?'selected':''}>
                    SUPER_ADMIN
                    </option>

                    <option
                    ${user.role==='ADMIN_OPD'?'selected':''}>
                    ADMIN_OPD
                    </option>

                    <option
                    ${user.role==='PPK'?'selected':''}>
                    PPK
                    </option>

                    <option
                    ${user.role==='PPTK'?'selected':''}>
                    PPTK
                    </option>

                    <option
                    ${user.role==='PBJ'?'selected':''}>
                    PBJ
                    </option>

                    <option
                    ${user.role==='VIEWER'?'selected':''}>
                    VIEWER
                    </option>

                </select>

            </td>

            <td>

                ${
                    user.is_active
                    ? 'Aktif'
                    : 'Nonaktif'
                }

            </td>

            <td>

                <button
                class="btn btn-sm btn-warning"
                onclick="
                toggleUser(
                    '${user.id}',
                    ${user.is_active}
                )">

                Toggle

                </button>

            </td>

        </tr>

        `;
    });

    userTable.innerHTML =
        html;
}

async function updateRole(
    userId,
    role
){

    await usersDb
    .from('profiles')
    .update({
        role
    })
    .eq(
        'id',
        userId
    );

    await writeAuditLog(

        'USER',

        'UPDATE_ROLE',

        userId,

        'Update role user'

    );

    alert(
        'Role berhasil diupdate'
    );
}

async function toggleUser(
    userId,
    currentStatus
){

    await usersDb
    .from('profiles')
    .update({

        is_active:
            !currentStatus

    })
    .eq(
        'id',
        userId
    );

    await writeAuditLog(

        'USER',

        'UPDATE_STATUS',

        userId,

        'Update status user'

    );

    await loadUsers();
}

init();

</script>

</body>
</html>
