<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
User Management
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>
<script src="../js/permissions.js"></script>

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div
class="d-flex justify-content-between align-items-center mb-4">

<h3>

User Management

</h3>

<div class="d-flex gap-2">

<button 
type="button" 
class="btn btn-primary" 
data-bs-toggle="modal" 
data-bs-target="#modalTambahUser">
Tambah User
</button>

<a
href="dashboard.html"
class="btn btn-secondary">

Dashboard

</a>

</div>

</div>

<div class="card">

<div class="card-body">

<div class="row mb-3">

<div class="col-md-4">

<select
id="opdFilter"
class="form-select">

<option value="">

Semua OPD

</option>

</select>

</div>

</div>

<table
class="table table-bordered">

<thead>

<tr>

<th>Nama</th>

<th>Email</th>

<th>Role</th>

<th>Aktif</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</div>

</div>

</div>

<div class="modal fade" id="modalTambahUser" tabindex="-1" aria-labelledby="modalTambahUserLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTambahUserLabel">Tambah User Baru</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form onsubmit="tambahUser(event)">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="addFullName" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" id="addFullName" required>
                    </div>
                    <div class="mb-3">
                        <label for="addEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="addEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="addRole" class="form-label">Role</label>
                        <select class="form-select" id="addRole" required>
                            <option value="">-- Pilih Role --</option>
                            <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                            <option value="ADMIN_OPD">ADMIN_OPD</option>
                            <option value="PPK">PPK</option>
                            <option value="PPTK">PPTK</option>
                            <option value="PBJ">PBJ</option>
                            <option value="VIEWER">VIEWER</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="addOpdId" class="form-label">Instansi / OPD</label>
                        <select class="form-select" id="addOpdId" required>
                            <option value="">-- Pilih OPD --</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan User</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>

const usersDb =
    window.supabaseClient;

let currentProfile = null;

async function init(){

    currentProfile =
        await getProfile();

    if(
        currentProfile.role !==
        'SUPER_ADMIN'
        &&
        currentProfile.role !==
        'ADMIN_OPD'
    ){

        alert(
            'Akses ditolak'
        );

        location.href =
            'dashboard.html';

        return;
    }

    await loadOpds();

    await loadUsers();

    opdFilter.onchange =
        loadUsers;
}

async function loadOpds(){

    const {
        data
    } =
    await usersDb
    .from('opds')
    .select('*')
    .order('name');

    let html =
        '<option value="">Semua OPD</option>';
        
    // Penambahan variabel htmlModal untuk mengisi pilihan instansi pada Form Tambah User
    let htmlModal = '<option value="">-- Pilih OPD --</option>';

    data?.forEach(opd => {

        html += `
        <option
        value="${opd.id}">
        ${opd.name}
        </option>
        `;
        
        htmlModal += `
        <option value="${opd.id}">
        ${opd.name}
        </option>
        `;
    });

    opdFilter.innerHTML =
        html;
        
    // Menaruh data instansi ke dalam dropdown form tambah user baru
    document.getElementById('addOpdId').innerHTML = htmlModal;
}

async function loadUsers(){

    let query =
        usersDb
        .from('profiles')
        .select('*')
        .order(
            'full_name'
        );

    if(
        currentProfile.role
        ===
        'ADMIN_OPD'
    ){

        query =
            query.eq(
                'opd_id',
                currentProfile.opd_id
            );
    }

    if(
        opdFilter.value
    ){

        query =
            query.eq(
                'opd_id',
                opdFilter.value
            );
    }

    const {
        data
    } =
    await query;

    let html = '';

    data?.forEach(user => {

        html += `

        <tr>

            <td>

                ${user.full_name}

            </td>

            <td>

                ${user.email}

            </td>

            <td>

                <select
                onchange="
                updateRole(
                    '${user.id}',
                    this.value
                )"
                class="form-select">

                    <option
                    ${user.role==='SUPER_ADMIN'?'selected':''}>
                    SUPER_ADMIN
                    </option>

                    <option
                    ${user.role==='ADMIN_OPD'?'selected':''}>
                    ADMIN_OPD
                    </option>

                    <option
                    ${user.role==='PPK'?'selected':''}>
                    PPK
                    </option>

                    <option
                    ${user.role==='PPTK'?'selected':''}>
                    PPTK
                    </option>

                    <option
                    ${user.role==='PBJ'?'selected':''}>
                    PBJ
                    </option>

                    <option
                    ${user.role==='VIEWER'?'selected':''}>
                    VIEWER
                    </option>

                </select>

            </td>

            <td>

                ${
                    user.is_active
                    ? 'Aktif'
                    : 'Nonaktif'
                }

            </td>

            <td>

                <button
                class="btn btn-sm btn-warning"
                onclick="
                toggleUser(
                    '${user.id}',
                    ${user.is_active}
                )">

                Toggle

                </button>

            </td>

        </tr>

        `;
    });

    userTable.innerHTML =
        html;
}

async function updateRole(
    userId,
    role
){

    await usersDb
    .from('profiles')
    .update({
        role
    })
    .eq(
        'id',
        userId
    );

    await writeAuditLog(

        'USER',

        'UPDATE_ROLE',

        userId,

        'Update role user'

    );

    alert(
        'Role berhasil diupdate'
    );
}

async function toggleUser(
    userId,
    currentStatus
){

    await usersDb
    .from('profiles')
    .update({

        is_active:
            !currentStatus

    })
    .eq(
        'id',
        userId
    );

    await writeAuditLog(

        'USER',

        'UPDATE_STATUS',

        userId,

        'Update status user'

    );

    await loadUsers();
}

// FUNGSI JAVASCRIPT UNTUK MENYIMPAN USER BARU KE SUPABASE (PENAMBAHAN BARU)
async function tambahUser(event) {
    event.preventDefault();

    const fullName = document.getElementById('addFullName').value;
    const email = document.getElementById('addEmail').value;
    const role = document.getElementById('addRole').value;
    const opdId = document.getElementById('addOpdId').value;

    try {
        const { data, error } = await usersDb
            .from('profiles')
            .insert([
                {
                    full_name: fullName,
                    email: email,
                    role: role,
                    opd_id: opdId,
                    is_active: true
                }
            ])
            .select();

        if (error) throw error;

        // Mencatat log audit penambahan user baru
        if (data && data.length > 0) {
            await writeAuditLog(
                'USER',
                'INSERT_USER',
                data[0].id,
                `Menambahkan user baru: ${fullName}`
            );
        }

        alert('User berhasil ditambahkan!');
        
        // Menutup modal pop-up dan membersihkan form inputan
        const modalEl = document.getElementById('modalTambahUser');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        modalInstance.hide();
        event.target.reset();

        // Menyegarkan/reload data tabel user
        await loadUsers();

    } catch (err) {
        alert('Gagal menambahkan user: ' + err.message);
    }
}

init();

</script>

</body>
</html>
