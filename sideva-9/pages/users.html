<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
User Management
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>
<script src="../js/permissions.js"></script>

<style>

body{
    background: #f0f2f5;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
}

/* Header Styling */
.page-header {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(30, 60, 114, 0.15);
    margin-bottom: 25px;
}

/* Card & Component Customization */
.card{
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
}

.card-header-custom {
    background: #fff;
    border-bottom: 1px solid #edf2f9;
    padding: 18px 24px;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
}

/* Table Enhancements */
.table {
    margin-bottom: 0;
}

.table thead th {
    background-color: #f8fafd;
    color: #4a5568;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 14px 16px;
    border-bottom: 2px solid #edf2f9;
}

.table tbody td {
    padding: 14px 16px;
    vertical-align: middle;
    color: #4a5568;
    font-size: 0.95rem;
    border-bottom: 1px solid #edf2f9;
}

.table tbody tr:hover {
    background-color: #fdfefe;
}

/* Form Controls */
.form-select, .form-control {
    border-radius: 8px;
    border: 1px solid #d8e2ef;
    padding: 10px 14px;
    font-size: 0.9rem;
    transition: all 0.2s ease;
}

.form-select:focus, .form-control:focus {
    border-color: #2a5298;
    box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
}

/* Buttons */
.btn {
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 500;
    font-size: 0.9rem;
    transition: all 0.2s;
}

.btn-sm {
    padding: 5px 12px;
    font-size: 0.8rem;
}

.btn-primary {
    background-color: #2a5298;
    border-color: #2a5298;
}

.btn-primary:hover {
    background-color: #1e3c72;
    border-color: #1e3c72;
}

/* Custom Badges */
.badge-status {
    padding: 6px 12px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.75rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.badge-active {
    background-color: #e6f7ed;
    color: #2e7d32;
}

.badge-inactive {
    background-color: #ffebee;
    color: #c62828;
}

/* Modal Customization */
.modal-content {
    border: none;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.modal-header {
    background-color: #f8fafd;
    border-bottom: 1px solid #edf2f9;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    padding: 18px 24px;
}

.modal-footer {
    border-top: 1px solid #edf2f9;
    padding: 16px 24px;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

    <div class="page-header d-flex justify-content-between align-items-center text-white">
        <div>
            <h3 class="mb-1 font-weight-bold"><i class="fa-solid stroke fa-users-gear me-2"></i>User Management</h3>
            <p class="mb-0 text-white-50 small">Kelola hak akses profil pengguna, integrasi OPD, serta status keaktifan akun system.</p>
        </div>
        <div class="d-flex gap-2">
            <button 
                type="button" 
                class="btn btn-light text-primary shadow-sm" 
                data-bs-toggle="modal" 
                data-bs-target="#modalTambahUser">
                <i class="fa-solid fa-user-plus me-1"></i> Tambah User
            </button>
            <a href="dashboard.html" class="btn btn-blur btn-outline-light">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-header-custom d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div class="d-flex align-items-center gap-2">
                <i class="fa-solid fa-filter text-muted"></i>
                <span class="text-muted small fw-bold text-uppercase">Filter Wilayah Kerja:</span>
            </div>
            <div style="min-width: 280px;">
                <select id="opdFilter" class="form-select shadow-sm">
                    <option value="">Semua OPD</option>
                </select>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th style="width: 25%;"><i class="fa-solid fa-user me-2"></i>Nama Lengkap</th>
                            <th style="width: 25%;"><i class="fa-solid fa-envelope me-2"></i>Email Sistem</th>
                            <th style="width: 25%;"><i class="fa-solid fa-shield-halved me-2"></i>Amanah Role / Jabatan</th>
                            <th style="width: 13%; text-align: center;"><i class="fa-solid fa-circle-check me-2"></i>Status</th>
                            <th style="width: 12%; text-align: center;"><i class="fa-solid fa-sliders me-2"></i>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<div class="modal fade" id="modalTambahUser" tabindex="-1" aria-labelledby="modalTambahUserLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title fw-bold text-dark" id="modalTambahUserLabel">
                    <i class="fa-solid fa-user-shield text-primary me-2"></i>
                    Registrasi User Baru
                </h5>
    
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>
            </div>
    
            <form onsubmit="tambahUser(event)">
    
                <div class="modal-body p-4">
    
                    <div class="mb-3">
                        <label for="addFullName" class="form-label fw-semibold">
                            Nama Lengkap
                        </label>
    
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fa-solid fa-id-card text-muted"></i>
                            </span>
    
                            <input
                                type="text"
                                class="form-control border-start-0 ps-1"
                                id="addFullName"
                                placeholder="Masukkan nama tanpa gelar"
                                required>
                        </div>
                    </div>
    
                    <div class="mb-3">
                        <label for="addEmail" class="form-label fw-semibold">
                            Alamat Email
                        </label>
    
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fa-solid fa-envelope text-muted"></i>
                            </span>
    
                            <input
                                type="email"
                                class="form-control border-start-0 ps-1"
                                id="addEmail"
                                placeholder="contoh: nama@domain.com"
                                required>
                        </div>
                    </div>
    
                    <div class="mb-3">
                        <label for="addPassword" class="form-label fw-semibold">
                            Password Awal
                        </label>
    
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fa-solid fa-key text-muted"></i>
                            </span>
    
                            <input
                                type="password"
                                class="form-control border-start-0 ps-1"
                                id="addPassword"
                                placeholder="Masukkan password awal"
                                required>
                        </div>
                    </div>
    
                    <div class="row">
    
                        <div class="col-md-6 mb-3">
                            <label for="addRole" class="form-label fw-semibold">
                                Hak Akses (Role)
                            </label>
    
                            <select
                                class="form-select"
                                id="addRole"
                                required>
    
                                <option value="">
                                    -- Pilih Role --
                                </option>
    
                                <option value="SUPER_ADMIN">
                                    SUPER_ADMIN
                                </option>
    
                                <option value="ADMIN_OPD">
                                    ADMIN_OPD
                                </option>
    
                                <option value="PPK">
                                    PPK
                                </option>
    
                                <option value="PPTK">
                                    PPTK
                                </option>
    
                                <option value="PBJ">
                                    PBJ
                                </option>
    
                                <option value="VIEWER">
                                    VIEWER
                                </option>
    
                            </select>
                        </div>
    
                        <div class="col-md-6 mb-3">
                            <label for="addOpdId" class="form-label fw-semibold">
                                Instansi Kedinasan
                            </label>
    
                            <select
                                class="form-select"
                                id="addOpdId"
                                required>
    
                                <option value="">
                                    -- Pilih OPD --
                                </option>
    
                            </select>
                        </div>
    
                    </div>
    
                </div>
    
                <div class="modal-footer bg-light">
    
                    <button
                        type="button"
                        class="btn btn-light border"
                        data-bs-dismiss="modal">
                        Batal
                    </button>
    
                    <button
                        type="submit"
                        class="btn btn-primary px-4">
    
                        <i class="fa-solid fa-floppy-disk me-1"></i>
                        Simpan User
    
                    </button>
    
                </div>
    
            </form>
    
        </div>
    </div>
</div>

<script>

const usersDb =
    window.supabaseClient;

let currentProfile = null;

async function init(){

    currentProfile =
        await getProfile();

    if(!currentProfile){
        return;
    }

    if(
        currentProfile.role !==
        'SUPER_ADMIN'
        &&
        currentProfile.role !==
        'ADMIN_OPD'
    ){

        alert(
            'Akses ditolak'
        );

        location.href =
            'dashboard.html';

        return;
    }

    await loadOpds();

    await loadUsers();

    opdFilter.onchange =
        loadUsers;
}

async function loadOpds(){

    const {
        data
    } =
    await usersDb
    .from('opds')
    .select('*')
    .order('name');

    let html =
        '<option value="">Semua OPD</option>';
        
    let htmlModal = '<option value="">-- Pilih OPD --</option>';

    data?.forEach(opd => {

        html += `
        <option
        value="${opd.id}">
        ${opd.name}
        </option>
        `;
        
        htmlModal += `
        <option value="${opd.id}">
        ${opd.name}
        </option>
        `;
    });

    opdFilter.innerHTML =
        html;
        
    document.getElementById('addOpdId').innerHTML = htmlModal;
}

async function loadUsers(){

    let query =
        usersDb
        .from('profiles')
        .select('*')
        .order(
            'full_name'
        );

    if(
        currentProfile.role
        ===
        'ADMIN_OPD'
    ){

        query =
            query.eq(
                'opd_id',
                currentProfile.opd_id
            );
    }

    if(
        opdFilter.value
    ){

        query =
            query.eq(
                'opd_id',
                opdFilter.value
            );
    }

    const {
        data,
        error
    } =
    await query;

    console.log(
        'LOAD USERS',
        data,
        error
    );

    console.log(
        'JUMLAH USER',
        data?.length
    );

    let html = '';

    data?.forEach(user => {

        const badgeStatusHtml = user.is_active
            ? `<span class="badge-status badge-active"><i class="fa-solid fa-circle shadow-none" style="font-size:6px;"></i> Aktif</span>`
            : `<span class="badge-status badge-inactive"><i class="fa-solid fa-circle shadow-none" style="font-size:6px;"></i> Nonaktif</span>`;

        const toggleBtnHtml = user.is_active
            ? `<button class="btn btn-sm btn-outline-danger w-100" onclick="toggleUser('${user.id}', ${user.is_active})"><i class="fa-solid fa-user-slash me-1"></i> Nonaktifkan</button>`
            : `<button class="btn btn-sm btn-outline-success w-100" onclick="toggleUser('${user.id}', ${user.is_active})"><i class="fa-solid fa-user-check me-1"></i> Aktifkan</button>`;

        html += `

        <tr>

            <td class="fw-semibold text-dark">
                ${user.full_name}
            </td>

            <td class="text-muted">
                ${user.email}
            </td>

            <td>

                <select
                onchange="
                updateRole(
                    '${user.id}',
                    this.value
                )"
                class="form-select form-select-sm fw-medium text-secondary bg-light">

                    <option value="SUPER_ADMIN"
                    ${user.role==='SUPER_ADMIN'?'selected':''}>
                    SUPER_ADMIN
                    </option>

                    <option value="ADMIN_OPD"
                    ${user.role==='ADMIN_OPD'?'selected':''}>
                    ADMIN_OPD
                    </option>

                    <option value="PPK"
                    ${user.role==='PPK'?'selected':''}>
                    PPK
                    </option>

                    <option value="PPTK"
                    ${user.role==='PPTK'?'selected':''}>
                    PPTK
                    </option>

                    <option value="PBJ"
                    ${user.role==='PBJ'?'selected':''}>
                    PBJ
                    </option>

                    <option value="VIEWER"
                    ${user.role==='VIEWER'?'selected':''}>
                    VIEWER
                    </option>

                </select>

            </td>

            <td class="text-center">
                ${badgeStatusHtml}
            </td>

            <td class="text-center">
                ${toggleBtnHtml}
            </td>

        </tr>

        `;
    });

    userTable.innerHTML = html;
}

async function updateRole(
    userId,
    role
){

    await usersDb
    .from('profiles')
    .update({
        role
    })
    .eq(
        'id',
        userId
    );

    await writeAuditLog(

        'USER',

        'UPDATE_ROLE',

        userId,

        'Update role user'

    );

    alert(
        'Role berhasil diupdate'
    );
}

async function toggleUser(
    userId,
    currentStatus
){

    await usersDb
    .from('profiles')
    .update({

        is_active:
            !currentStatus

    })
    .eq(
        'id',
        userId
    );

    await writeAuditLog(

        'USER',

        'UPDATE_STATUS',

        userId,

        'Update status user'

    );

    await loadUsers();
}

async function tambahUser(event) {

    event.preventDefault();

    const fullName =
        document.getElementById('addFullName').value;

    const email =
        document.getElementById('addEmail').value;

    const password =
        document.getElementById('addPassword').value;

    const role =
        document.getElementById('addRole').value;

    const opdId =
        document.getElementById('addOpdId').value;

    try {

        const {
            data: authData,
            error: authError
        } =
        await usersDb.auth.signUp({

            email,
            password

        });

        if (authError)
            throw authError;

        await usersDb
            .from('profiles')
            .insert([{

                auth_user_id:
                    authData.user.id,

                tenant_id:
                    currentProfile.tenant_id,

                opd_id:
                    opdId,

                full_name:
                    fullName,

                email:
                    email,

                role:
                    role,

                is_active:
                    true

            }]);

        alert(
            'User berhasil dibuat.\nSilakan login ulang.'
        );

        await usersDb.auth.signOut();

        location.href =
            '/pages/login.html';

    } catch (err) {

        console.error(err);

        alert(
            'Gagal menambahkan user : ' +
            err.message
        );
    }
}

await sendNotification(

    'USER_CREATED',

    'User Baru',

    `${fullName} (${role}) dibuat`

);

init();

</script>

</body>
</html>
