<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Arsip Dokumen - SI-DEVA v9</title>
    </head>
<body>

<div class="header-arsip">
    <button onclick="window.location.href='dashboard-v9.html'">← Kembali ke Dashboard</button>
    <h2>Arsip Paket</h2>
</div>

<div class="arsip-layout">
    <div class="sidebar-list" id="paket-list">
        Memuat daftar paket...
    </div>

    <div class="doc-area">
        <div id="nav-dokumen-v8" style="display:none; margin-bottom: 20px;">
            <button onclick="renderDokumenV8('evat', selectedPackageId)">EVAT</button>
            <button onclick="renderDokumenV8('evhp', selectedPackageId)">EVHP</button>
            <button onclick="renderDokumenV8('formspek', selectedPackageId)">Spek</button>
            <button onclick="renderDokumenV8('formdpp', selectedPackageId)">DPP</button>
            <button onclick="renderDokumenV8('nodis', selectedPackageId)">Nodis</button>
            <button onclick="renderDokumenV8('riviu', selectedPackageId)">Riviu</button>
            <button onclick="renderDokumenV8('penetapan', selectedPackageId)">Penetapan</button>
            <button onclick="renderDokumenV8('idkb', selectedPackageId)">IDKB</button>
            <button onclick="renderDokumenV8('bahpe', selectedPackageId)">BAHPE</button>
            <button onclick="renderDokumenV8('lainnya', selectedPackageId)">Lainnya</button>
        </div>
        
        <div id="doc-render-area">
            <p>Pilih paket di daftar sebelah kiri untuk memulai.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/dashboard-documentsv8.js"></script>
<script src="../js/v9-legacy-bridge.js"></script>

<script>
    async function initArsip() {
        // Cek apakah supabaseClient sudah ada
        if (!window.supabase) {
            console.warn("Supabase belum siap, mencoba lagi dalam 500ms...");
            setTimeout(initArsip, 500);
            return;
        }

        try {
            const { data, error } = await window.supabase
                .from('packages')
                .select('id, rup, package_name');
            
            if (error) throw error;

            const list = document.getElementById('paket-list');
            list.innerHTML = data.map(p => `
                <div class="paket-item" onclick="selectPaket('${p.id}')" style="cursor:pointer; padding:10px; border-bottom:1px solid #ccc;">
                    <strong>${p.rup}</strong><br>
                    <small>${p.package_name}</small>
                </div>
            `).join('');
        } catch (err) {
            console.error("Gagal ambil data:", err);
            document.getElementById('paket-list').innerHTML = "Gagal memuat paket. Cek koneksi.";
        }
    }

    // Tunggu semua file dimuat baru jalankan
    window.addEventListener('load', initArsip);
</script>

</body>
</html>
