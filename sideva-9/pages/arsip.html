<script>
    // Inisialisasi daftar paket saat halaman dibuka
    async function initArsip() {
        try {
            const { data, error } = await window.supabaseClient
                .from('packages')
                .select('id, rup, package_name');
            
            if (error) throw error;

            const list = document.getElementById('paket-list');
            list.innerHTML = data.map(p => `
                <div class="paket-item" onclick="selectPaket('${p.id}')">
                    <strong>${p.rup}</strong><br>
                    <small>${p.package_name}</small>
                </div>
            `).join('');
        } catch (err) {
            console.error("Gagal ambil data:", err);
        }
    }

    // Panggil saat halaman pertama kali load
    window.onload = initArsip;
</script>
