<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Documents - SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/workflow.js"></script>

<link rel="stylesheet" href="../css/app.css">
 
<style>
body{background:#f5f6fa}
.card{border:none}
</style>
</head>
<body>

<div class="container-fluid p-4">

<div class="d-flex justify-content-between mb-3">
<div>
<h3>Dokumen Paket</h3>
<div id="packageName">Loading...</div>
</div>

<div>
<a href="packages.html" class="btn btn-secondary">Kembali</a>
</div>
</div>

<div class="card mb-3">
<div class="card-body">

<div class="row">

<div class="col-md-3">
<select id="documentType" class="form-select">
<option>KAK</option>
<option>RAB</option>
<option>HPS</option>
<option>Spesifikasi Teknis</option>
<option>BA Survey</option>
<option>Undangan</option>
<option>Kontrak</option>
<option>SPK</option>
<option>BAST</option>
<option>Lainnya</option>
</select>
</div>

<div class="col-md-6">
<input type="file" id="fileInput" class="form-control">
</div>

<div class="col-md-3">
<button class="btn btn-primary w-100" onclick="uploadDocument()">
Upload Dokumen
</button>
</div>

</div>

</div>
</div>

<div class="card">
<div class="card-body">

<table class="table table-bordered">

<thead>
<tr>
<th>Jenis</th>
<th>Nama File</th>
<th>Ukuran</th>
<th>Tanggal</th>
<th width="180">Aksi</th>
</tr>
</thead>

<tbody id="documentsTable"></tbody>

</table>

</div>
</div>

</div>

<script>

const supabase = window.supabaseClient;

let profile=null;
let packageId=null;
let packageData=null;
let documents=[];

function formatBytes(bytes){
 if(!bytes) return '-';
 const sizes=['Bytes','KB','MB','GB'];
 const i=Math.floor(Math.log(bytes)/Math.log(1024));
 return (bytes/Math.pow(1024,i)).toFixed(2)+' '+sizes[i];
}

async function init(){

 profile = await getProfile();

 packageId = new URLSearchParams(location.search).get('id');

 await loadPackage();
 await loadDocuments();
}

async function loadPackage(){

 const {data} = await supabase
 .from('packages')
 .select('*')
 .eq('id',packageId)
 .single();

 packageData=data;

 if(data){
   document.getElementById('packageName').innerText=data.package_name;
 }
}

async function uploadDocument(){

 const file = document.getElementById('fileInput').files[0];

 if(!file){
   return Swal.fire('Info','Pilih file terlebih dahulu','info');
 }

 const filePath =
 `${packageId}/${Date.now()}_${file.name}`;

 const upload = await supabase
 .storage
 .from('package-documents')
 .upload(filePath,file);

 if(upload.error){
   return Swal.fire('Error',upload.error.message,'error');
 }

 const payload={
   tenant_id:profile.tenant_id,
   opd_id:profile.opd_id,
   package_id:packageId,
   document_type:document.getElementById('documentType').value,
   file_name:file.name,
   file_path:filePath,
   file_size:file.size,
   uploaded_by:profile.id
 };

 const result = await supabase
 .schema('business')
 .from('package_documents')
 .insert(payload);

 if(result.error){
   return Swal.fire('Error',result.error.message,'error');
 }

 Swal.fire('Sukses','Dokumen berhasil diupload','success');

 document.getElementById('fileInput').value='';

 await loadDocuments();
 await updatePackageStatus(packageId);
}

async function loadDocuments(){

 const {data,error} = await supabase
 .from('package_documents')
 .select('*')
 .eq('package_id',packageId)
 .order('created_at',{ascending:false});

 if(error){
   console.error(error);
   return;
 }

 documents=data||[];

 renderDocuments();
}

function renderDocuments(){

 let html='';

 documents.forEach(doc=>{

 html += `
 <tr>
   <td>${doc.document_type}</td>
   <td>${doc.file_name}</td>
   <td>${formatBytes(doc.file_size)}</td>
   <td>${new Date(doc.created_at).toLocaleDateString('id-ID')}</td>
   <td>
     <button class="btn btn-success btn-sm"
       onclick="downloadDocument('${doc.file_path}')">
       Download
     </button>

     <button class="btn btn-danger btn-sm"
       onclick="deleteDocument('${doc.id}','${doc.file_path}')">
       Hapus
     </button>
   </td>
 </tr>`;

 });

 document.getElementById('documentsTable').innerHTML=html;
}

async function downloadDocument(path){

 const {data,error} = await supabase
 .storage
 .from('package-documents')
 .createSignedUrl(path,60);

 if(error){
   return Swal.fire('Error',error.message,'error');
 }

 window.open(data.signedUrl,'_blank');
}

async function deleteDocument(id,path){

 const ok = await Swal.fire({
   title:'Hapus dokumen?',
   showCancelButton:true
 });

 if(!ok.isConfirmed) return;

 await supabase
 .storage
 .from('package-documents')
 .remove([path]);

 const {error} = await supabase
 .schema('business')
 .from('package_documents')
 .delete()
 .eq('id',id);

 if(error){
   return Swal.fire('Error',error.message,'error');
 }

 await loadDocuments();
}

init();

</script>

</body>
</html>
