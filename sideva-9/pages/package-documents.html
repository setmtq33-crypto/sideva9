<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Documents - SIDEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/workflow.js"></script>

<link rel="stylesheet" href="../css/app.css">
 
<style>
body{background:#f5f6fa}
.card{border:none; border-radius: 12px;}
.paper-viewport { background: #6c757d; padding: 30px 15px; border-radius: 8px; min-height: 650px; display: flex; justify-content: center; }
@media print {
    body * { visibility: hidden; }
    #document-render-area, #document-render-area * { visibility: visible; }
    #document-render-area { position: absolute; left: 0; top: 0; width: 100%; }
}
</style>
</head>
<body>

<div id="sidebar-container"></div>

<div class="main-content">
    <div id="topbar-container"></div>

    <div class="container-fluid p-4">
        <div class="card p-4 mb-4 shadow-sm bg-white">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="badge bg-primary mb-1">Modul Berkas Fisik v9</span>
                    <h3 class="fw-bold m-0" id="packageName">Memuat nama paket...</h3>
                    <small class="text-muted" id="packageRup">ID RUP: -</small>
                </div>
                <div>
                    <a href="packages.html" class="btn btn-outline-secondary btn-sm px-3 rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i> Kembali ke Paket
                    </a>
                </div>
            </div>
        </div>

        <ul class="nav nav-pills mb-4" id="documentTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active px-4 fw-bold" id="auto-print-tab" data-bs-toggle="tab" data-bs-target="#auto-print" type="button" role="tab">
                    <i class="bi bi-printer-fill me-2"></i>Cetak Dokumen Otomatis (10 Berkas)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link px-4 fw-bold" id="manual-upload-tab" data-bs-toggle="tab" data-bs-target="#manual-upload" type="button" role="tab">
                    <i class="bi bi-cloud-arrow-up-fill me-2"></i>Berkas Unggahan / Storage
                </button>
            </li>
        </ul>

        <div class="tab-content" id="documentTabContent">
            
            <div class="tab-pane fade show active" id="auto-print" role="tabpanel">
                <div class="row">
                    <div class="col-lg-4 mb-4">
                        <div class="card p-3 shadow-sm bg-white">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="fw-bold text-secondary small">DAFTAR PILIHAN DOKUMEN</span>
                                <button id="btn-print-action" class="btn btn-danger btn-sm px-3" onclick="window.print()" disabled>
                                    <i class="bi bi-printer"></i> Cetak A4
                                </button>
                            </div>
                            <div class="list-group" id="auto-doc-list">
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('idkb')">1. Identifikasi Kebutuhan (IDKB)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('penetapan')">2. Penetapan Cara Pengadaan</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('nodis')">3. Nota Dinas Pengajuan (NODIS)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('sppbj')">4. Surat Perintah Kerja (SPPBJ)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('formdpp')">5. Dokumen Persiapan (DPP)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('formspek')">6. Spesifikasi Teknis (SPEK)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('riviu')">7. BA Kaji Ulang DPP (RIVIU)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('evhp')">8. BA Evaluasi Harga (EVHP)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('evat')">9. BA Evaluasi Admin (EVAT)</button>
                                <button class="list-group-item list-group-item-action py-2" onclick="switchPrintView('bahpe')">10. BA Hasil Pengadaan (BAHPE)</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="paper-viewport">
                            <div id="document-render-area" class="w-100">
                                <div class="text-center text-white my-5 py-5">
                                    <i class="bi bi-file-earmark-pdf display-1 opacity-25"></i>
                                    <p class="mt-3 opacity-75">Silakan pilih jenis berkas di menu kiri untuk melihat draf cetak.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="manual-upload" role="tabpanel">
                <div class="card p-4 shadow-sm bg-white">
                    <form id="uploadForm" class="row g-3 align-items-center mb-4">
                        <div class="col-md-4">
                            <label class="form-label font-weight-bold">Jenis Dokumen</label>
                            <select id="docType" class="form-select" required>
                                <option value="IDKB">IDKB</option>
                                <option value="PENETAPAN">PENETAPAN</option>
                                <option value="NODIS">NODIS</option>
                                <option value="SPPBJ">SPPBJ</option>
                                <option value="FORM_DPP">FORM DPP</option>
                                <option value="FORM_SPEK">FORM SPEK</option>
                                <option value="BA_RIVIU">BA RIVIU</option>
                                <option value="BA_EVAT">BA EVAT</option>
                                <option value="BA_EVHP">BA EVHP</option>
                                <option value="BAHPE">BAHPE</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label font-weight-bold">Pilih File Berkas</label>
                            <input type="file" id="docFile" class="form-select" required>
                        </div>
                        <div class="col-md-3 mt-4 text-end">
                            <button type="submit" class="btn btn-primary w-100 mt-2">
                                <i class="bi bi-cloud-upload me-1"></i> Unggah Berkas
                            </button>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-bordered table-striped align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Jenis Dokumen</th>
                                    <th>Nama File</th>
                                    <th>Ukuran</th>
                                    <th>Tanggal Unggah</th>
                                    <th width="180">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="documentsTable">
                                <tr><td colspan="5" class="text-center text-muted">Memuat database storage...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
// Ambil ID Paket dari URL Param bawaan SIDEVA9
const urlParams = new URLSearchParams(window.location.search);
const packageId = urlParams.get('package_id') || urlParams.get('id');

let documents = [];

// Inject UI Komponen SIDEVA9
fetch('sidebar.html').then(r=>r.text()).then(html=>{
    document.getElementById('sidebar-container').innerHTML=html;
    if(document.getElementById('menuDocuments')) document.getElementById('menuDocuments').classList.add('active');
});
fetch('topbar.html').then(r=>r.text()).then(html=>{
    document.getElementById('topbar-container').innerHTML=html;
});

// Load Identitas Paket Utama
async function initPackageHeader() {
    if(!packageId) {
        Swal.fire('Error','ID Paket tidak valid di URL','error');
        return;
    }
    const { data, error } = await window.supabaseClient.from('packages').select('*').eq('id', packageId).single();
    if(!error && data) {
        document.getElementById('packageName').innerText = data.package_name;
        document.getElementById('packageRup').innerText = `ID RUP: ${data.rup_id || '-'}`;
    }
}

// Handler Pindah Tampilan Dokumen Cetak
function switchPrintView(slug) {
    const listItems = document.querySelectorAll('#auto-doc-list .list-group-item');
    listItems.forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    document.getElementById('btn-print-action').removeAttribute('disabled');
    
    if(typeof window.renderSidevaDocument === 'function') {
        window.renderSidevaDocument(slug, packageId);
    }
}

// ─── CODING ASLI INTERNAL STORAGE BAWAAN ANDA (DIPERTAHANKAN UTUH) ───
async function loadUploadedDocuments(){
    if(!packageId) return;
    const {data, error} = await window.supabaseClient.from('package_documents').select('*').eq('package_id',packageId).order('created_at',{ascending:false});
    if(error){ console.error(error); return; }
    documents = data || [];
    renderUploadedTable();
}

function renderUploadedTable(){
    let html='';
    if(documents.length === 0) {
        document.getElementById('documentsTable').innerHTML = '<tr><td colspan="5" class="text-center py-3 text-muted">Belum ada file manual yang diunggah ke storage.</td></tr>';
        return;
    }
    documents.forEach(doc=>{
        html += `
        <tr>
            <td><span class="badge bg-secondary">${doc.document_type}</span></td>
            <td><i class="bi bi-file-earmark-text me-1"></i>${doc.file_name}</td>
            <td>${formatBytes(doc.file_size)}</td>
            <td>${new Date(doc.created_at).toLocaleDateString('id-ID')}</td>
            <td>
                <button class="btn btn-success btn-sm p-1 px-2" onclick="downloadDocument('${doc.file_path}')"><i class="bi bi-download"></i></button>
                <button class="btn btn-danger btn-sm p-1 px-2" onclick="deleteDocument('${doc.id}','${doc.file_path}')"><i class="bi bi-trash"></i></button>
            </td>
        </tr>`;
    });
    document.getElementById('documentsTable').innerHTML=html;
}

document.getElementById('uploadForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fileInput = document.getElementById('docFile');
    const docType = document.getElementById('docType').value;
    if(!fileInput.files || fileInput.files.length===0) return;
    
    const file = fileInput.files[0];
    const fileExt = file.name.split('.').pop();
    const filePath = `${packageId}/${docType}_${Date.now()}.${fileExt}`;
    
    Swal.showLoading();
    const { error: uploadError } = await window.supabaseClient.storage.from('package-documents').upload(filePath, file);
    if(uploadError) return Swal.fire('Error', uploadError.message, 'error');
    
    const { error: dbError } = await window.supabaseClient.from('package_documents').insert({
        package_id: packageId,
        document_type: docType,
        file_name: file.name,
        file_size: file.size,
        file_path: filePath
    });
    
    if(dbError) return Swal.fire('Error', dbError.message, 'error');
    Swal.fire('Sukses','Berhasil mengunggah berkas','success');
    fileInput.value = '';
    loadUploadedDocuments();
});

async function downloadDocument(path){
    const {data,error} = await window.supabaseClient.storage.from('package-documents').createSignedUrl(path,60);
    if(error) return Swal.fire('Error',error.message,'error');
    window.open(data.signedUrl,'_blank');
}

async function deleteDocument(id,path){
    const res = await Swal.fire({ title:'Hapus berkas?', text:'File akan dihapus permanen dari storage', icon:'warning', showCancelButton:true });
    if(!res.isConfirmed) return;
    
    await window.supabaseClient.storage.from('package-documents').remove([path]);
    await window.supabaseClient.from('package_documents').delete().eq('id',id);
    loadUploadedDocuments();
}

function formatBytes(bytes, decimals = 2) {
    if (!bytes) return '0 Bytes';
    const k = 1024;
    const dm = decimals < 0 ? 0 : decimals;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

window.addEventListener('DOMContentLoaded', () => {
    initPackageHeader();
    loadUploadedDocuments();
});
</script>
<script src="../js/dashboard-documents.js"></script>
</body>
</html>
