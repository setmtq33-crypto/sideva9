<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Notifikasi SI-DEVA9</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
}

.topbar{
    background:#fff;
    border-radius:20px;
    padding:20px 25px;
    margin-bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.hero{
    background:linear-gradient(
        135deg,
        #0ea5e9,
        #2563eb
    );
    color:white;
    border-radius:20px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(37,99,235,.25);
}

.card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.notification-item{
    border-bottom:1px solid #eef2f7;
    padding:16px;
}

.notification-item:last-child{
    border-bottom:none;
}

.notification-title{
    font-weight:700;
}

.notification-date{
    font-size:.8rem;
    color:#64748b;
}

.badge-event{
    font-size:.75rem;
}

.empty-state{
    text-align:center;
    padding:50px;
    color:#94a3b8;
}

</style>
</head>

<body>

<div class="container py-4">

    <div class="topbar">

        <div>

            <h4 class="mb-0 fw-bold">
                <i class="fa-solid fa-bell me-2 text-primary"></i>
                Notification Center
            </h4>

            <small class="text-muted">
                Aktivitas Sistem SI-DEVA9
            </small>

        </div>

        <button
            class="btn btn-primary"
            onclick="location.href='dashboard.html'">

            <i class="fa-solid fa-arrow-left me-2"></i>
            Dashboard

        </button>

    </div>

    <div class="hero">

        <h2>
            <i class="fa-solid fa-bell me-2"></i>
            Notifikasi Sistem
        </h2>

        <p class="mb-0 opacity-75">
            Menampilkan seluruh aktivitas pengguna dan perubahan data SI-DEVA9.
        </p>

    </div>

    <div class="card">

        <div class="card-header bg-white py-3">

            <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    Aktivitas Terbaru
                </h5>

                <button
                    class="btn btn-outline-primary btn-sm"
                    onclick="loadNotifications()">

                    <i class="fa-solid fa-rotate"></i>
                    Refresh

                </button>

            </div>

        </div>

        <div id="notificationList">

            <div class="empty-state">

                <i class="fa-solid fa-spinner fa-spin fa-2x mb-3"></i>

                <div>Memuat notifikasi...</div>

            </div>

        </div>

    </div>

</div>

<script>

async function loadNotifications(){

    const list =
        document.getElementById(
            'notificationList'
        );

    list.innerHTML =
        `<div class="empty-state">
            <i class="fa-solid fa-spinner fa-spin fa-2x mb-3"></i>
            <div>Memuat data...</div>
        </div>`;

    const {
        data,
        error
    } =
    await window.supabaseClient
        .from(
            'telegram_notifications'
        )
        .select('*')
        .order(
            'created_at',
            {
                ascending:false
            }
        )
        .limit(100);

    if(error){

        list.innerHTML =
        `
        <div class="alert alert-danger m-3">
            ${error.message}
        </div>
        `;

        return;
    }

    if(!data || data.length===0){

        list.innerHTML =
        `
        <div class="empty-state">

            <i class="fa-regular fa-bell-slash fa-3x mb-3"></i>

            <h5>
                Belum Ada Notifikasi
            </h5>

        </div>
        `;

        return;
    }

    let html='';

    data.forEach(item=>{

        html +=
        `
        <div class="notification-item">

            <div class="d-flex justify-content-between">

                <div>

                    <div class="notification-title">

                        ${item.title || '-'}

                    </div>

                    <div class="text-muted">

                        ${item.message || '-'}

                    </div>

                    <div class="notification-date mt-1">

                        ${new Date(
                            item.created_at
                        ).toLocaleString('id-ID')}

                    </div>

                </div>

                <div>

                    <span class="badge bg-primary badge-event">

                        ${item.event_type}

                    </span>

                </div>

            </div>

        </div>
        `;
    });

    list.innerHTML = html;
}

document.addEventListener(
    'DOMContentLoaded',
    loadNotifications
);

</script>

</body>
</html>
