<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>
DPP Generator - SIDEVA9
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/audit.js"></script>

<style>

body{
    background:#f4f6f9;
}

.document-card{

    background:white;

    max-width:900px;

    margin:auto;

    padding:50px;

    box-shadow:
    0 2px 12px rgba(
        0,0,0,.08
    );
}

.doc-title{

    text-align:center;

    font-weight:bold;

    font-size:24px;

    margin-bottom:8px;
}

.doc-subtitle{

    text-align:center;

    margin-bottom:40px;
}

.section-title{

    font-weight:bold;

    margin-top:25px;

    margin-bottom:15px;
}

.table-doc{

    width:100%;
}

.table-doc td{

    padding:6px;
}

.print-area{

    background:white;
}

@media print{

    .no-print{
        display:none;
    }

    body{
        background:white;
    }

    .document-card{

        box-shadow:none;

        max-width:100%;

        margin:0;

        padding:0;
    }
}

</style>

</head>

<body>

<div
class="container-fluid p-4 no-print">

<div
class="d-flex justify-content-between">

<div>

<h3>

Dokumen Persiapan Pengadaan

</h3>

</div>

<div>

<a
href="packages.html"
class="btn btn-secondary">

Kembali

</a>

<button
id="printBtn"
class="btn btn-primary">

Cetak PDF

</button>

</div>

</div>

</div>

<div
class="document-card print-area">

<div id="dppContent">

<div
class="text-center p-5">

Loading DPP...

</div>

</div>

</div>

<script>

const dppDocDb =
    window.supabaseClient;

let packageId = null;

let packageData = null;

let dppData = null;

let hpsData = null;

let itemsData = [];

let docsData = [];

let profileData = null;

let opdData = null;

let tenantData = null;

document
.getElementById(
    'printBtn'
)
.onclick = () => {

    window.print();

};

async function loadData(){

    packageId =
        new URLSearchParams(
            location.search
        ).get('id');

    if(!packageId){

        alert(
            'Package ID tidak ditemukan'
        );

        location.href =
            'packages.html';

        return;
    }

    const profile =
        await getProfile();

    profileData = profile;

    const {
        data: pkg
    } =
    await dppDocDb
    .from('packages')
    .select('*')
    .eq('id', packageId)
    .single();

    packageData = pkg;

    const {
        data: dpp
    } =
    await dppDocDb
    .from('package_dpp')
    .select('*')
    .eq('package_id', packageId)
    .maybeSingle();

    dppData = dpp;

    const {
        data: hps
    } =
    await dppDocDb
    .from('package_hps')
    .select('*')
    .eq('package_id', packageId)
    .maybeSingle();

    hpsData = hps;

    const {
        data: items
    } =
    await dppDocDb
    .from('package_items')
    .select('*')
    .eq('package_id', packageId)
    .order(
        'created_at',
        {
            ascending:true
        }
    );

    itemsData =
        items || [];

    const {
        data: docs
    } =
    await dppDocDb
    .from('package_documents')
    .select('*')
    .eq('package_id', packageId);

    docsData =
        docs || [];

    const {
        data: opd
    } =
    await dppDocDb
    .from('opds')
    .select('*')
    .eq(
        'id',
        packageData.opd_id
    )
    .single();

    opdData = opd;

    const {
        data: tenant
    } =
    await dppDocDb
    .from('tenants')
    .select('*')
    .eq(
        'id',
        packageData.tenant_id
    )
    .single();

    tenantData = tenant;

    renderDocument();

    await writeAuditLog(
        'DPP',
        'GENERATE',
        packageId,
        'Generate Dokumen Persiapan Pengadaan'
    );
}

function renderDocument(){

    const totalHps =
        hpsData?.total_hps || 0;

    const efficiency =
        hpsData?.efficiency || 0;

    let itemsHtml = '';

    itemsData.forEach(
        (
            item,
            index
        ) => {

        itemsHtml += `

        <tr>

            <td>

                ${index + 1}

            </td>

            <td>

                ${item.item_name || ''}

            </td>

            <td>

                ${item.specification || ''}

            </td>

            <td>

                ${item.quantity || 0}

            </td>

            <td>

                ${item.unit || ''}

            </td>

            <td>

                Rp ${Number(
                    item.estimated_price || 0
                ).toLocaleString(
                    'id-ID'
                )}

            </td>

        </tr>

        `;
    });

    let docsHtml = '';

    docsData.forEach(
        (
            doc,
            index
        ) => {

        docsHtml += `

        <tr>

            <td>

                ${index + 1}

            </td>

            <td>

                ${doc.document_type || ''}

            </td>

            <td>

                ${doc.file_name || ''}

            </td>

        </tr>

        `;
    });

    document
    .getElementById(
        'dppContent'
    )
    .innerHTML = `

    <div
    class="text-center mb-5">

        <h4>

            ${tenantData?.name || ''}

        </h4>

        <h5>

            ${opdData?.name || ''}

        </h5>

        <h3>

            DOKUMEN
            PERSIAPAN
            PENGADAAN

        </h3>

    </div>

    <div
    class="section-title">

        I. IDENTITAS PAKET

    </div>

    <table
    class="table-doc">

        <tr>

            <td width="250">

                Nama Paket

            </td>

            <td>

                :

            </td>

            <td>

                ${packageData.package_name || ''}

            </td>

        </tr>

        <tr>

            <td>

                Nomor RUP

            </td>

            <td>

                :

            </td>

            <td>

                ${packageData.rup_number || '-'}

            </td>

        </tr>

        <tr>

            <td>

                Metode

            </td>

            <td>

                :

            </td>

            <td>

                ${packageData.procurement_method || ''}

            </td>

        </tr>

        <tr>

            <td>

                Pagu Anggaran

            </td>

            <td>

                :

            </td>

            <td>

                Rp ${Number(
                    packageData.budget_ceiling || 0
                ).toLocaleString(
                    'id-ID'
                )}

            </td>

        </tr>

        <tr>

            <td>

                Program

            </td>

            <td>

                :

            </td>

            <td>

                ${packageData.program || ''}

            </td>

        </tr>

        <tr>

            <td>

                Kegiatan

            </td>

            <td>

                :

            </td>

            <td>

                ${packageData.kegiatan || ''}

            </td>

        </tr>

        <tr>

            <td>

                Sub Kegiatan

            </td>

            <td>

                :

            </td>

            <td>

                ${packageData.sub_kegiatan || ''}

            </td>

        </tr>

    </table>

    <div class="section-title">

        II. LATAR BELAKANG

    </div>

    <p>

        ${dppData?.background || '-'}

    </p>

    <div class="section-title">

        III. TUJUAN PENGADAAN

    </div>

    <p>

        ${dppData?.objectives || '-'}

    </p>

    <div class="section-title">

        IV. RUANG LINGKUP

    </div>

    <p>

        ${dppData?.scope_of_work || '-'}

    </p>

    <p>

        Lokasi :
        ${dppData?.implementation_location || '-'}

    </p>

    <p>

        Waktu :
        ${dppData?.implementation_period || '-'}

    </p>

    <div class="section-title">

        V. DAFTAR KEBUTUHAN
        BARANG/JASA

    </div>

    <table
    class="table table-bordered">

        <thead>

            <tr>

                <th>No</th>

                <th>Nama Item</th>

                <th>Spesifikasi</th>

                <th>Qty</th>

                <th>Satuan</th>

                <th>Harga Estimasi</th>

            </tr>

        </thead>

        <tbody>

            ${itemsHtml}

        </tbody>

    </table>

    <div class="section-title">

        VI. HARGA PERKIRAAN SENDIRI

    </div>

    <table
    class="table-doc">

        <tr>

            <td width="250">

                Total HPS

            </td>

            <td>

                :

            </td>

            <td>

                Rp ${Number(
                    totalHps
                ).toLocaleString(
                    'id-ID'
                )}

            </td>

        </tr>

        <tr>

            <td>

                Efisiensi

            </td>

            <td>

                :

            </td>

            <td>

                Rp ${Number(
                    efficiency
                ).toLocaleString(
                    'id-ID'
                )}

            </td>

        </tr>

    </table>

    <div class="section-title">

        VII. DOKUMEN
        PENDUKUNG

    </div>

    <table
    class="table table-bordered">

        <thead>

            <tr>

                <th>No</th>

                <th>Jenis Dokumen</th>

                <th>Nama File</th>

            </tr>

        </thead>

        <tbody>

            ${docsHtml}

        </tbody>

    </table>

    <div class="section-title">

        VIII. PENUTUP

    </div>

    <p>

        Dokumen Persiapan
        Pengadaan ini
        disusun sebagai
        dasar pelaksanaan
        proses pengadaan
        barang/jasa sesuai
        ketentuan Peraturan
        Presiden tentang
        Pengadaan Barang/Jasa
        Pemerintah yang berlaku.

    </p>

    <br><br>

    <div
    style="
    width:300px;
    margin-left:auto;
    ">

        <p>

            Disusun Oleh

        </p>

        <br><br><br>

        <strong>

            ${profileData?.full_name || ''}

        </strong>

        <br>

        ${profileData?.role || ''}

    </div>

    `;
}

loadData();

  

</script>


  
</body>
</html>
