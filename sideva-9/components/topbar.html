<div class="topbar-fluid d-flex align-items-center justify-content-between px-3 px-md-4">
    
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light border d-lg-none rounded-3 me-1" onclick="document.body.classList.toggle('sidebar-open')" aria-label="Toggle Navigation">
            <i class="bi bi-list fs-5"></i>
        </button>
        <div class="d-flex align-items-center gap-2 text-muted fw-bold tracking-wider secure-badge">
            <i class="bi bi-shield-check text-primary fs-5"></i> 
            <span class="d-none d-sm-inline">SECURE CONNECTION ENGINE</span>
        </div>
    </div>

    <div class="d-flex align-items-center gap-2 gap-md-3">
        
        <div id="superAdminOpdSelectorContainer" class="d-none">
            <select id="globalOpdSelector" class="form-select form-select-sm border-secondary-subtle bg-body-tertiary fw-semibold" style="min-width: 220px; border-radius: 8px; font-size: 0.8rem; height: 36px; cursor: pointer;">
                <option value="ALL">-- Semua OPD (Konsolidasi) --</option>
            </select>
        </div>

        <button onclick="toggleAppTheme()" class="btn btn-icon-theme me-1" title="Ganti Mode Tampilan" aria-label="Switch Theme">
            <i class="bi bi-sun-fill" id="theme-icon-indicator" style="font-size: 1.1rem;"></i>
        </button>

        <div class="text-end d-none d-md-block">
            <h6 class="mb-0 fw-bold header-profile-name" id="userName" style="font-size: 0.85rem;">Memuat Akun...</h6>
            <small class="text-muted fw-semibold opacity-75" style="font-size: 0.7rem;">Supabase Auth Platform</small>
        </div>

        <button onclick="logout()" class="btn-logout-action" title="Keluar dari Aplikasi">
            <i class="bi bi-power fs-5"></i>
        </button>
    </div>
</div>

<style>
    .topbar-fluid {
        height: 70px;
        background: var(--bs-body-bg);
        border-bottom: 1px solid var(--bs-border-color);
        width: 100%;
    }
    .secure-badge {
        font-size: 0.75rem;
        letter-spacing: 0.5px;
    }
    .btn-icon-theme {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        border: 1px solid var(--bs-border-color);
        background: var(--bs-tertiary-bg);
        color: var(--bs-body-color);
        transition: all 0.2s;
    }
    .btn-icon-theme:hover {
        background: var(--bs-secondary-bg);
    }
    .btn-logout-action {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 10px;
        background: rgba(220, 53, 69, 0.1);
        color: #dc3545;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .btn-logout-action:hover {
        background: #dc3545;
        color: #ffffff;
    }
</style>

<script>
    // 1. FUNGSI MANAGEMENT MANAGEMENT TEMA
    function applySavedTheme() {
        const cachedTheme = localStorage.getItem('theme-mode') || 'light';
        document.documentElement.setAttribute('data-bs-theme', cachedTheme);
        const icon = document.getElementById('theme-icon-indicator');
        if (icon) {
            icon.className = cachedTheme === 'dark' ? 'bi bi-moon-stars-fill text-warning' : 'bi bi-sun-fill text-primary';
        }
    }

    function toggleAppTheme() {
        const activeTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme-mode', activeTheme);
        document.documentElement.setAttribute('data-bs-theme', activeTheme);
        const icon = document.getElementById('theme-icon-indicator');
        if (icon) {
            icon.className = activeTheme === 'dark' ? 'bi bi-moon-stars-fill text-warning' : 'bi bi-sun-fill text-primary';
        }
    }

    // 2. LOGIKA UTAMA: VALIDASI AMAN SELECTOR OPD GLOBAL
    async function initGlobalOpdSelector() {
        // Mekanisme Interval Tunggu: Menghindari balapan pemuatan skrip auth.js / supabase.js
        const checkAuthReady = setInterval(async () => {
            try {
                // Pastikan client Supabase dan fungsi getProfile bawaan framework Anda sudah terdefinisi di window
                if (typeof window.supabaseClient !== 'undefined' && typeof window.getProfile === 'function') {
                    
                    // Hentikan loop pencarian karena core script sudah siap
                    clearInterval(checkAuthReady);
                    
                    // Ambil profil pengguna aktif
                    const userProfile = await window.getProfile(); 
                    
                    if (userProfile) {
                        const userRole = (userProfile.role || '').toLowerCase();
                        
                        // Cek presisi apakah level akun adalah super_admin
                        if (userRole === 'super_admin' || userRole === 'superadmin') {
                            const container = document.getElementById('superAdminOpdSelectorContainer');
                            const selector = document.getElementById('globalOpdSelector');
                            
                            if (container && selector) {
                                // Ambil data list OPD langsung menggunakan objek database global window.supabaseClient
                                const { data: opds, error } = await window.supabaseClient
                                    .from('opds')
                                    .select('id, opd_name')
                                    .order('opd_name', { ascending: true });
                                
                                if (!error && opds) {
                                    // Bersihkan sisa render duplikasi sebelum mengisi dropdown
                                    selector.innerHTML = '<option value="ALL">-- Semua OPD (Konsolidasi) --</option>';
                                    
                                    opds.forEach(opd => {
                                        const opt = document.createElement('option');
                                        opt.value = opd.id;
                                        opt.innerText = opd.opd_name;
                                        selector.appendChild(opt);
                                    });
                                    
                                    // Ambil opsi terakhir yang disimpan di memori browser
                                    const savedOpdId = localStorage.getItem('selected-opd-id') || 'ALL';
                                    selector.value = savedOpdId;
                                    
                                    // Pasang event penangkap perubahan data
                                    selector.addEventListener('change', (e) => {
                                        localStorage.setItem('selected-opd-id', e.target.value);
                                        window.location.reload();
                                    });
                                    
                                    // TAMPILKAN SEKARANG: Menghapus kelas d-none secara paksa setelah data siap
                                    container.classList.remove('d-none');
                                } else {
                                    console.error("Gagal menarik data tabel opds dari Supabase:", error);
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                clearInterval(checkAuthReady);
                console.error("Sistem menghentikan pemuatan otomatis Selector akibat kendala teknis:", err);
            }
        }, 100); // Periksa ulang setiap 100 milidetik secara asinkronus

        // Pembatasan keamanan (Timeout): Jika dalam 6 detik fungsi tidak ketemu, hentikan interval agar tidak membebani memori browser
        setTimeout(() => clearInterval(checkAuthReady), 6000);
    }

    // Inisialisasi awal saat topbar ditempelkan oleh layout.js
    applySavedTheme();
    initGlobalOpdSelector();
</script>
