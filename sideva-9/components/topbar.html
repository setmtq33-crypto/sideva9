<div class="topbar-fluid d-flex align-items-center justify-content-between px-3 px-md-4">
    
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light border d-lg-none rounded-3 me-1" onclick="document.body.classList.toggle('sidebar-open')" aria-label="Toggle Navigation">
            <i class="bi bi-list fs-5"></i>
        </button>
        <div class="d-flex align-items-center gap-2 text-muted fw-bold tracking-wider secure-badge">
            <i class="bi bi-shield-check text-primary fs-5"></i> 
            <span class="d-none d-sm-inline">SECURE CONNECTION ENGINE</span>
        </div>
    </div>

    <div class="d-flex align-items-center gap-2 gap-md-3">
        
        <div id="superAdminOpdSelectorContainer" class="d-none">
            <select id="globalOpdSelector" class="form-select form-select-sm border-secondary-subtle bg-body-tertiary fw-semibold" style="min-width: 220px; border-radius: 8px; font-size: 0.8rem; height: 36px; cursor: pointer;">
                <option value="ALL">-- Semua OPD (Konsolidasi) --</option>
            </select>
        </div>

        <button onclick="toggleAppTheme()" class="btn btn-icon-theme me-1" title="Ganti Mode Tampilan" aria-label="Switch Theme">
            <i class="bi bi-sun-fill" id="theme-icon-indicator" style="font-size: 1.1rem;"></i>
        </button>

        <div class="text-end d-none d-md-block">
            <h6 class="mb-0 fw-bold header-profile-name" id="userName" style="font-size: 0.85rem;">Memuat Akun...</h6>
            <small class="text-muted fw-semibold opacity-75" style="font-size: 0.7rem;">Supabase Active Auth</small>
        </div>
        
        <div class="profile-avatar-circle d-flex align-items-center justify-content-center fw-bold">
            <i class="bi bi-person-fill"></i>
        </div>

        <div class="vr d-none d-sm-block mx-1" style="height: 24px; opacity: 0.2;"></div>

        <button onclick="logout()" class="btn btn-logout-action" title="Logout dari sistem">
            <i class="bi bi-power"></i>
        </button>
    </div>
</div>

<style>
    .topbar-fluid {
        height: 70px;
        background: var(--bs-body-bg);
        border-bottom: 1px solid var(--bs-border-color);
        width: 100%;
    }
    .secure-badge { font-size: 0.72rem; }
    
    .btn-icon-theme {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--bs-border-color);
        background: var(--bs-tertiary-bg);
        color: var(--bs-body-color);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .btn-icon-theme:hover {
        background: var(--bs-secondary-bg);
    }
    
    .profile-avatar-circle {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--bs-primary-subtle);
        color: var(--bs-primary);
        font-size: 0.9rem;
        border: 1px solid var(--bs-border-color-translucent);
    }
    .btn-logout-action {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 10px;
        background: rgba(220, 53, 69, 0.1);
        color: #dc3545;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .btn-logout-action:hover {
        background: #dc3545;
        color: #ffffff;
    }
</style>

<script>
    // 1. UTALITAS PENGATURAN TEMA TAMPILAN
    function applySavedTheme() {
        const cachedTheme = localStorage.getItem('theme-mode') || 'light';
        document.documentElement.setAttribute('data-bs-theme', cachedTheme);
        const icon = document.getElementById('theme-icon-indicator');
        if (icon) {
            icon.className = cachedTheme === 'dark' ? 'bi bi-moon-stars-fill text-warning' : 'bi bi-sun-fill text-primary';
        }
    }

    function toggleAppTheme() {
        const activeTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme-mode', activeTheme);
        document.documentElement.setAttribute('data-bs-theme', activeTheme);
        const icon = document.getElementById('theme-icon-indicator');
        if (icon) {
            icon.className = activeTheme === 'dark' ? 'bi bi-moon-stars-fill text-warning' : 'bi bi-sun-fill text-primary';
        }
    }

    // 2. LOGIKA UTAMA: EVALUASI ROLE DAN PENGISIAN DROPDOWN OPD
    async function verifyAndRenderOpdSelector() {
        // Gunakan interval untuk menunggu sampai fungsi getProfile() & objek database Supabase siap di window
        const integrityCheck = setInterval(async () => {
            const hasAuthScript = typeof window.getProfile === 'function';
            const hasSupabase = typeof window.supabaseClient !== 'undefined';
            const hasContainer = document.getElementById('superAdminOpdSelectorContainer') !== null;

            if (hasAuthScript && hasSupabase && hasContainer) {
                clearInterval(integrityCheck); // Hentikan loop pencarian karena semua resource siap
                
                try {
                    const profile = await window.getProfile();
                    
                    if (profile && profile.role) {
                        // Mengonversi role menjadi huruf kecil semua agar lolos validasi 'super_admin' atau 'superadmin'
                        const normalizedRole = profile.role.toLowerCase().replace(/[^a-z0-9]/g, '');
                        
                        if (normalizedRole === 'superadmin') {
                            const container = document.getElementById('superAdminOpdSelectorContainer');
                            const selector = document.getElementById('globalOpdSelector');
                            
                            // Tarik data langsung dari tabel database 'opds' Anda
                            const { data: opds, error } = await window.supabaseClient
                                .from('opds')
                                .select('id, opd_name')
                                .order('opd_name', { ascending: true });
                            
                            if (!error && opds) {
                                // Bersihkan isi dropdown agar tidak duplikat saat berpindah halaman
                                selector.innerHTML = '<option value="ALL">-- Semua OPD (Konsolidasi) --</option>';
                                
                                opds.forEach(opd => {
                                    const opt = document.createElement('option');
                                    opt.value = opd.id;
                                    opt.innerText = opd.opd_name;
                                    selector.appendChild(opt);
                                });
                                
                                // Kunci kembali posisi pilihan OPD terakhir yang disimpan di komputer admin
                                const savedOpd = localStorage.getItem('selected-opd-id') || 'ALL';
                                selector.value = savedOpd;
                                
                                // Pasang detektor perubahan pilihan
                                selector.addEventListener('change', (e) => {
                                    localStorage.setItem('selected-opd-id', e.target.value);
                                    window.location.reload();
                                });
                                
                                // Tampilkan container dropdown secara instan ke hadapan Super Admin
                                container.classList.remove('d-none');
                            } else {
                                console.error("Supabase Error saat membaca tabel opds:", error);
                            }
                        }
                    }
                } catch (err) {
                    console.error("Gagal memproses validasi hak akses akun:", err);
                }
            }
        }, 100);

        // Batasi pencarian maksimal selama 6 detik untuk mencegah konsumsi memori tak terbatas jika ada script error eksternal
        setTimeout(() => clearInterval(integrityCheck), 6000);
    }

    // Jalankan eksekusi terstruktur
    applySavedTheme();
    verifyAndRenderOpdSelector();
</script>
